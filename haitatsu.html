// ============ 計算 ============
function priceTotalForRoute(routeIdx, price){
  var ids = routeYaokoIds(routeIdx);
  var t=0;
  ids.forEach(function(id){
    var nm = STORE_DEFS[id].name;
    var v = state.data[nm] && state.data[nm].prices && state.data[nm].prices[price];
    t += parseInt(v)||0;
  });
  return t;
}
function storeSubtotal(storeName){
  var entry = state.data[storeName];
  if(!entry || !entry.prices) return 0;
  var t=0;
  YAOKO_PRICES.forEach(function(p){ t += parseInt(entry.prices[p])||0; });
  return t;
}
// 残在庫（店舗×価格）：state.zaiko[storeName][price].zan
function zanFor(storeName, price){
  var s = state.zaiko && state.zaiko[storeName];
  if(!s || !s[price]) return null;
  return s[price];  // { zan, tenpo, sales, hasSales }
}
function zanTotalForRoute(routeIdx, price){
  var ids = routeYaokoIds(routeIdx);
  var t=0, any=false;
  ids.forEach(function(id){
    var nm = STORE_DEFS[id].name;
    var z = zanFor(nm, price);
    if(z){ t += z.zan||0; any=true; }
  });
  return any ? t : null;
}
// 全ルートのヤオコー店舗 ID
function allYaokoIds(){
  var ids=[];
  for(var i=0;i<ROUTES.length;i++){
    routeYaokoIds(i).forEach(function(id){ if(ids.indexOf(id)<0) ids.push(id); });
  }
  return ids;
}
// 全ヤオコー店舗の指定価格の納品数合計
function priceTotalAllRoutes(price){
  var t=0;
  allYaokoIds().forEach(function(id){
    var nm = STORE_DEFS[id].name;
    var v = state.data[nm] && state.data[nm].prices && state.data[nm].prices[price];
    t += parseInt(v)||0;
  });
  return t;
}
// ---- 臨時品目の商品別合計（既存4価格の合計とは完全に別枠）----
// 【対象はヤオコー店舗のみ】ids は allYaokoIds()/routeYaokoIds() を渡す。両者とも
// STORE_DEFS.type==='yaoko' で絞られているため、直売所・たまや・道の駅の臨時品目が
// 「ヤオコー納品数合計」に混入する経路が存在しない。
// 既存4価格(YAOKO_PRICES)と同じキーは念のためここでも除外する。
// 戻り: [{price:'¥300', total:150}, ...] を価格の昇順で。
function extraTotalsFor(ids){
  var m = {};
  ids.forEach(function(id){
    var def = STORE_DEFS[id];
    if(!def || def.type !== 'yaoko') return;      // 二重の防御
    var ex = extrasOf(def.name);                  // 納品指示のある臨時品目（消すまで残る）
    Object.keys(ex).forEach(function(p){
      if(YAOKO_PRICES.indexOf(p) > -1) return;
      if(!(p in m)) m[p] = 0;
      m[p] += parseInt(ex[p], 10) || 0;
    });
  });
  return Object.keys(m)
    .sort(function(a,b){ return _priceNum(a)-_priceNum(b); })
    .map(function(p){ return { price: p, total: m[p] }; });
}
function extraTotalsAllRoutes(){ return extraTotalsFor(allYaokoIds()); }
function extraTotalsForRoute(r){ return extraTotalsFor(routeYaokoIds(r)); }
// 表示ラベル: '¥300' → '+300円'
function extraTotalLabel(price){ return '+'+_priceNum(price)+'円'; }

// 全ルート総合計の各セルを即時更新（入力ごとに呼ぶ）
function updateAllRoutesTotal(){
  YAOKO_PRICES.forEach(function(p){
    var el = document.getElementById('at_'+esc(p));
    if(el) el.textContent = priceTotalAllRoutes(p);
  });
  // 臨時品目行（存在する行の数値だけ差し替える。行の増減は renderRoute 側で行う）
  extraTotalsAllRoutes().forEach(function(e){
    var el = document.getElementById('axt_'+esc(e.price));
    if(el) el.textContent = e.total;
  });
}
function updateRouteTotal(){
  YAOKO_PRICES.forEach(function(p){
    var el = document.getElementById('rt_'+esc(p));
    if(el) el.textContent = priceTotalForRoute(state.route, p);
  });
  extraTotalsForRoute(state.route).forEach(function(e){
    var el = document.getElementById('rxt_'+esc(e.price));
    if(el) el.textContent = e.total;
  });
}
// ---- 売上（単価×数量）。編集モードの最上段に出す（2026-10-06 杉さん要望）----
// 画面の単価（¥99・¥198・¥398・¥598・臨時品目の価格）×納品数をそのまま足す。税・手数料は調整しない。
// 対象はヤオコー店舗のみ（総合計と同じ ids）。臨時品目は納品指示（extrasOf）の数だけを数える。
function uriageFor(ids){
  var t = 0;
  ids.forEach(function(id){
    var def = STORE_DEFS[id];
    if(!def || def.type !== 'yaoko') return;
    var e = state.data[def.name];
    if(e && e.prices){
      YAOKO_PRICES.forEach(function(p){ t += _priceNum(p) * (parseInt(e.prices[p], 10) || 0); });
    }
    var ex = extrasOf(def.name);
    Object.keys(ex).forEach(function(p){
      if(YAOKO_PRICES.indexOf(p) > -1) return;
      t += _priceNum(p) * (parseInt(ex[p], 10) || 0);
    });
  });
  return t;
}
function uriageAllRoutes(){ return uriageFor(allYaokoIds()); }
function uriageForRoute(r){ return uriageFor(routeYaokoIds(r)); }
function fmtYen(n){ return '¥' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function _uriageHtml(){
  var _rlabel = (typeof ROUTES!=='undefined' && ROUTES[state.route] && ROUTES[state.route].label) || 'この経路';
  return '<div class="uriage">'
    + '<div class="uriage-main"><span class="uriage-ttl">💴 全ルート 売上</span><span class="uriage-v" id="uriageAll">'+fmtYen(uriageAllRoutes())+'</span></div>'
    + '<div class="uriage-sub"><span>このルート（'+eH(_rlabel)+'）</span><b id="uriageRoute">'+fmtYen(uriageForRoute(state.route))+'</b></div>'
    + '<div class="uriage-note" id="uriageNote"'+(state.dirty?'':' hidden')+'>（未保存の入力を含む）</div>'
    + '</div>';
}
// 入力ごと・保存の前後に呼ぶ（DOM が無い＝閲覧モード等では何もしない）
function updateUriage(){
  var a = document.getElementById('uriageAll');
  if(!a) return;
  a.textContent = fmtYen(uriageAllRoutes());
  var r = document.getElementById('uriageRoute');
  if(r) r.textContent = fmtYen(uriageForRoute(state.route));
  var n = document.getElementById('uriageNote');
  if(n) n.hidden = !state.dirty;
}
function updateStoreSubtotal(storeName){
  var el = document.getElementById('st_'+esc(storeName));
  if(el) el.textContent = '合計 '+storeSubtotal(storeName)+'個';
}

// ============ 描画 ============
function switchRoute(i){
  if(state.dirty && state.mode==='edit'){
    if(!confirm('編集中の変更があります。タブを切り替えると保存ボタンを押すまで保持されますが、続けますか？')){
      return;
    }
  }
  state.route=i;
  for(var j=0;j<ROUTES.length;j++){ var t=document.getElementById('tab'+j); if(t) t.classList.toggle('active',j===i); }
  renderRoute();
}
// 経路タブを ROUTES から描画（本数・ラベルとも ROUTE_VERSION に追随する）
function renderRouteTabs(){
  var el=document.getElementById('routeTabs');
  if(!el || typeof ROUTES==='undefined') return;
  var h='';
  for(var i=0;i<ROUTES.length;i++){
    h+='<button class="rtab'+(i===state.route?' active':'')+'" id="tab'+i+'" onclick="switchRoute('+i+')">'+eH(ROUTES[i].label)+'</button>';
  }
  el.innerHTML=h;
}
function toggleMode(){
  // 【2026-10-04】最新が確定するまで編集を始めさせない（古い数字を土台に保存して先祖返りさせないため）
  if(state.mode==='view' && state.view!=='fresh'){
    showToast('最新の取得が済むまで編集できません');
    return;
  }
  if(state.mode==='edit' && state.dirty){
    if(!confirm('未保存の変更があります。閲覧モードに戻すと変更は破棄されます（保存しても戻せます）。続けますか？')){
      return;
    }
    state.data = JSON.parse(JSON.stringify(state.origData||{}));
    _setDirty(false);   // 変更を捨てた
  }
  var toEdit = (state.mode==='view');
  state.mode = (toEdit?'edit':'view');
  _updateModeBtn();
  // 【2026-08-14 変更】閲覧モードでは残在庫/販売数を一切表示しなくなったので、
  // 取得も編集モードに入るときだけに戻す（GCS/GAS への無駄な往復をしない）。
  var needFetch = (state.mode === 'edit') ? _prepareZaiko() : false;
  _updateUnsavedBar();
  renderRoute();
  if(needFetch) _fetchZaiko(0);
}
// 編集モードのボタン。最新が確定していない間（取得中・失敗）は押せない。
function _updateModeBtn(){
  var b=document.getElementById('modeBtn');
  if(!b) return;
  if(state.mode==='edit'){ b.textContent='👁 閲覧モードへ'; b.classList.add('edit'); }
  else                  { b.textContent='✏️ 編集モード';   b.classList.remove('edit'); }
  b.disabled = (state.mode==='view' && state.view!=='fresh');
}

// GAS再検証を間引く最小間隔。編集モードを何度も往復しても GAS を連打しない。
var ZAIKO_REVALIDATE_MIN_MS = 30000;
// 【2026-10-04】これより前に受け取った残在庫/販売数は「最新」と扱わない（数字を消して取り直す）。
// 復帰時の納品指示の取り直し（RESUME_STALE_MS）と同じ60秒。
var ZAIKO_STALE_MS = 60000;

// 編集モードに入るときの残在庫/販売数の準備。
// 【2026-08-16】編集モードに入るたびに GAS getYaokoZaiko で再検証する（スナップショットは
//   4:30 とエスマルシェ変化検知時にしか再生成されず、日報の訂正が翌朝まで出ないため）。
//   ただし直近 ZAIKO_REVALIDATE_MIN_MS 以内に再検証が成功していれば省く。
// 【2026-10-04】端末に残した値（旧 zaiko_cache_v1）を先に描くのをやめた。最新（GAS）が届くまでは
//   「残・売 最新を取得中…」で数字を出さない。前回の取得から ZAIKO_STALE_MS 以上たっていれば
//   表示中の数字も消して取り直す。
// 戻り値: 取得を走らせるべきなら true（呼び出し側が renderRoute 後に実行する）。
function _prepareZaiko(){
  if(state.zaikoView === 'loading' || state.zaikoRevalidating) return false;   // 取得中は二重に走らせない
  var age = Date.now() - state.zaikoGasAt;
  if(state.zaikoView === 'fresh' && age < ZAIKO_REVALIDATE_MIN_MS) return false;   // 直近30秒以内に取得済み
  if(state.zaikoView === 'fresh' && age < ZAIKO_STALE_MS){
    state.zaikoRevalidating = true;   // 60秒以内：表示はそのまま、裏で確かめる
    return true;
  }
  _zaikoBeginLoad();
  return true;
}
// 残在庫/販売数を消して「取得中」にする（出どころもいったん空にする＝前の回の値をマージに持ち込まない）
function _zaikoBeginLoad(){
  state.zaikoView = 'loading';
  state.zaiko = {}; state.zaikoExtras = {}; state.zaikoDataDate = '';
  state.zaikoSrc = { gas:null, snap:null };
  state.zaikoLoaded = false; state.zaikoLoading = true; state.zaikoError = false;
  state.zaikoFromGas = false; state.zaikoRevalidating = true; state.zaikoChanged = null;
  state.zaikoFetched = true;
}

// 残在庫/販売数の状態ラベル（ヤオコー見出し横の控えめな表示）。
// 参照日は必ず state.zaikoDataDate（＝その値が実際にいつのものか）から作る。
// 戻り値の html は再取得ボタンを含むので、呼び出し側はそのまま埋め込む。
function _hhmm(ms){
  var d = new Date(ms);
  if(isNaN(d.getTime())) return '';
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function zaikoStatusLabel(){
  var zv = state.zaikoView;
  if(zv === 'loading') return { cls:'loading', html: eH('残・売 最新を取得中…') };
  if(zv === 'failed'){
    return { cls:'err', html: eH('残・売 最新を取得できませんでした（自動で再取得を続けています）')
      + '<button onclick="retryZaiko()">再取得</button>' };
  }
  if(zv !== 'fresh') return null;
  var m = String(state.zaikoDataDate||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  var isToday = (state.zaikoDataDate === todayStr);
  var asof = parseInt(m[2])+'/'+parseInt(m[3])+'時点';
  // GAS の値＝サーバの現在値そのもの。参照日が当日でない（前日フォールバック）ときは日付も必ず併記する。
  // そうしないと前日の値を「最新」と言い切ってしまう。
  if(state.zaikoRecheckFailed){
    // 60秒以内に受け取った値の再確認だけが失敗した。「最新」とは言わず、受け取った時刻を出す
    return { cls:'err', html: eH('残・売 '+(isToday ? '' : asof+'・')+_hhmm(state.zaikoGasAt)+'取得（再確認できませんでした）')
      + '<button onclick="retryZaiko()">再取得</button>' };
  }
  return { cls:'live',
           html: eH('残・売 '+(isToday ? '' : asof+'・')+'最新（'+_hhmm(state.zaikoGasAt)+'取得）'
                    + (state.zaikoRevalidating ? ' · 確認中…' : '')) };
}

function fmtLastUpdated(ts){
  // ts 形式: 'yyyy-MM-dd HH:mm:ss'
  if(!ts) return '';
  var m = ts.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
  if(!m) return ts;
  return parseInt(m[2])+'月'+parseInt(m[3])+'日 '+m[4]+':'+m[5];
}

function renderRoute(){
  try { _renderRouteUnsafe(); }
  catch(e){
    // 描画失敗時はエラー画面 + 再読込ボタンを表示（「読み込み中」で固まらないように）
    var msg = (e && e.message) ? e.message : String(e);
    document.getElementById('app').innerHTML =
      '<div class="err-box">⚠️ 画面表示でエラーが発生しました<br>'
      +'<span style="font-size:11px;color:#888">'+eH(msg)+'</span><br>'
      +'<button class="retry-btn" onclick="location.reload()">🔄 再読み込み</button></div>';
  }
}

// 商品別合計（全ルート／経路別）の下に足す臨時品目の行。
// 既存の商品別合計セルには一切触らず、その下に「+300円　150」形式で価格ごとに1行ずつ並べる。
// 臨時品目が1件も無ければ空文字を返す＝従来どおりの表示になる。
// idPrefix: 'axt_'（全ルート）/ 'rxt_'（経路別）。リアルタイム更新時の差し替え先。
function _extraTotalRowsHtml(list, idPrefix){
  if(!list || !list.length) return '';
  var h = '<div class="xt-rows">';
  list.forEach(function(e){
    h += '<div class="xt-row"><span class="xt-p">'+eH(extraTotalLabel(e.price))+'</span>'
       + '<span class="xt-v" id="'+idPrefix+esc(e.price)+'">'+e.total+'</span></div>';
  });
  return h + '</div>';
}

// 編集モードの店舗カード下部に付く「臨時品目」セクション。
// 表示対象は storeExtraPrices()（当日の納品指示があるもの＋残在庫が残っているもの）。
// 対象が無くても「＋ 追加」だけは常に出す（困りごと2＝定番外商品の追加導線）。
// 【2026-09-29】臨時品目は消すまで残るので、消し忘れに気づけるよう見出しに「追加から◯日」を出す（表示だけ）。
// 納品指示のある品目には「価格 ▾」（価格の変更）を出す。参照行（残在庫・販売数だけ）はそのまま数を入れられる。
function _extraSectionHtml(nm){
  var list = storeExtraPrices(nm);
  var ex = extrasOf(nm);
  var age = Object.keys(ex).length ? _extraAgeLabel(state.data[nm]) : '';
  var h = '<div class="ya-extra"><div class="ya-extra-hdr"><span class="ya-extra-ttl">臨時品目'
        + (age ? '<span class="ya-extra-age">'+eH(age)+'</span>' : '')
        + (list.length ? '' : '<span class="ya-extra-note">　定番外・チラシ割引など</span>')
        + '</span>'
        + '<button class="ya-extra-add" onclick="addExtraForStore(\''+eA(nm)+'\')">＋ 追加</button></div>';
  if(list.length){
    h += '<div class="ya-body ya-extra-body">';
    list.forEach(function(p){
      var z = extraZanFor(nm, p);
      var v = ex[p];
      if(v===undefined || v===null) v='';
      var zc = _zaikoCellView(nm, p, z);
      var active = ex[p]!==undefined;
      h += '<div class="ya-cell">'
         + (active ? '<button class="ya-extra-del" onclick="rmExtraForStore(\''+eA(nm)+'\',\''+eA(p)+'\')" aria-label="削除">×</button>' : '')
         + '<div class="ya-rinji-badge">臨時</div>'
         + '<div class="ya-cell-p">'+eH(p)+'</div>'
         + (active ? '<button class="ya-extra-price" onclick="changeExtraPrice(\''+eA(nm)+'\',\''+eA(p)+'\')">価格 ▾</button>' : '')
         + '<div class="ya-cell-sales'+zc.salesCls+'">'+zc.salesLbl+'</div>'
         + '<div class="ya-cell-zan'+zc.zanCls+'">'+zc.zanLbl+'</div>'
         + '<input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="'+eA(v)+'" oninput="updExtraPrice(\''+eA(nm)+'\',\''+eA(p)+'\',this.value)">'
         + '</div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}

// 閲覧モード（配達員が見る画面）の臨時品目。統合表の下に1ブロックとして出す。
// 統合表そのもの・経路合計・全ルート総合計の計算には一切関与しない。
// 【2026-08-14 修正】閲覧モードは「今日その店に何個入れるか」だけを見る画面なので、
//   納品指示数のみを表示する。残在庫・販売数（および参照日ラベル）は出さない。
//   ＝ 表示対象も storeExtraPrices() ではなく extrasOf()（有効な納品指示）に戻す。
//   在庫を見ながら数を決めるのは編集モードの仕事で、そちらは従来どおり残・売を出す。
function _extraViewHtml(yaIds){
  var rows = [];
  yaIds.forEach(function(id){
    var nm = STORE_DEFS[id].name;
    var ex = extrasOf(nm);
    // 数量が入っているものだけ。空欄（入力途中で消した等）は配達員には見せない。
    var ps = Object.keys(ex).filter(function(p){
      return ex[p] !== undefined && ex[p] !== null && String(ex[p]).trim() !== '';
    });
    if(!ps.length) return;
    ps.sort(function(a,b){ return _priceNum(a)-_priceNum(b); });
    rows.push({ nm: nm, ps: ps, ex: ex });
  });
  if(!rows.length) return '';
  var h = '<div class="ya-extra-view"><span class="ya-extra-view-ttl">➕ 臨時品目</span>';
  rows.forEach(function(r){
    r.ps.forEach(function(p){
      // 納品指示数は「→N個」と単位付きで出す（価格と数字が続くと桁を読み違えるため）
      h += '<span class="ya-extra-view-chip">'
         + eH(r.nm.replace('ヤオコー','').replace('店','')) + ' ' + eH(p)
         + '<b>→'+eH(r.ex[p])+'個</b></span>';
    });
  });
  return h + '</div>';
}

// 残在庫/販売数のセル表示。待機(取得中)・故障(取得失敗)・値なし(-) を見た目で区別する。
// hasSales=true の場合のみ実数、それ以外は「-」プレースホルダで縦揃えを維持。
// 【2026-10-04】取得中・失敗の間は数字を出さない。
function _zaikoCellView(nm, p, z){
  var zv = state.zaikoView;
  if(zv === 'loading' || zv === 'none') return { zanLbl:'残:･･･', salesLbl:'売:･･･', zanCls:' loading', salesCls:' loading' };
  if(zv === 'failed') return { zanLbl:'残:✕', salesLbl:'売:✕', zanCls:' err', salesCls:' err' };
  return { zanLbl:   z ? ('残:'+z.zan) : '残:-',
           salesLbl: (z && z.hasSales) ? ('売:'+z.sales) : '売:-',
           zanCls:   (z ? '' : ' none') + zaikoCellUpd(nm, p),
           salesCls: ((z && z.hasSales) ? '' : ' none') + zaikoCellUpd(nm, p) };
}

function _renderRouteUnsafe(){
  // shared-stores.js が未ロード（STORE_DEFS なし）の場合は固有エラーにフォールバック
  if(typeof STORE_DEFS==='undefined' || typeof ROUTES==='undefined'){
    throw new Error('店舗定義(shared-stores.js)が読み込めません');
  }
  _updateModeBtn();
  // 【2026-10-04】最新（GAS）が届くまでは数字を出さない。
  if(state.view === 'loading'){
    document.getElementById('app').innerHTML =
      '<div id="loading"><div class="spinner"></div><br>最新を取得中…'
      +'<div class="loading-retry" id="loadingRetry" style="display:none">'
      +'時間がかかっています。<button onclick="forceReload()">再試行</button></div>'
      +'</div>';
    // 5秒以上取得が続いたら再試行ボタンを表示
    if(window._loadingTimer) clearTimeout(window._loadingTimer);
    window._loadingTimer = setTimeout(function(){
      var el = document.getElementById('loadingRetry');
      if(el && state.view === 'loading') el.style.display='block';
    },5000);
    return;
  }
  if(state.view === 'failed'){
    // 【2026-10-04 追補】前回の数字を見る手段は設けない。再取得だけ
    document.getElementById('app').innerHTML =
      '<div class="err-box">⚠️ 最新を取得できませんでした<br>'
      +'<span style="font-size:12px;color:#888">'+(state.retrying ? '再取得しています…' : '自動で再取得を続けています')+'</span>'
      +'<div class="fail-btns"><button class="retry-btn" onclick="retryLatest()"'+(state.retrying?' disabled':'')+'>🔄 再取得</button>'
      +'</div></div>';
    return;
  }
  var ro = state.mode==='view' ? 'readonly' : '';
  var html = '';

  // 最終更新表示（目立たせる）
  // 【日付キー廃止】常に「最終更新：◯月◯日 ◯時」を表示。データが本当に一度も
  // 入力されていない場合のみ「未入力」。日付が変わってもデータは残る。
  // 【2026-10-04】ここに出るのは、表示している最新の数字の最終更新だけ。
  if(state.lastUpdated){
    html += '<div class="last-upd">🕐 <span>最終更新 '+eH(fmtLastUpdated(state.lastUpdated))+'</span></div>';
  } else {
    html += '<div class="last-upd none">⚠️ <span>未入力</span></div>';
  }

  // 編集モード：最上段に「全ルート総合計」＋直下に「この経路合計」（入力ミス検算用・案B上下2段）
  if(state.mode==='edit'){
    // 売上（単価×数量）を最上段に。最新が届く前（loading/failed）はここまで来ない。
    html += _uriageHtml();
    html += '<div class="all-total"><div class="all-total-ttl">📦 全ルート ヤオコー納品数 総合計</div><div class="all-total-grid">';
    YAOKO_PRICES.forEach(function(p){
      var v = priceTotalAllRoutes(p);
      html += '<div class="all-total-cell"><div class="at-p">'+eH(p)+'</div><div class="at-v" id="at_'+esc(p)+'">'+v+'</div></div>';
    });
    html += '</div>';
    html += _extraTotalRowsHtml(extraTotalsAllRoutes(), 'axt_');
    html += '</div>';
    // この経路合計（全ルート合計の直下）。入力中の値をリアルタイム反映し桁間違い等を検算。
    var _rlabel = (typeof ROUTES!=='undefined' && ROUTES[state.route] && ROUTES[state.route].label) || 'この経路';
    html += '<div class="route-total"><div class="route-total-ttl">🎯 '+eH(_rlabel)+' ヤオコー納品数 合計</div><div class="route-total-grid">';
    YAOKO_PRICES.forEach(function(p){
      var rv = priceTotalForRoute(state.route, p);
      html += '<div class="route-total-cell"><div class="rt-p">'+eH(p)+'</div><div class="rt-v" id="rt_'+esc(p)+'">'+rv+'</div></div>';
    });
    html += '</div>';
    html += _extraTotalRowsHtml(extraTotalsForRoute(state.route), 'rxt_');
    html += '</div>';
  }

  var ya = routeYaokoIds(state.route);

  // ヤオコー
  if(ya.length){
    if(state.mode==='view'){
      // 閲覧モード：統合表（納品数のみ・残在庫は編集モードで参照）
      html += '<div class="sec-lbl">🏪 ヤオコー 納品数</div>';
      html += '<div class="ya-tbl-wrap"><table class="ya-tbl"><thead><tr><th>店舗</th>';
      YAOKO_PRICES.forEach(function(p){ html+='<th>'+eH(p)+'</th>'; });
      html += '</tr></thead><tbody>';
      ya.forEach(function(id){
        var d = STORE_DEFS[id], nm=d.name;
        html += '<tr><td>'+eH(nm.replace('ヤオコー','').replace('店',''))+'</td>';
        YAOKO_PRICES.forEach(function(p){
          var v = (state.data[nm] && state.data[nm].prices && state.data[nm].prices[p]);
          var nv = parseInt(v); if(isNaN(nv)) nv=0;
          html += '<td><div class="nh-val'+(nv===0?' zero':'')+'">'+nv+'</div></td>';
        });
        html += '</tr>';
      });
      // 合計行
      html += '<tr class="total-row"><td>合計</td>';
      YAOKO_PRICES.forEach(function(p){
        var v = priceTotalForRoute(state.route, p);
        html += '<td><div class="nh-val">'+v+'</div></td>';
      });
      html += '</tr></tbody></table></div>';
      // 臨時品目（本日分の納品指示がある場合のみ）。表と合計には含めない。
      html += _extraViewHtml(ya);
    } else {
      // 編集モード：店舗ごとカード入力（既存）
      var zs = zaikoStatusLabel();
      html += '<div class="sec-lbl">🏪 ヤオコー'+(zs?'<span class="zaiko-asof'+(zs.cls?' '+zs.cls:'')+'">'+zs.html+'</span>':'')+'</div>';
      ya.forEach(function(id){
        var d = STORE_DEFS[id], nm=d.name;
        var sub = storeSubtotal(nm);
        html += '<div class="ya-card"><div class="ya-hdr"><span class="ya-icon">'+d.icon+'</span><span class="ya-name">'+eH(nm)+'</span><span class="ya-stotal" id="st_'+esc(nm)+'">合計 '+sub+'個</span></div><div class="ya-body">';
        YAOKO_PRICES.forEach(function(p){
          var v = (state.data[nm] && state.data[nm].prices && state.data[nm].prices[p]) || '';
          var zc = _zaikoCellView(nm, p, zanFor(nm, p));
          html += '<div class="ya-cell">'
                + '<div class="ya-cell-p">'+eH(p)+'</div>'
                + '<div class="ya-cell-sales'+zc.salesCls+'">'+zc.salesLbl+'</div>'
                + '<div class="ya-cell-zan'+zc.zanCls+'">'+zc.zanLbl+'</div>'
                + '<input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="'+eA(v)+'" '+ro+' oninput="updPrice(\''+eA(nm)+'\',\''+eA(p)+'\',this.value)">'
                + '</div>';
        });
        html += '</div>';
        html += _extraSectionHtml(nm);
        html += '</div>';
      });
    }
  }

  // その他（コメント）
  var ot = routeOtherIds(state.route);
  if(ot.length){
    html += '<div class="sec-lbl">🌿 その他（直売所・道の駅）</div>';
    ot.forEach(function(id){
      var d = STORE_DEFS[id], nm=d.name;
      var v = (state.data[nm] && state.data[nm].comment) || '';
      html += '<div class="cm-card"><div class="cm-hdr"><span class="cm-icon">'+d.icon+'</span><span class="cm-name">'+eH(nm)+'</span></div><div class="cm-body">';
      if(state.mode==='view' && !v){
        html += '<div class="cm-empty">（コメント未入力）</div>';
      } else {
        html += '<textarea placeholder="コメント・特記事項を入力" rows="1" '+ro+' oninput="updComment(\''+eA(nm)+'\',this.value);autoResizeTa(this)">'+eH(v)+'</textarea>';
      }
      html += '</div></div>';
    });
  }

  if(state.mode==='edit'){
    html += '<div class="save-bar"><button class="save-btn" onclick="doSave()">💾 保存する</button></div>';
  }
  document.getElementById('app').innerHTML = html;
  // 既存コメントを内容に合わせて自動展開（スクロールなし・全文表示）
  setTimeout(resizeAllComments, 0);
}

// ============ 保存 ============
// saveHaitatsu は Google Apps Script のリダイレクト層（script.google.com →
// googleusercontent.com）が連続・コールドアクセス時に一時的な 404 を返すほか、
// 応答が数秒〜数十秒までばらつく（コールドスタート＋ScriptLock 待ち）。
//
// 【2026-07-30 の障害から得た教訓】
// JSONP はリクエストをキャンセルできないため、クライアントがタイムアウトしても
// GAS 側の書き込みはそのまま成立する。旧実装は
//   ・save 側タイムアウト 15秒 ≦ GAS 側 tryLock 待ち 15秒
//   ・1.5秒間隔で最大6回リトライ
// だったため、1回目が遅延すると後続リトライが全部 ScriptLock の行列に並び、
// 必ず 15秒で打ち切られる＝「全滅表示なのにサーバには書けている」状態に陥った
// （実際に 2026-07-29 23:11:35 の書き込みが成立していた）。
// 【2026-08-05 再設計：待つのをやめ、早く見切って素早く確定させる】
// 直前の対策（タイムアウト30秒・3回・確認導線）は「安全だが遅い」に振れすぎていた。
// 最悪 30+1.5+25+2+30+1.5+25+2+30+1.5+25 ≒ 173秒 かかり実用に耐えなかった。
//
// 実測（テストGAS・2026-08-05）:
//   saveHaitatsu  : GAS実行 0.8〜6.1秒 / 総応答 p50≈4秒・p90≈9秒
//   getHaitatsu   : p50≈2.5秒・p90≈12秒
//   ScriptLock 待ち: 5並列でも最大 3.4秒（＝ロック競合は律速ではない）
//   まれに 20〜70秒の外れ値・404/HTML中間ページが出る（Google側の転送レイヤ起因）
// つまり「30秒待つ」のは p90 の3倍以上を無駄に待つ設計だった。
//
// 新方針:
//   1) タイムアウトは p90 相当（10秒）。ここで見切って即座に確認導線へ入る
//   2) ただし JSONP はキャンセルできないので、見切った後も遅延到着を拾い続ける
//      （jsonp の onLate）。遅れて success が届いたらその場で確定し再送を打ち切る
//   3) 確認(getHaitatsu)も 8秒で見切る
//   4) 全体締切 SAVE_DEADLINE を持ち、超えたら即バナーへ倒す（待たせ続けない）
//   5) 送信前に必ず localStorage へ退避。以降どこで失敗しても入力は消えない
//   6) バナーへ倒した後もバックグラウンドで再確認し、実は保存されていたら自動解消
// 配信確認用マーカー（本番URLの実応答に含まれるかで反映を判定する）
var SAVE_OPTIMISTIC_BUILD = 'save-optimistic-20260921';
var SAVE_MAX_ATTEMPTS = 3;    // 合計試行回数
var SAVE_RETRY_WAIT   = 600;  // リトライ間隔(ms)
var SAVE_TIMEOUT      = 10000;// save 専用タイムアウト(ms)。実測 p90≈9秒
var SAVE_LATE_GRACE   = 25000;// 見切った後に遅延到着を拾う猶予(ms)
var VERIFY_WAIT       = 700;  // 失敗検知からサーバ確認までの待ち(ms)
var VERIFY_TIMEOUT    = 8000; // 保存確認(getHaitatsu)のタイムアウト(ms)
var SAVE_DEADLINE     = 20000;// 新しい試行を始めてよい上限(ms)。超えたらバナーへ
var SAVE_RECHECK_MS   = [15000];  // 見切った後、裏での照合・送り直しを始めるまで(ms)。以後3分ごと（BG_EVERY）
var LS_HAITATSU_PENDING = lsKey('haitatsu_pending_v1');

// 保存セッション。1回の「保存」操作に属する試行・確認・遅延到着をまとめ、
// どれか1つが成功したら以降を全て無視する（多重確定・無駄な再送を防ぐ）。
var _saveSess = null;
function _newSaveSession(payload){
  return { id: 'S'+Date.now()+'_'+Math.random().toString(36).slice(2),
           payload: payload, t0: Date.now(), done: false, timers: [] };
}
function _sessAlive(sess){ return !!sess && !sess.done && _saveSess === sess; }
function _sessTimer(sess, fn, ms){
  var h = setTimeout(function(){ if(_sessAlive(sess)) fn(); }, ms);
  sess.timers.push(h); return h;
}
function _sessEnd(sess){
  if(!sess) return;
  sess.done = true;
  sess.timers.forEach(function(h){ clearTimeout(h); });
  sess.timers = [];
}
function _elapsed(sess){ return Date.now() - sess.t0; }

// 【楽観的UI / 件C 2026-09-21】
// 旧: showLoading の全画面オーバーレイで待たせていた。実測 p50 4秒・p90 9秒、
//     最悪 10+0.7+8+0.6+10+0.7+8 ≒ 38秒ブロックしてから alert。
//     遅さの主因は Google の転送層（シートに触らない getConfig でも p50 2.15秒）なので、
//     サーバ処理を速くしても消せない。待ち方を変えるしかない。
// 新: 画面は即座に解放し、送信と確認は裏で行う。安全網は従来どおり:
//     層1 送信前に payload を退避（haitatsu_pending_v1）
//     層2 下書き（haitatsu_draft_v1）は確認が取れるまで消さない
//     層3 失敗が確定したら固定バーを「保存できませんでした」＋再送に変える
//     層4 次回起動時にサーバと照合してから下書きバナーを出す（_verifyLocalStateThenBanner）
// 【2026-10-06 杉さん要望：再送・復元の表示をやめる】
//   ・下書き（層2）は廃止。保存ボタンを押していない入力は、アプリを消したら破棄する
//   ・押した分の退避（層1）は残す。届いたか確かめられなければ、固定バーの「再送する」・赤い帯は出さず、
//     裏で照合して送り直す（_bg*）。何度送っても届かないときだけ目立たない一行（unsent-notice.js）
//   ・サーバが受け付けなかった（success:false）ときは、その場で知らせて「未保存」に戻す（再送しても変わらないため）
function doSave(){
  // 臨時品目には必ず extrasUntil を付けて送る（GAS はこれで「until を知っている画面」と判断する）
  var payload = _normExtras(JSON.parse(JSON.stringify(state.data || {})));
  // 【最優先】送信を始める前に端末へ退避する。この時点以降、通信・タブ閉じ・
  // 端末再起動のいずれが起きても、押した内容は裏で送り直される。
  _sessEnd(_saveSess);
  var sess = _newSaveSession(payload);
  _writePending(payload, sess.id);
  _saveSess = sess;
  // 応答を待たずに画面を解放する。
  state.saveState = 'saving';
  state.dirty = false;
  state.origData = JSON.parse(JSON.stringify(payload));
  _updateUnsavedBar();
  renderRoute();
  showToast('保存中…（このまま操作できます）');
  _doSaveAttempt(0, payload, sess);
}

// 送った payload がサーバに反映されているかを比較する。
// getHaitatsu は空値を落として返す・数値を文字列で返すため、両者を正規化して突合。
function _normVal(v){ return (v===undefined || v===null) ? '' : String(v).trim(); }
function _payloadMatches(items, payload){
  if(!items || typeof items !== 'object') return false;
  var PR = ['¥99','¥198','¥398','¥598'];
  var names = Object.keys(payload || {});
  for(var i=0;i<names.length;i++){
    var exp = payload[names[i]] || {}, got = items[names[i]] || {};
    var ep = exp.prices || {}, gp = got.prices || {};
    for(var j=0;j<PR.length;j++){
      if(_normVal(ep[PR[j]]) !== _normVal(gp[PR[j]])) return false;
    }
    if(_normVal(exp.comment) !== _normVal(got.comment)) return false;
    if(!_extrasMatch(exp, got)) return false;
  }
  return true;
}
// 臨時品目の突合。GAS は空値・数値化できない値を落として返すので、
// 送信側も同じ規則（空は無し扱い・整数化）に正規化してから比べる。
function _extrasNorm(entry){
  var src = (entry && entry.extras) || {};
  var out = {};
  Object.keys(src).forEach(function(k){
    if(!/^¥\d+$/.test(k)) return;
    if(YAOKO_PRICES.indexOf(k) > -1) return;
    var n = parseInt(src[k], 10);
    if(isNaN(n)) return;
    out[k] = String(n);
  });
  return out;
}
// 【2026-09-29】終了日（extrasUntil）も突き合わせる（この画面は常に '' を送るので、
// シートに残っていた終了日が消すまでに戻ったことも確認できる）。
function _extrasMatch(exp, got){
  var a = _extrasNorm(exp), b = _extrasNorm(got);
  var ka = Object.keys(a), kb = Object.keys(b);
  if(ka.length !== kb.length) return false;
  for(var i=0;i<ka.length;i++){
    if(a[ka[i]] !== b[ka[i]]) return false;
    if(_extraUntil(exp, ka[i]) !== _extraUntil(got, ka[i])) return false;
  }
  return true;
}

function _nowStamp(){
  var nd=new Date();
  return nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-'+String(nd.getDate()).padStart(2,'0')
    +' '+String(nd.getHours()).padStart(2,'0')+':'+String(nd.getMinutes()).padStart(2,'0')+':'+String(nd.getSeconds()).padStart(2,'0');
}

function _saveSucceeded(payload, toastMsg){
  hideLoading();
  _clearPending();
  state.saveState = '';
  // 保存中に人がまた入力していたら、未保存のまま残す（新しい入力を守る）。
  if(state.dirty){ _updateUnsavedBar(); }
  else           { _setDirty(false); }   // 固定バーを消す
  state.origData = JSON.parse(JSON.stringify(payload));
  state.lastUpdated = _nowStamp();
  state.freshAt = Date.now();   // サーバが保存を受け付けた＝この内容が最新
  renderRoute();
  showToast(toastMsg);
  // 「保存してから移動」で離脱待ちだった場合はここで移動する（保存成功時のみ）
  if(_pendingLeaveHref){
    var h = _pendingLeaveHref; _pendingLeaveHref = null; _leaving = true;
    setTimeout(function(){ window.location.href = h; }, 700);
  }
}

function _doSaveAttempt(attempt, payload, sess){
  if(!_sessAlive(sess)) return;
  // 【件C】画面は覆わない。進行は固定バーの「保存中…」だけで示す。
  state.saveState = 'saving';
  _updateUnsavedBar();
  var dataStr = encodeURIComponent(JSON.stringify(payload));
  // 日付キー廃止：saveHaitatsu は常に最新1セットを店舗名キーで upsert
  // _cb: キャッシュバスター。Google 側リダイレクト状態のリフレッシュを促し 404 を軽減
  var url = API_URL+'?action=saveHaitatsu&data='+dataStr+'&_cb='+Date.now()+'_'+attempt;
  // 保存と送信の記録用。reqId は1回の「保存」操作ごと（再送は同じ値）。GAS は記録するだけで保存の処理には使わない
  try{ url += '&reqId='+encodeURIComponent(sess.id) + _auditQuery({ via:'jsonp', n:attempt+1 }); }catch(e){}
  jsonp(url, 'cb_save', function(res){
    if(!_sessAlive(sess)) return;
    if(res && res.success){
      _saveSucceeded2(sess, payload, '✅ 保存しました（'+res.saved+'件）');
    } else if(res && res.retryable){
      // GAS 側が ScriptLock を取れなかった（他の処理と競合）。
      // 書き込みは行われていないので確認を挟まず、短い間隔ですぐ再送する。
      _retryOrGiveUp(attempt, payload, 'サーバ混雑', sess);
    } else {
      // GAS が応答した success:false はデータ起因（invalid data 等）で、
      // 同じ data を再送しても結果は変わらない。行は書かれていないので、その場で知らせて未保存に戻す
      // （画面の値はそのまま。もう一度「保存する」を押せる。2026-10-06 から再送ボタンは出さない）。
      _sessEnd(sess);
      hideLoading();
      _clearPending();
      state.saveState = '';
      _setDirty(true);
      showToast('⚠ 保存に失敗しました'+((res&&res.error)?('：'+res.error):''));
    }
  }, function(){
    // タイムアウト or 通信失敗。JSONP はキャンセルできないのでサーバ側では
    // 書き込みが成立している可能性がある。再送の前に必ず確認する。
    if(!_sessAlive(sess)) return;
    _verifyThenRetry(attempt, payload, '応答待ち切れ', sess);
  }, SAVE_TIMEOUT, {
    lateGraceMs: SAVE_LATE_GRACE,
    // 見切った後に本来の応答が届いた場合。成功していれば即確定し、
    // 進行中の確認・再送を全部止める（2〜3分コースに入るのを防ぐ主役）。
    onLate: function(res){
      if(!_sessAlive(sess)) return;
      if(res && res.success){
        _saveSucceeded2(sess, payload, '✅ 保存しました（応答が遅れて到着）');
      }
    }
  });
}

// 失敗検知後：サーバに実際に保存されたかを確認し、
//   保存済み → 成功扱い（誤った失敗表示と無駄な再送を止める）
//   未保存   → 残り試行があれば再送、無ければ入力を退避して案内
// 【件C】outcome を持ち回る。'notsaved'＝サーバの値と一致しないと確定、
// 'unknown'＝確認そのものができなかった。最終的な文言を分けるために必要で、
// 通信失敗を「保存できませんでした」と断定しないための要。
function _verifyThenRetry(attempt, payload, reason, sess){
  if(!_sessAlive(sess)) return;
  state.saveState = 'saving';
  _updateUnsavedBar();
  _sessTimer(sess, function(){
    jsonp(API_URL+'?action=getHaitatsu&_cb='+Date.now(), 'cb_verify', function(res){
      _applyIrai(res);
      if(!_sessAlive(sess)) return;
      if(res && res.success && _payloadMatches(res.items, payload)){
        _saveSucceeded2(sess, payload, '✅ 保存されていました（サーバで確認）');
        return;
      }
      _retryOrGiveUp(attempt, payload, reason, sess, (res && res.success) ? 'notsaved' : 'unknown');
    }, function(){
      // 確認自体も失敗 → 保存できたか不明。再送で確定させる
      if(!_sessAlive(sess)) return;
      _retryOrGiveUp(attempt, payload, reason, sess, 'unknown');
    }, VERIFY_TIMEOUT, {
      lateGraceMs: SAVE_LATE_GRACE,
      onLate: function(res){
        if(!_sessAlive(sess)) return;
        if(res && res.success && _payloadMatches(res.items, payload)){
          _saveSucceeded2(sess, payload, '✅ 保存されていました（確認応答が遅れて到着）');
        }
      }
    });
  }, VERIFY_WAIT);
}

function _retryOrGiveUp(attempt, payload, reason, sess, outcome){
  if(!_sessAlive(sess)) return;
  // 全体締切を超えていたら、残り試行があっても待たせない。
  // 入力は退避済みで、この後もバックグラウンド再確認と再送導線が効く。
  if(attempt < SAVE_MAX_ATTEMPTS-1 && _elapsed(sess) < SAVE_DEADLINE){
    state.saveState = 'saving';
    _updateUnsavedBar();
    _sessTimer(sess, function(){ _doSaveAttempt(attempt+1, payload, sess); }, SAVE_RETRY_WAIT);
  } else {
    _giveUpToBackground(sess);
  }
}

// 見切り。押した内容は退避済み。【2026-10-06】固定バーの「再送する」・帯・トーストは出さず、
// 画面は保存できたときと同じ見た目に戻して、照合と送り直しは裏（_bg*）に任せる。
function _giveUpToBackground(sess){
  _sessEnd(sess);
  hideLoading();
  state.saveState = '';
  _updateUnsavedBar();
  _bgArm(SAVE_RECHECK_MS[0]);
}

// セッション付きの成功確定。二重確定を防ぎつつ既存の成功処理へ委譲する。
function _saveSucceeded2(sess, payload, msg){
  _sessEnd(sess);
  _saveSucceeded(payload, msg);
}

// ---- 保存ボタンを押した内容の退避 ----
// { items: 送った内容, at: 押した時刻（'YYYY-MM-DD HH:MM:SS'）, first: 押した時刻(ms), tries: 送った回（その場の保存＝1）,
//   req: 保存の操作ID（保存送信ログの reqId）, stop: ''／'rejected'（受け付けられなかった） }
function _writePending(payload, req){
  _savePendingObj({ items: payload, at: _nowStamp(), first: Date.now(), tries: 1, req: req || '', stop: '' });
}
function _savePendingObj(o){
  try { localStorage.setItem(LS_HAITATSU_PENDING, JSON.stringify(o)); } catch(e){}
}
function _clearPending(){
  try { localStorage.removeItem(LS_HAITATSU_PENDING); } catch(e){}
}
function _readPending(){
  try {
    var raw = localStorage.getItem(LS_HAITATSU_PENDING);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || !o.items) return null;
    // 2026-10-06 より前の版の退避（items と at だけ）は、at から押した時刻を補う
    if(!o.first){ var t = new Date(String(o.at||'').replace(' ', 'T')).getTime(); o.first = isNaN(t) ? Date.now() : t; }
    if(!o.tries) o.tries = 1;
    return o;
  } catch(e){ return null; }
}

// ---- 裏での照合と送り直し（2026-10-06）----
// 画面には何も出さない。サーバの値と一致すれば消す。一致しなければ同じ内容を送り直す。
// ただし押した後に別の保存（ほかの端末・この端末の後の保存）があれば、上書きしないよう送り直さない
// （saveHaitatsu は全店舗の最新1セットを上書きするため、古い内容で新しい保存を戻してしまう）。
// 照合と送り直しは、起動直後の最新の受け取り・見切りの15秒後・以後3分ごと・前面復帰・電波復帰で行う。
// 【2026-10-06 追補】照合（getHaitatsu）が失敗・応答なしでも「届いていない」とは数えない（次の照合を予約するだけ）。
// 一行の回数は「照合でサーバの値と違うと確定して送り直した回数」（tries−1）。24時間の条件は、この画面で照合を終えた後だけ（_bgSeen）。
// 押した後に別の保存があった（superseded）ものは、押した分が届いていた可能性もあり確かめようがないので、黙って消す。
var BG_EVERY = 180000;
var _bgTimer = null, _bgBusy = false, _bgStartup = true, _bgSeen = false;
// unsent-notice.js を読み込めなかった端末：送り直しは続け、一行は出さない
function _un(){
  return window.Unsent || { RESEND:true, due:function(){ return false; }, expired:function(){ return false; },
                            md:function(v){ return String(v||''); }, render:function(){} };
}
function _bgArm(ms){
  clearTimeout(_bgTimer); _bgTimer = null;
  var p = _readPending();
  if(!p || p.stop) return;
  _bgTimer = setTimeout(_bgRun, ms == null ? BG_EVERY : ms);
}
function _bgRun(){
  _bgTimer = null;
  var p = _readPending();
  if(!p || p.stop){ _updateUnsentLine(); return; }
  if(_bgBusy || _sessAlive(_saveSess)){ _bgArm(); return; }   // その場の保存が進行中なら任せる
  _bgBusy = true;
  jsonp(API_URL+'?action=getHaitatsu&_cb='+Date.now(), 'cb_bgchk', function(res){
    _applyIrai(res);
    _bgBusy = false; _bgSeen = true;
    if(res && res.success && res.items) _bgDecide(p, res.items, res.lastUpdated || '', _bgReload);
    else { _bgArm(); _updateUnsentLine(); }
  }, function(){ _bgBusy = false; _bgSeen = true; _bgArm(); _updateUnsentLine(); }, VERIFY_TIMEOUT);
}
// サーバの値（items・lastUpdated）と退避を突き合わせて決める。done(kind)：'match'／'resent'／'other'
function _bgDecide(p, items, lastUpdated, done){
  var cur = _readPending();
  if(!cur || cur.req !== p.req || cur.stop){ _updateUnsentLine(); return done('other'); }
  _bgSeen = true;
  if(_payloadMatches(items, cur.items)){ _bgDelivered(cur.req); return done('match'); }
  if(lastUpdated && lastUpdated > cur.at){
    // 後から別の保存があった：送り直すと新しい保存を古い内容で戻してしまう。届いていたかも確かめられないので黙って消す
    _bgDelivered(cur.req);
    return done('other');
  }
  _bgSend(cur, done);
}
function _bgSend(cur, done){
  cur.tries = (cur.tries || 1) + 1;
  _savePendingObj(cur);
  _updateUnsentLine();
  _bgBusy = true;
  var fin = false;
  function end(kind){
    if(fin) return; fin = true; _bgBusy = false;
    if(kind === 'ok') _bgDelivered(cur.req); else { _bgArm(); _updateUnsentLine(); }
    done(kind === 'ok' ? 'resent' : 'other');
  }
  var url = API_URL+'?action=saveHaitatsu&data='+encodeURIComponent(JSON.stringify(cur.items))+'&_cb='+Date.now();
  try{ url += '&reqId='+encodeURIComponent(cur.req || '') + _auditQuery({ via:'jsonp', why:'auto', n:cur.tries }); }catch(e){}
  jsonp(url, 'cb_bgsave', function(res){
    if(res && res.success) return end('ok');
    if(res && res.success === false && !res.retryable){
      var o = _readPending();
      if(o && o.req === cur.req){ o.stop = 'rejected'; o.reason = String(res.error || ''); _savePendingObj(o); _updateUnsentLine(); }
    }
    end('fail');
  }, function(){ end('fail'); }, SAVE_TIMEOUT, {
    lateGraceMs: SAVE_LATE_GRACE,
    onLate: function(res){ if(res && res.success) _bgDelivered(cur.req); }
  });
}
function _bgDelivered(req){
  var cur = _readPending();
  if(!cur || cur.req !== req) return;
  _clearPending();
  clearTimeout(_bgTimer); _bgTimer = null;
  _updateUnsentLine();
}
// 送り直しが届いたら、画面を黙って最新に直す（入力中・保存中・取得中は触らない）
function _bgReload(kind){
  if(kind === 'other') return;
  if(state.view === 'fresh' && !state.dirty && !state.saveState) _latestFetch.load();
}
// 起動直後の最新の受け取り：退避があれば、先に照合・送り直しを済ませてから描く
// （古い土台のまま編集に入って、押した内容を上書きしないため。待つ間は「最新を取得中…」のまま）。
// 戻り値 true＝こちらで引き取った
function _bgHoldLatest(res){
  if(!_bgStartup) return false;
  _bgStartup = false;
  var p = _readPending();
  if(!p || p.stop || _bgBusy) return false;
  _bgDecide(p, res.items, res.lastUpdated || '', function(kind){
    if(kind === 'resent') _latestFetch.load();
    else _applyLatest(res.items, res.lastUpdated || '');
  });
  return true;
}
// 起動時：7日を過ぎた退避は消す。設定で「送り直さない」なら残っている分を消す
function _bgTidy(){
  var un = _un(), p = _readPending();
  if(p && (!un.RESEND || un.expired(p.first))) _clearPending();
}
// 何度送っても届かないときだけ、目立たない一行（出す条件・出す／出さないは unsent-notice.js）
function _updateUnsentLine(){
  var un = _un(), p = _readPending(), lines = [];
  if(p && un.due(p.first, (p.tries || 1) - 1, p.stop === 'rejected', Date.now(), _bgSeen)){
    var who = un.md(p.first) + ' ' + String(p.at||'').slice(11, 16) + ' の配達商品情報の保存';
    lines.push(p.stop === 'rejected' ? who + 'をサーバが受け付けませんでした' + (p.reason ? '（' + p.reason + '）' : '')
             :                         who + 'がサーバに届いていません');
  }
  un.render(lines);
}

// ============ 未保存の入力を守る（固定バー＋3層）============
// 【2026-09-10 追加】保存ボタンを押さずにアプリを閉じて入力が消える事故が2〜3回。
// 主因は保存ボタンが文書末尾にしか無く、しかも position:sticky の保存バーが
// z-index:100 の固定フッターの裏に潜り込んでスクロール途中では見えなかったこと。
// 対策の主役は「未保存バーの固定表示」(.unsaved-bar)で、以下の3層はその保険。
//   層1 入力のたびに端末へ下書きを退避する（GASへは送らない）
//   層2 離脱しようとしたら警告する（アプリ内リンクはその場で保存できる）
//   層3 次回起動時に下書きがあればバナーで復元/破棄を選ばせる
//
// 【自動保存（GASへの自動送信）は採用しない】
// 臨時品目のH列JSONで、失効した extras を落とした状態で保存するとH列が空で
// 上書きされる事故が過去にあり、そのときの対処が「保存ボタンを押さないでください」
// という周知だった。自動送信はその避難路を潰すため入れない。下書きは端末内に
// 留め、サーバへ書くのは人が保存ボタンを押したときだけ。
// 【2026-10-06 廃止】層1（下書きの自動退避 haitatsu_draft_v1）と層3（次回起動時の復元バナー）。
// 保存ボタンを押していない入力は、アプリを消したら破棄する（杉さん要望）。固定バーと離脱警告（層2）は残す。

// state.dirty の変更は必ずここを通す。固定バーと状態がずれないようにする。
function _setDirty(v){
  state.dirty = !!v;
  _updateUnsavedBar();
  updateUriage();   // 入力はすべてここを通る（state.data を書いた後に呼ばれる）
}
// 固定バーの状態（件C / 2026-09-21）。
//   ''        … 変更なし。バーを出さない
//   'dirty'   … 未保存の変更がある → 保存ボタン
//   'saving'  … 送信中／確認中。画面は止めない → ボタンなし
// 【2026-10-06】'failed'（保存できませんでした）／'unknown'（確認できませんでした）＋「再送する」は廃止。
// 届いたか確かめられないものは裏で送り直す（_bg*）。
function _saveBarState(){
  return state.saveState === 'saving' ? 'saving' : '';
}
function _updateUnsavedBar(){
  var bar = document.getElementById('unsavedBar');
  if(!bar) return;
  var st    = _saveBarState();
  var dirty = !!state.dirty;
  var show  = (state.mode === 'edit' && (dirty || st !== ''));
  bar.hidden = !show;
  bar.className = 'unsaved-bar' + (st ? ' sb-' + st : '');
  var lbl = document.getElementById('unsavedLbl');
  var act = document.getElementById('unsavedAct');
  if(!lbl || !act) { if(show) document.body.classList.add('has-unsaved'); else document.body.classList.remove('has-unsaved'); return; }
  if(dirty){
    // 保存中でも、その後に入力があれば「いま画面にある値を保存する」が要る。
    lbl.textContent = (st === 'saving') ? '● 未保存（前の保存を送信中…）' : '● 未保存';
    act.innerHTML = '<button class="save-btn" onclick="doSave()">💾 保存する</button>';
  } else if(st === 'saving'){
    lbl.textContent = '● 保存中…';
    act.innerHTML = '';
  }
  // 文書末尾が固定バーに隠れないよう本文の下端余白を増やす／戻す
  if(show) document.body.classList.add('has-unsaved');
  else     document.body.classList.remove('has-unsaved');
}

// ---- 層2: 離脱時の警告 ----
// 【0-4 の判定】Android Chrome と、ホーム画面に追加した PWA(standalone) で
// 確実に発火するのは visibilitychange の hidden だけ。
//   ・visibilitychange(hidden) … タブ切替・ホームボタン・アプリスワイプ終了・
//       画面消灯のいずれでも発火する。OSがプロセスを破棄する前の最後の機会。
//   ・pagehide … 遷移・破棄では発火するが、PWAのタスクスワイプ終了では
//       発火しないことがある（bfcache入りとプロセス終了で挙動が割れる）。
//   ・beforeunload … タブを閉じる/戻る/リロードでは効くが、モバイルの
//       アプリ終了では発火しない。さらに標準ダイアログは文言を差し替えられず、
//       独自ボタンも置けない仕様（Chrome）。
// したがって役割を分ける:
//   アプリ内リンクでの離脱 → 自前モーダル（＝その場で保存できるボタンを置ける）
//   タブを閉じる/戻る/リロード → beforeunload の標準ダイアログ（保険）
//   常時の警告             → 固定バー .unsaved-bar 自体（保存ボタン付き）
// 【2026-10-06】アプリを消したとき（visibilitychange hidden）の下書きの書き込みは廃止（アプリを消したら破棄）。
var _pendingLeaveHref = null;   // 「保存してから移動」の待ち先
var _leaving = false;           // 自前導線での離脱中。beforeunload を二重に出さない

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'hidden'){
    _updateUnsavedBar();       // 復帰時に未保存なら保存ボタン付きバーを出し直す
  }
});
window.addEventListener('beforeunload', function(e){
  if(_leaving) return;                                  // 自前モーダルで合意済み
  if(!(state.dirty && state.mode === 'edit')) return;   // 変更が無ければ警告しない
  e.preventDefault();
  e.returnValue = '';
  return '';
});

// アプリ内リンク（🏠 ホームに戻る / 📝 日報入力へ）からの離脱を捕まえる。
// ここは自前モーダルを出せる＝「その場で保存する」ボタンを置ける唯一の離脱経路。
function _bindLeaveGuards(){
  var links = document.querySelectorAll('.footer a, .nippo-link-btn');
  for(var i=0;i<links.length;i++){
    links[i].addEventListener('click', function(e){
      if(!(state.dirty && state.mode === 'edit')) return;   // 変更が無ければ素通し
      e.preventDefault();
      _showLeaveModal(this.getAttribute('href'));
    });
  }
}
function _showLeaveModal(href){
  var ov = document.createElement('div');
  ov.className = 'price-modal-ov';
  ov.innerHTML = '<div class="price-modal"><div class="price-modal-ttl">未保存の変更があります</div>'
    + '<div class="leave-modal-msg">保存せずに移動すると、入力した内容は破棄されます。</div>'
    + '<div class="leave-modal-btns">'
    + '<button type="button" class="leave-save">💾 保存してから移動</button>'
    + '<button type="button" class="leave-go">保存せずに移動</button>'
    + '<button type="button" class="leave-cancel">この画面に戻る</button>'
    + '</div></div>';
  document.body.appendChild(ov);
  function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.querySelector('.leave-save').onclick   = function(){ close(); _pendingLeaveHref = href; doSave(); };
  ov.querySelector('.leave-go').onclick     = function(){ close(); _leaving = true; window.location.href = href; };
  ov.querySelector('.leave-cancel').onclick = function(){ close(); };
  ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
}

/// ============ 最新だけを表示する（2026-10-04 杉さん要望）============
// 従来（SWR）は 端末に残した値（localStorage）→ スナップショット（haitatsu.json）→ GAS の順に描いていたため、
// 開いた直後に古い納品数が出て2〜3秒後に最新へ切り替わっていた。最終更新の表示を見て
// 「これが正しい」と思い、古い数字で商品を持って行くミスにつながる。
//   ・起動時・復帰時（最新の受け取りから RESUME_STALE_MS 以上）は数字を出さず「最新を取得中…」。
//     GAS getHaitatsu の応答で確定してから描く
//   ・スナップショット（haitatsu.json）は使わない。getHaitatsu はシートを直接読む（保存でキャッシュも消える）ので、
//     スナップショットが GAS の応答より新しいことは無い
//   ・取得できなければ数字なしで「最新を取得できませんでした」＋再取得。裏で自動の再取得を続ける。
//     前回の数字を見る手段は設けない（杉さん決定 2026-10-04 09:54）。納品数・残在庫/販売数は端末にも残さない
//   ・最新が確定するまで編集モードに入れない（toggleMode。restoreDraft・resendPending は 2026-10-06 に廃止）
// 【2026-10-04 失敗画面を減らす】取得は makeLatestFetcher（4秒・すぐエラーで2本目、遅れた応答は90秒まで受け取る、
// 失敗後は 5秒後・15秒後・以後60秒ごとに自動で取り直す）。旧：すぐエラーなら2本目を出さずに失敗・遅れは25秒まで・
// 自動の取り直しは8秒後に1回だけ（残在庫・販売数は手動だけ）。
var LATEST_ONLY_BUILD = 'latest-only-20261004';   // 本番反映の確認用マーカー
var RESUME_STALE_MS   = 60000;
function forceReload(){ location.reload(); }

function _applyHaitatsuData(items, lastUpdated){
  // 【2026-09-29】臨時品目を読み込み時に落とすのはやめた（消すまで残す）。
  // ここでは各品目の終了日（extrasUntil）を ''（消すまで）にそろえる正規化だけを行う。
  // 【2026-08-14 修正・重要】必ずコピーしてから正規化する。渡されたオブジェクト（サーバの生データ）は書き換えない
  // （2026-08-14 に坂戸千代田店の¥300×4 がその端末だけ消えたままになった事故の原因）。
  state.data = _normExtras(JSON.parse(JSON.stringify(items || {})));
  state.lastUpdated = lastUpdated || '';
  state.origData = JSON.parse(JSON.stringify(state.data));
  state.loaded = true;
  renderRoute();
}

// 1本出す（makeLatestFetcher の send）。_cb は途中の HTTP キャッシュに古い応答を返させないため
function _sendJsonp(url, base){
  return function(ok, err, late, t, l, fl){
    jsonp(url+'&_cb='+Date.now()+'_'+Math.random().toString(36).slice(2,6), base, ok, err, t,
      { lateGraceMs: l, onLate: late, flog: fl });
  };
}

var _latestFetch = makeLatestFetcher({
  action: 'getHaitatsu',
  send: _sendJsonp(API_URL+'?action=getHaitatsu', 'cb_get'),
  isOk: function(res){ _applyIrai(res); return !!(res && res.success && res.items); },
  onData: function(res){ if(_bgHoldLatest(res)) return; _applyLatest(res.items, res.lastUpdated || ''); },
  onFail: function(){ _latestFailed(); }
});
// 数字を消して「最新を取得中…」にし、取りに行く（起動時・復帰時）
function _beginLatestLoad(){
  state.view = 'loading';
  state.loaded = false;
  state.retrying = false;
  _updateUnsavedBar();
  renderRoute();
  _latestFetch.load();
}
function _applyLatest(items, lastUpdated){
  state.retrying = false;
  state.view = 'fresh';
  state.freshAt = Date.now();
  // 入力中（保存中）の値は上書きしない。最新が確定する前は編集できないので、通常ここには来ない
  if(state.dirty || state.saveState === 'saving'){ renderRoute(); return; }
  _applyHaitatsuData(items, lastUpdated);
}
function _latestFailed(){
  state.retrying = false;
  if(state.view === 'loading') state.view = 'failed';
  renderRoute();
}
// 失敗の画面の「再取得」：失敗の画面のまま取りに行き、届いたら描く（自動の取り直しと同じ経路）
function retryLatest(){
  if(state.view === 'fresh' || state.retrying || _latestFetch.busy()) return;
  state.retrying = true;
  _latestFetch.retry();
  renderRoute();
}

// 復帰時（アプリ・タブに戻ったとき）。
//   ・日付が変わっていたら開き直す（「今日」の判定は画面を開いた時点の日付で持っているため）
//   ・最新の受け取りから RESUME_STALE_MS 以上たっていれば、数字を消して取り直す
//   ・編集中（未保存・保存中）は納品数に触らず、残在庫/販売数だけ取り直す
function _localYmd(){
  var n = new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}
function _onForegroundLatest(){
  var busy = state.dirty || !!state.saveState;
  if(_localYmd() !== todayStr){ if(!busy){ _leaving = true; location.reload(); } return; }
  // 取得中・失敗の表示中：始めてから4秒以上たった取得を捨てて出し直す（スリープ中に宙に浮いた要求を待ち続けない）
  if(state.view !== 'fresh'){ _latestFetch.kick(); return; }
  // 編集モードで残在庫/販売数が取得中・失敗なら、同じく出し直す
  if(state.mode === 'edit' && (state.zaikoView !== 'fresh' || state.zaikoRecheckFailed || state.zaikoRevalidating)) _kickZaiko();
  if(Date.now() - state.freshAt < RESUME_STALE_MS) return;
  if(state.mode === 'edit' && busy){
    if(_prepareZaiko()){ renderRoute(); _fetchZaiko(0); }
    return;
  }
  if(state.mode === 'edit'){ state.mode = 'view'; _updateModeBtn(); }   // 編集は最新が確定してから入り直す
  _beginLatestLoad();
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible'){ try{ _onForegroundLatest(); }catch(e){} try{ if(!_bgStartup) _bgArm(0); }catch(e){} }
});
window.addEventListener('online', function(){ try{ _onForegroundLatest(); }catch(e){} try{ if(!_bgStartup) _bgArm(0); }catch(e){} });
window.addEventListener('pageshow', function(e){ if(e.persisted){ try{ _onForegroundLatest(); }catch(err){} } });

// ============ 店舗依頼ボードのアラート（2026-10-03）============
// getHaitatsu の応答の irai（未完了の依頼すべて。近い順に最大50件）を、配達データの更新判定（lastUpdated）とは
// 関係なく、応答が届くたびに反映する。スナップショット（haitatsu.json）には載らないので、
// GAS の応答が届いた時点で出る。
// 帯は #app の直前（stale_notice などと同じ差し込み方）。押すと小窓に内容、そこから依頼ボードへ。
function _applyIrai(res){
  if(!res || !res.success || !res.irai || typeof IraiNotice === 'undefined') return;
  state.irai = res.irai;

}
function _renderIraiNotice(){
  if(typeof IraiNotice === 'undefined') return;
  IraiNotice.render(state.irai, { onNavigate: function(href){

    else window.location.href = href;

function loadInitial(){
  // 端末に残した値もスナップショットも先に描かない（上の方針）。
  // 【2026-08-14 変更】残在庫/販売数は編集モード専用の表示なので、初期表示（＝閲覧モード）では取得しない。
  _beginLatestLoad();
}

// 再検証で数字が変わった店舗×価格を洗い出す。固定4価格(items)と臨時(extras)を
// 同じ規則で見るので、両者の挙動が割れない。初回表示（旧値が無い）は光らせない。
function _zaikoChangedKeys(oldItems, newItems, oldEx, newEx){
  var ch = {}, n = 0;
  function num(v){ return parseInt(v,10)||0; }
  function walk(o, nw){
    Object.keys(nw||{}).forEach(function(sn){
      var per = nw[sn] || {};
      Object.keys(per).forEach(function(p){
        var a = o && o[sn] && o[sn][p];
        if(!a) return;                 // 旧値が無い＝初回。ハイライト対象外
        var b = per[p] || {};
        if(num(a.zan) !== num(b.zan) || num(a.sales) !== num(b.sales)){
          ch[sn+''+p] = true; n++;
        }
      });
    });
  }
  walk(oldItems, newItems);
  walk(oldEx, newEx);
  return n ? ch : null;
}
function zaikoCellUpd(storeName, price){
  return (state.zaikoChanged && state.zaikoChanged[storeName+''+price]) ? ' upd' : '';
}

// ============ 残在庫/販売数の出どころマージ（件A / 2026-09-21）============
// 【なぜ必要か】2026-09-08 18:42、ヤオコー皆野店で
//   スナップショット(18:41生成) ¥198 売11/残33 ← 新しい
//   GAS getYaokoZaiko          ¥198 売7 /残37 ← 古い（L2キャッシュの遅れ）
// となり、従来の「GASが返ればスナップショットを捨てる」優先順位のせいで
// 新しい値を古い値が上書きした（tenpo はどちらも44で一致）。18:47には解消。
// 逆向きも起きる: 2026-09-21 18:55 の実測では
//   スナップショット(13:41生成) ¥198 売3  ← 5時間古い（snapshot_writer が
//                                            Cloud Run の120秒タイムアウトで落ちた）
//   GAS                        ¥198 売17 ← 正しい
// つまり「どちらが新しいか」は固定できない。片側を優先する設計では必ずどちらかで逆行する。
//
// 【採る規則】販売数は1日の中で減らない（変わらないことはある）という性質を使う。
//   tenpo    : GAS を優先（日報の訂正が即時に効くのは GAS 経路だけ）→ snap
//   sales    : 出どころの中で最大（＝いちばん新しい）
//   hasSales : どれかが真なら真
//   zan      : 下の式で再計算（各出どころの zan は採用しない）
//   片方にしか無いセルは、ある方をそのまま使う
//
// 【参照日をまたいで混ぜない】actualDate が違う出どころは同じ日のデータではないので、
// いちばん新しい参照日のものだけでマージする。これをしないと前日の販売数が
// 当日の max に持ち込まれる（朝、当日データが出る前は前日値を表示する仕様のため）。
var ZAIKO_MERGE_BUILD = 'zaiko-merge-20260921';

function _zaikoNum(v){ var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }

// 残在庫の式。snapshot_writer._compute_zaiko_from_all_data / GAS getYaokoZaiko /
// GAS _computeExtraZaiko_ の3箇所と厳密に同じにすること。
//   chin  = 陳列数(新形式) > 0 ? 陳列数 : S+A+B+C品     ← tenpo に含めて渡ってくる
//   tenpo = chin + 蘇生庫 + 値引き
//   zan   = hasSales ? max(tenpo - 販売数, 0) : tenpo
function _zaikoZan(tenpo, sales, hasSales){
  return hasSales ? Math.max(_zaikoNum(tenpo) - _zaikoNum(sales), 0) : _zaikoNum(tenpo);
}

// 同一 店舗×価格 のセルを、出どころの配列からマージする。
// cells: [{src:'gas'|'snap', e:{zan,tenpo,sales,hasSales}}, ...]
// 【2026-10-04】端末に残した値はマージ元にしない。この回に取得した GAS とスナップショットだけ。
var _ZAIKO_TENPO_PREF = ['gas', 'snap'];
function _mergeZaikoCell(cells){
  var sales = 0, hasSales = false, tenpo = null;
  for(var i = 0; i < cells.length; i++){
    var e = cells[i].e || {};
    var sv = _zaikoNum(e.sales);
    if(sv > sales) sales = sv;                 // 販売数は大きい方＝新しい方
    if(e.hasSales === true) hasSales = true;   // どれかが真なら真
  }
  for(var k = 0; k < _ZAIKO_TENPO_PREF.length && tenpo === null; k++){
    for(var j = 0; j < cells.length; j++){
      if(cells[j].src === _ZAIKO_TENPO_PREF[k]){ tenpo = _zaikoNum((cells[j].e || {}).tenpo); break; }
    }
  }
  if(tenpo === null) tenpo = 0;
  return { zan: _zaikoZan(tenpo, sales, hasSales), tenpo: tenpo, sales: sales, hasSales: hasSales };
}

// items（固定4価格）と extras（臨時品目）は入れ物が違うだけで構造が同じなので、
// 同じ関数でマージする（両者の挙動が割れないようにするため）。
function _mergeZaikoTree(use, key){
  var bag = {};
  use.forEach(function(x){
    var tree = x.d[key] || {};
    Object.keys(tree).forEach(function(sn){
      var per = tree[sn] || {};
      Object.keys(per).forEach(function(pr){
        if(!per[pr] || typeof per[pr] !== 'object') return;
        if(!bag[sn]) bag[sn] = {};
        if(!bag[sn][pr]) bag[sn][pr] = [];
        bag[sn][pr].push({ src: x.src, e: per[pr] });
      });
    });
  });
  var out = {};
  Object.keys(bag).forEach(function(sn){
    out[sn] = {};
    Object.keys(bag[sn]).forEach(function(pr){ out[sn][pr] = _mergeZaikoCell(bag[sn][pr]); });
  });
  return out;
}

// gas / snap のうち、参照日がいちばん新しいものだけをマージして返す。
// 出どころが1つも無ければ null。
function _mergeZaikoSources(){
  var srcs = [];
  ['gas', 'snap'].forEach(function(k){
    var d = state.zaikoSrc[k];
    if(d && d.dataDate) srcs.push({ src: k, d: d });
  });
  if(!srcs.length) return null;
  var newest = '';
  srcs.forEach(function(x){ if(x.d.dataDate > newest) newest = x.d.dataDate; });
  var use = srcs.filter(function(x){ return x.d.dataDate === newest; });
  return { items: _mergeZaikoTree(use, 'items'),
           extras: _mergeZaikoTree(use, 'extras'),
           dataDate: newest };
}

/// 取得成功時の共通適用。出どころを記録し、マージ結果で state を更新して再描画する。
// source: 'snapshot'（GCS zaiko.json）/ 'gas'（getYaokoZaiko）
// snapGenAt: スナップショットのときだけ、その generated_at
// 【件A / 2026-09-21】items をそのまま state.zaiko に入れず、出どころをマージする（販売数の逆行を防ぐ）。
// 【2026-10-04】この回の GAS が届くまでは描かない（スナップショットは持っておくだけ）。
//   GAS が先に届き、スナップショットがまだなら ZAIKO_SNAP_WAIT_MS だけ待って1回で描く
//   （待たないと販売数だけ後から書き換わる2段階の表示になる）。
var ZAIKO_SNAP_WAIT_MS = 500;
var _zaikoHoldT = null;
function _applyZaiko(items, dataDate, extras, source, snapGenAt){
  var isGas = (source === 'gas');
  state.zaikoSrc[isGas ? 'gas' : 'snap'] = {
    items: items || {}, extras: extras || {}, dataDate: dataDate || todayStr,
    genAt: isGas ? 0 : (Date.parse(snapGenAt || '') || 0)
  };
  if(isGas){
    state.zaikoGasAt = Date.now();
    state.zaikoRevalidating = false;
    state.zaikoRecheckFailed = false;
  }
  if(!state.zaikoSrc.gas) return;   // 最新（GAS）がまだ。スナップショットは持っておくだけ（GAS が取れなければ使わない）
  if(isGas && state.zaikoSnapPending){
    clearTimeout(_zaikoHoldT);
    _zaikoHoldT = setTimeout(_commitZaiko, ZAIKO_SNAP_WAIT_MS);
    return;
  }
  _commitZaiko();
}
function _commitZaiko(){
  clearTimeout(_zaikoHoldT); _zaikoHoldT = null;
  var merged = _mergeZaikoSources();
  if(!merged) return;
  // ハイライトは「マージ後の値の変化」で判定する。逆行はマージで吸収されて値が動かないので光らない。
  // 取得中から最新になったとき（前の数字を出していない）は光らせない。
  var prevShown = (state.zaikoView === 'fresh');
  state.zaikoChanged = prevShown
    ? _zaikoChangedKeys(state.zaiko, merged.items, state.zaikoExtras, merged.extras)
    : null;
  state.zaiko = merged.items;
  state.zaikoExtras = merged.extras;
  state.zaikoDataDate = merged.dataDate;
  state.zaikoView = 'fresh';
  state.zaikoLoaded = true;
  state.zaikoLoading = false;
  state.zaikoError = false;
  state.zaikoFromGas = true;
  renderRoute();
  // ハイライトは3秒のCSSアニメーション。終わったら状態だけ落とす（再描画はしない）。
  if(state.zaikoChanged){
    clearTimeout(window._zaikoUpdTimer);
    window._zaikoUpdTimer = setTimeout(function(){ state.zaikoChanged = null; }, 3500);
  }
}
// 取得失敗（GAS が返らない・_pending が続く）。数字は出さない。
// 60秒以内に受け取った最新を出している最中の再確認が失敗したときは、その値を残して「再確認できなかった」を添える。
function _zaikoFailed(){
  clearTimeout(_zaikoHoldT); _zaikoHoldT = null;
  state.zaikoLoading = false;
  state.zaikoRevalidating = false;
  if(state.zaikoView === 'fresh'){ state.zaikoRecheckFailed = true; renderRoute(); return; }
  state.zaikoView = 'failed';
  state.zaikoLoaded = false;
  state.zaikoError = true;
  renderRoute();
}
function retryZaiko(){
  if(state.zaikoView === 'loading' || state.zaikoRevalidating) return;
  _zaikoBeginLoad();
  renderRoute();
  _fetchZaiko(0);
}

// 残在庫/販売数を取得。GAS getYaokoZaiko（L2キャッシュから即座に訂正後の値を返せる。フル計算は誘発しない）を正とし、
// スナップショット zaiko.json は販売数の取り込み（大きい＝新しいときだけ）にだけ使う。
// 【2026-10-04】どちらも描く前に GAS を待つ。取得は納品指示と同じく4秒で2本目・10秒で見切り。
var _zaikoGen = 0;
function _fetchZaiko(attempt){
  var gen = (attempt === 0) ? ++_zaikoGen : _zaikoGen;
  if(attempt === 0){
    state.zaikoSnapPending = true;
    _fetchZaikoSnapshot(function(snap){
      if(gen !== _zaikoGen) return;
      state.zaikoSnapPending = false;
      if(snap){
        _applyZaiko(snap.items || {}, snap.actualDate || todayStr, snap.extras || {},
                    'snapshot', snap.generated_at);
      } else if(_zaikoHoldT){
        _commitZaiko();   // スナップショットが無い・古い → 待っていた GAS をそのまま描く
      }
    });
  }
  state.zaikoRevalidating = true;
  _fetchZaikoGas(attempt, gen);
}

// zaiko スナップショットの items に「実データ」が1件でも入っているか。
// 重要: items は {} でも truthy なので、存在チェック(!j.items)では空を弾けない。
//   Cloud Run の早朝実行(4:30)は当日データが未収集のため items={} を書き出す。
//   これを有効なスナップショットとして採用すると「残:-／売:-」になる（2026-07-22 早朝の障害）。
// 判定はキーの存在ではなく「値が有効か」で行う。店舗×価格のいずれかに
//   hasSales=true または zan/tenpo/sales のいずれかが非0 があれば実データとみなす。
function _zaikoItemsHaveValues(items){
  if(!items || typeof items !== 'object') return false;
  var stores = Object.keys(items);
  for(var i=0;i<stores.length;i++){
    var per = items[stores[i]];
    if(!per || typeof per !== 'object') continue;
    for(var pi=0;pi<YAOKO_PRICES.length;pi++){
      var e = per[YAOKO_PRICES[pi]];
      if(!e || typeof e !== 'object') continue;
      if(e.hasSales === true) return true;
      if((parseInt(e.zan,10)||0) !== 0) return true;
      if((parseInt(e.tenpo,10)||0) !== 0) return true;
      if((parseInt(e.sales,10)||0) !== 0) return true;
    }
  }
  return false;
}

// GCSからzaiko.jsonを取得。dateが今日・items が非空・generated_atが6h以内なら採用。
// 空判定は鮮度判定より前に行う（空スナップショットは「新しくても」常に無効）。
function _fetchZaikoSnapshot(cb){
  var url = ZAIKO_SNAPSHOT_URL + '?_=' + Date.now();
  fetch(url, { cache: 'no-store' }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(j){
    if(!j || !j.generated_at || !j.items){ cb(null); return; }
    if(!_zaikoItemsHaveValues(j.items)){ cb(null); return; }
    // extras キーが無いスナップショットは「臨時品目に未対応の古い生成元」が書いたもの。使わない。
    if(!j.extras || typeof j.extras !== 'object'){ cb(null); return; }
    // date が今日と一致することを厳密確認（日付が変わったら snapshotが古い）
    if(j.date && j.date !== todayStr){ cb(null); return; }
    var gen = Date.parse(j.generated_at);
    if(isNaN(gen) || Date.now() - gen > SNAPSHOT_MAX_AGE_MS){ cb(null); return; }
    // actualDate: 実際にどの日付の値か（当日に実データが無ければ前日等）。参照日表示に使う。
    cb({ items: j.items, extras: j.extras || {}, generated_at: j.generated_at,
         actualDate: j.actualDate || j.date || todayStr });
  }).catch(function(){ cb(null); });
}

// GAS getYaokoZaiko（L1/L2 キャッシュからのみ計算し、getAllData のフル計算は誘発しない。
// ミス時は _pending を即返す設計）。
// 【2026-10-04 失敗画面を減らす】取得は makeLatestFetcher（納品指示と同じ。失敗後も 5秒後・15秒後・以後60秒ごとに
// 自動で取り直す。ただし編集モードの間だけ＝閲覧モードでは残在庫/販売数を出さないので取りに行かない）。
// 最初の試行が _pending だけで終わったときは「取得中」のまま次の試行（5秒後）を待つ（旧：4秒後に1回だけ取り直し）。
var _zaikoSawPending = false, _zaikoFirstTry = false;
var _zaikoFetch = makeLatestFetcher({
  action: 'getYaokoZaiko',
  send: function(ok, err, late, t, l, fl){
    _sendJsonp(API_URL+'?action=getYaokoZaiko&date='+encodeURIComponent(todayStr), 'cb_zaiko')(ok, err, late, t, l, fl);
  },
  isOk: function(res){
    if(res && res._pending) _zaikoSawPending = true;
    return !!(res && res.success && res.items && !res._pending);
  },
  onData: function(res){
    _zaikoFirstTry = false;
    _applyZaiko(res.items, res.actualDate || res.date || todayStr, res.extras || {}, 'gas');
  },
  onFail: function(){
    var keepLoading = _zaikoFirstTry && _zaikoSawPending && state.zaikoView === 'loading';
    _zaikoFirstTry = false;
    if(keepLoading) return;   // GAS が計算を始めたところ。「取得中」のまま次の試行を待つ
    _zaikoFailed();
  },
  keepRetrying: function(){ return state.mode === 'edit'; }
});
function _fetchZaikoGas(attempt, gen){
  if(attempt === 0){ _zaikoSawPending = false; _zaikoFirstTry = true; _zaikoFetch.load(); }
  else _zaikoFetch.retry();
}
// 復帰・回線切替のとき（編集モードで残在庫/販売数が取得中・失敗・再確認中）
function _kickZaiko(){
  if(state.zaikoView === 'failed' || state.zaikoRecheckFailed) state.zaikoRevalidating = true;
  _zaikoFetch.kick();
}

// ---- 起動（2026-10-06）----
// 起動時に「確認中」「未送信の入力があります」「下書きを復元」の帯は出さない。
// 保存ボタンを押した分の退避が残っていれば、最新の受け取りのときに裏で照合・送り直す（_bgHoldLatest）。
_bgTidy();
renderRouteTabs();
loadInitial();
_updateUnsentLine();
// アプリ内離脱ガード（未保存のまま移動しようとしたら確かめる）
_bindLeaveGuards();
</script>
