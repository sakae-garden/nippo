  var h='<div class="manual"><h2>配達日報 入力ガイド（新レイアウト）</h2>';
  h+='<div class="manual-tip">📱 「送信する」を押すまでデータは保存されません。<br>⚠️ 入力ミスは再送信で修正できます（最新データが反映されます）。<br>🔄 過去データは旧項目(S品/A品/B品/C品)から新項目(陳列数/値引き)に自動変換されます。</div>';
  h+='<h3><span class="manual-badge mb-green">🟩 納品数</span></h3><p>その日に店舗に持っていった個数。「→ 納品数を陳列数に一括反映」ボタンで、納品数をそのまま陳列数にコピーできます。<br>💡 配達商品情報アプリで事前入力していれば自動でデフォルト値が入ります。</p>';
  h+='<h3><span class="manual-badge mb-blue">🟦 陳列数</span></h3><p>棚に並んでいる商品の合計個数（値引き対象は含めない）。<br>従来の <b>S品(当日) + A品(1日前) + B品(2日前)</b> を合算したものと同じ。個別の切り分けは廃止し、1つの入力欄に直接入力します。</p>';
  h+='<h3><span class="manual-badge mb-purple">🟪 蘇生庫へ</span></h3><p>蘇生庫に移した個数を入力します。（ヤオコーのみ）</p>';
  h+='<h3><span class="manual-badge mb-orange">🟧 持ち帰り</span></h3><p>持ち帰った個数を入力します。</p>';
  h+='<h3><span class="manual-badge" style="background:#fdf0f0;color:var(--red)">🟥 値引き</span></h3><p>値引き処理をした個数を入力します（従来の C品陳列数(3日前) に相当）。<br><strong style="color:var(--red)">値引きしてから入力してください。</strong></p>';
  h+='<div class="manual-tip">📊 <b>店頭在庫 = 陳列数 + 蘇生庫 + 値引き</b> として集計されます。</div>';
  h+='<h3 style="margin-top:20px">💡 値引きタイミングの見方（ヤオコーラベル）</h3>';
  h+='<p><b>「07」</b>（四角囲みなし）＝陳列日（0日目）／ <b>「09」</b>（四角囲み）＝2日後、状態次第で値引く日。</p>';
  h+='<ul style="font-size:13px;color:#444;line-height:1.9;padding-left:20px">' +
     '<li>0日目：陳列日</li>' +
     '<li>1日目：陳列中</li>' +
     '<li>2日目：<b style="color:var(--accent-amber)">状態次第で値引き</b>（囲み日）</li>' +
     '<li>3日目：<b style="color:var(--red)">必ず値引き</b></li>' +
     '</ul>';
  h+='<h3 style="margin-top:20px">🌿 直売所（男衾・川本・道の駅おかべ）</h3><p>納品・前日在庫・持ち帰り の3列を入力。店頭在庫 = 納品 + 前日在庫 として集計されます。</p>';
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function renderSettings() {
  state.screen='settings';setHeader('⚙️ 設定',true,false);_updateIraiNotice();
  var cfg=JSON.parse(JSON.stringify(state.config||getDefaultConfig()));
  var h='<div class="settings"><h2>設定</h2><div class="settings-sec"><div class="settings-sec-hdr">担当者リスト</div><div class="staff-list-edit"><div class="staff-tag-wrap" id="staffTagWrap">';
  cfg.staff.forEach(function(s,i){h+='<span class="staff-tag">'+eH(s)+'<button class="staff-tag-del" onclick="rmStaff('+i+')">×</button></span>';});
  h+='</div><div class="staff-add-row"><input type="text" id="newStaffInput" placeholder="新しい担当者名" maxlength="20"><button class="add-btn" onclick="addStaff()">追加</button></div></div></div>';
  h+='<div class="settings-sec"><div class="settings-sec-hdr">各店舗の担当者表示名</div>';
  Object.keys(STORE_DEFS).forEach(function(id){var s=STORE_DEFS[id],v=(cfg.storeContacts&&cfg.storeContacts[s.name])||'';h+='<div class="settings-item"><label>'+s.name+'</label><input type="text" value="'+eA(v)+'" oninput="updC(\''+eA(s.name)+'\',this.value)" placeholder="担当者名（任意）" maxlength="30"></div>';});
  h+='</div><div class="settings-msg" id="settingsMsg">✅ 保存しました</div><button class="save-btn" onclick="saveCfg()">💾 保存する</button></div>';
  document.getElementById('app').innerHTML=h;
  window._ec=cfg;
}
function rmStaff(i){window._ec.staff.splice(i,1);rfTags();}
function addStaff(){var inp=document.getElementById('newStaffInput'),n=inp.value.trim();if(!n)return;if(window._ec.staff.indexOf(n)>-1){alert('すでに登録されています');return;}window._ec.staff.push(n);inp.value='';rfTags();}
function rfTags(){var w=document.getElementById('staffTagWrap');if(!w)return;var h='';window._ec.staff.forEach(function(s,i){h+='<span class="staff-tag">'+eH(s)+'<button class="staff-tag-del" onclick="rmStaff('+i+')">×</button></span>';});w.innerHTML=h;}
function updC(name,val){if(!window._ec.storeContacts)window._ec.storeContacts={};window._ec.storeContacts[name]=val;}
// 設定保存。従来は onOk/onErr とも空関数で、応答前に無条件で「✅保存しました」を出していた
// （＝サーバに届かなくても成功に見えるサイレント失敗）。
//   ・success:true を必ず検証し、success:false／通信エラーは alert で明示する
//   ・保存直後に getConfig で読み戻し、保存内容と一致して初めて成功表示する
//   ・localStorage への反映も「サーバ保存＋読み戻し一致」を確認できてから行う
//     （失敗した設定を端末に残さない。次回起動時のサーバ値との食い違いを防ぐ）
// saveConfig は冪等な上書きなので reqId dedup は不要。
var SAVECFG_TIMEOUT = 30000;
function _cfgKey(c){
  // 比較用の正規化（キー順に依存しない）
  var sc={}; Object.keys((c&&c.storeContacts)||{}).sort().forEach(function(k){ sc[k]=String(c.storeContacts[k]||''); });
  return JSON.stringify({ staff:((c&&c.staff)||[]).map(String), storeContacts:sc });
}
var _saveCfgBusy=false;
function saveCfg(){
  if(_saveCfgBusy) return;
  var cfg=window._ec;
  var btn=document.querySelector('.save-btn');
  _saveCfgBusy=true; if(btn){btn.disabled=true;}
  showLoading('設定を保存中...');
  function done(){ _saveCfgBusy=false; hideLoading(); if(btn){btn.disabled=false;} }
  function failed(msg){ done(); alert('設定の保存に失敗しました。\n'+msg+'\nもう一度お試しください。'); }
  jsonp(API_URL+'?action=saveConfig&data='+encodeURIComponent(JSON.stringify(cfg))+'&_cb='+Date.now(),
    'cb_sc',function(res){
      if(!res||res.success!==true){ failed((res&&res.error)||'サーバエラー'); return; }
      // 読み戻し検証: サーバの保存結果が送った内容と一致するか
      hideLoading(); showLoading('保存内容を確認中...');
      jsonp(API_URL+'?action=getConfig&_cb='+Date.now(),'cb_sc_verify',function(v){
        if(!v||v.success!==true||!v.config){ failed('保存内容を確認できませんでした'); return; }
        if(_cfgKey(v.config)!==_cfgKey(cfg)){ failed('保存内容がサーバの値と一致しません'); return; }
        // ここで初めて端末側にも反映
        localStorage.setItem(LS_CONFIG,JSON.stringify(cfg));
        state.config=cfg;
        done();
        var m=document.getElementById('settingsMsg');
        if(m){ m.style.display='block'; setTimeout(function(){m.style.display='none';},2000); }
        else { alert('設定を保存しました。'); }
      },function(){ failed('保存内容の確認が通信エラーになりました'); },SAVECFG_TIMEOUT);
    },function(){ failed('通信エラーが発生しました'); },SAVECFG_TIMEOUT);
}

// 未送信日報の自動照合。退避は「送信を始める前」に書くので、送信中にアプリを
// 閉じた・リロードした場合は実際にはサーバに記録済みのことがある。
// 照合の実体は _kickSubmitPendingChecks（記録済みなら黙って消し、未着と
// 確定したときだけ警告する）。ここは起動時の入口として残す。
// 【2026-09-29】起動時は予約を待たずにすぐ照合する（前日以前の退避も対象）。
function _autoResolveSubmitPending(){
  _kickSubmitPendingChecks(true);
  _updateSubmitPendingBanner();
}

// 当日の任意発行累計を localStorage から復元（リロードでアラートが復活しないように）
state.sanchiIssuedToday = _loadSanchiIssuedToday();
renderRouteTabs();
loadConfig(function(){ renderHome(); fetchHaitatsuBackground(0); fetchLabelAlert(); fetchLabelIssuedTotal(); _autoResolveSubmitPending(); });
</script>
