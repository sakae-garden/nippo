<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>配達日報 | 栄ガーデン</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
/* ==========================================================
   デザイン統一版：使用色は3色まで
   - 黒/グレー：文字・数値・枠線（基本すべて）
   - 緑 (--green)：主要操作ボタンのみ（送信・追加）
   - 赤 (--red)：値引き列のみ
   カード：白背景・薄いグレー枠1px・角丸12px・共通padding
   ========================================================== */
:root {
  --bg:#f5f3ee; --card:#fff;
  --ink:#1c1c1e; --sub:#6c6c70;
  --border:#e5e1d8; --shadow:0 2px 12px rgba(0,0,0,0.06);
  --green:#2d7a4f;     /* 主要操作 */
  --red:#c0392b;       /* 値引き（表・確認画面では未使用。マニュアル説明のみ） */
  --accent-amber:#c9770a; /* 値引きタイミング表示 2日目のみ */
  --divider:#c9c1b0;   /* 表内の縦区切り線 */
  --r:12px;            /* カード角丸統一 */
  --r-btn:8px;         /* ボタン角丸統一 */
  --pad-card:14px;     /* カード内側余白統一 */
  /* 送信完了確認画面（サマリー風パレット） */
  --sum-light:#f0ebe0; --sum-rule:#d4c9b0; --sum-dot:#e0d9cc;
  --sum-yellow-lbl:#f57f17; --sum-purple:#7b1fa2; --sum-cyan:#0097a7;
  --sum-yellow-bg:#fffde7; --sum-yellow-bd:#f9a825;
  --sum-extra-bg:#fff8e1; --sum-extra-ink:#e65100;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);max-width:480px;margin:0 auto;padding-bottom:60px}

/* ============ ヘッダー ============ */
.hdr{background:var(--ink);color:#fff;padding:14px 18px 0;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:.04em}
.hdr-date{font-size:11px;color:#aaa;margin-top:-6px;padding-bottom:10px;padding-left:2px}
.back-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:var(--r-btn);padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.route-tabs{display:flex;gap:6px;padding:0 0 12px}
.rtab{flex:1;padding:8px 4px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border-radius:var(--r-btn)}
.rtab.active{background:#fff;color:var(--ink)}

/* ============ 画面共通 ============ */
.screen{padding:16px}
.sec-lbl{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:16px 0 8px 2px}
.sec-lbl:first-child{margin-top:4px}

/* ============ ホーム: 店舗リスト（色付き左border廃止） ============ */
.store-list{display:flex;flex-direction:column;gap:8px}
.store-btn{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 16px;cursor:pointer;width:100%;text-align:left;font-family:inherit;box-shadow:var(--shadow);transition:transform .1s}
.store-btn:active{transform:scale(.98)}
.store-btn.yaoko,.store-btn.choku,.store-btn.others{border-left:1px solid var(--border)}
.si{font-size:22px;margin-right:12px}.sinfo{flex:1}
.sname{font-size:15px;font-weight:600;color:var(--ink)}.ssub{font-size:11px;color:var(--sub);margin-top:1px}
.sarr{font-size:18px;color:#ccc}

/* ============ ホーム: アクションボタン ============ */
.action-row{display:flex;gap:10px;margin-bottom:10px}
.action-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-btn);padding:12px 10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);transition:transform .1s}
.action-btn:active{transform:scale(.97)}.a-icon{font-size:20px}
.summary-link-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border-radius:var(--r-btn);padding:13px 16px;text-decoration:none;font-size:15px;font-weight:700;letter-spacing:.04em;margin-bottom:10px;box-shadow:var(--shadow);transition:opacity .15s}
.summary-link-btn:active{opacity:.8}
/* 店舗依頼ボードへのリンク（サマリーの下。副次的な導線なので白地） */

/* ============ 副次操作ボタン（保存データを読み込む） ============ */
.load-btn{width:100%;padding:11px;background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:var(--r-btn);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;letter-spacing:.02em;transition:opacity .15s;box-shadow:var(--shadow)}
.load-btn:active{opacity:.7}
.load-btn:disabled{opacity:.4;cursor:not-allowed}

/* ============ カード（統一）: fsec/staff-sec/extra-mgr/dg-wrap/itbl-wrap 全部同じ ============ */
.fsec,.staff-sec,.extra-mgr,.dg-wrap,.itbl-wrap{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  margin-bottom:10px;
  box-shadow:var(--shadow);
}
.fsec,.extra-mgr,.dg-wrap,.itbl-wrap{overflow:hidden}

/* カードヘッダー（色分け廃止・全てグレー系文字） */
.fsec-hdr{padding:10px var(--pad-card);font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;background:transparent;color:var(--ink);border-bottom:1px solid var(--border)}
.fsec-hdr.green,.fsec-hdr.blue,.fsec-hdr.brown,.fsec-hdr.yellow,.fsec-hdr.purple{background:transparent;color:var(--ink)}
.fsec-hdr .note{font-size:11px;font-weight:400;color:var(--sub)}

/* 主要操作ボタン（apply-btn = 陳列反映 / add = ＋追加）: 緑 */
.apply-btn{background:var(--green);color:#fff;border:none;border-radius:var(--r-btn);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity .15s}
.apply-btn:active{opacity:.7}
@keyframes flash{0%{background:#e6f5ec}100%{background:transparent}}
.flashed .fsec-hdr{animation:flash .7s ease-out}

/* ============ frow（レガシー1項目セクション）用 ============ */
.frow{display:flex;align-items:center;padding:10px var(--pad-card);border-bottom:1px solid var(--border)}
.frow:last-child{border-bottom:none}
.frow-lbl{flex:1;font-size:14px;color:var(--ink)}
.frow-inp{display:flex;align-items:center;gap:5px}
.frow input[inputmode="numeric"]{width:80px;height:40px;border:1px solid var(--border);border-radius:var(--r-btn);text-align:center;font-size:18px;font-weight:600;font-family:inherit;color:var(--ink);background:#fff;-moz-appearance:textfield}
.frow input::-webkit-inner-spin-button,.frow input::-webkit-outer-spin-button{-webkit-appearance:none}
.frow input:focus{outline:none;border-color:var(--ink)}
.frow textarea{width:100%;border:1px solid var(--border);border-radius:var(--r-btn);padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;resize:vertical;min-height:70px}
.frow textarea:focus{outline:none;border-color:var(--ink)}
.frow-unit{font-size:11px;color:var(--sub)}
.frow.extra{background:transparent}
.frow.extra .frow-lbl{color:var(--ink);font-weight:600}

/* ============ 商品追加（extra-mgr）: 黄色点線廃止・白カードに統一 ============ */
.extra-mgr-hdr{padding:10px var(--pad-card);background:transparent;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.extra-mgr-add{background:var(--green);color:#fff;border:none;border-radius:var(--r-btn);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity .15s}
.extra-mgr-add:active{opacity:.7}
.extra-mgr-body{padding:10px var(--pad-card)}
.extra-mgr-empty{font-size:12px;color:var(--sub);font-style:italic}
/* 商品追加の金額入力モーダル（数字テンキー対応） */
.price-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.price-modal{background:#fff;border-radius:var(--r);padding:20px;width:100%;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.price-modal-ttl{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px}
.price-modal-inp{width:100%;height:48px;border:1.5px solid var(--border);border-radius:var(--r-btn);text-align:center;font-size:22px;font-weight:700;font-family:inherit;color:var(--ink);box-sizing:border-box}
.price-modal-inp:focus{outline:none;border-color:var(--green)}
.price-modal-btns{display:flex;gap:10px;margin-top:16px}
.price-modal-btns button{flex:1;height:44px;border:none;border-radius:var(--r-btn);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.price-modal-cancel{background:#eee;color:var(--sub)}
.price-modal-ok{background:var(--green);color:#fff}
.price-modal-ok:active,.price-modal-cancel:active{opacity:.7}
.extra-chips{display:flex;flex-wrap:wrap;gap:6px}
.extra-chip{display:inline-flex;align-items:center;gap:4px;background:#f5f5f5;border:1px solid var(--border);border-radius:20px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.extra-chip-del{background:none;border:none;color:#999;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;font-family:inherit}
.extra-chip-del:hover{color:var(--ink)}

/* ============ chin-sec（旧陳列自動計算・現行未使用の可能性・念のため中立化） ============ */
.chin-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.chin-hdr{padding:10px var(--pad-card);background:transparent;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.02em;border-bottom:1px solid var(--border)}
.chin-row{display:flex;align-items:center;padding:9px var(--pad-card);border-bottom:1px solid var(--border)}
.chin-row:last-child{border-bottom:none}
.chin-row.extra{background:transparent}
.chin-row.extra .chin-lbl{color:var(--ink);font-weight:600}
.chin-lbl{flex:1;font-size:14px;color:var(--ink)}
.chin-val{font-size:20px;font-weight:700;color:var(--ink);min-width:48px;text-align:right}
.chin-unit{font-size:11px;color:var(--sub);margin-left:4px}

/* ============ 担当者選択 ============ */
.staff-sec{padding:13px var(--pad-card)}
.staff-lbl{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px;letter-spacing:.04em}
.staff-btns{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;font-family:inherit;font-size:14px;cursor:pointer;transition:all .15s;color:var(--ink)}
.sbtn.sel{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ============ 主要操作: 送信ボタン（緑） ============ */
.submit-btn{width:100%;padding:15px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;letter-spacing:.04em;transition:opacity .15s;box-shadow:var(--shadow)}
.submit-btn:active{opacity:.8}.submit-btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ 送信完了画面 ============ */
.done-screen{text-align:center;padding:60px 20px}
.done-icon{font-size:64px;margin-bottom:16px}
.done-title{font-size:22px;font-weight:700;margin-bottom:8px}
.done-sub{font-size:14px;color:var(--sub);margin-bottom:32px;line-height:1.7}
.home-btn{background:var(--ink);color:#fff;border:none;border-radius:var(--r-btn);padding:14px 32px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
/* 完了画面の「記録の確認」状態表示（楽観的UI）。操作はブロックしない。
   ds-pending=確認中 / ds-ok=確認済み
   ds-ng=未着と確定（警告＋再送導線） / ds-warn=照合できず（断定しない＋再送導線） */
.done-status{margin:-16px auto 24px;max-width:420px;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;line-height:1.6}
.done-status.ds-pending{background:#f0f4f8;color:#5b7a99;border:1px dashed #b0bec5}
.done-status.ds-ok{background:#edf7f1;color:#2d7a4f;border:1px solid #a5d6b8}
.done-status.ds-ng{background:#fdecea;color:#b71c1c;border:1px solid #ef9a9a;text-align:left}
.done-status.ds-warn{background:#fff8e1;color:#8a6100;border:1px solid #ffd54f;text-align:left}
.done-status.ds-warn .ds-retry{background:#8a6100}
.done-status .ds-msg{font-size:13px}
.done-status .ds-sub{font-size:11px;font-weight:500;margin-top:4px;opacity:.85}
.done-status .ds-retry{margin-top:8px;background:#b71c1c;color:#fff;border:none;border-radius:6px;padding:9px 18px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;width:100%}

/* ============ 送信完了 確認テーブル: サマリー風デザイン（値引きは黒に統一） ============ */
.done-confirm-wrap{margin:8px 0 28px;text-align:left;padding:0 4px}
.done-confirm-title{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-bottom:8px;text-align:center}
.dc-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--sum-rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.dc-table th{padding:5px 6px;background:var(--sum-light);font-size:10px;font-weight:700;color:#666;letter-spacing:.06em;text-align:center;border-bottom:2px solid var(--sum-rule)}
.dc-table th:first-child{text-align:left;padding-left:12px}
.dc-table td{padding:6px 6px;border-bottom:1px dotted var(--sum-dot);text-align:center;vertical-align:middle}
.dc-table td:first-child{text-align:left;padding-left:12px;font-size:12px;color:#555;white-space:nowrap}
.dc-table tr:last-child td{border-bottom:none}
/* 値の色: 陳列=山吹、蘇生=紫、店頭=シアン。値引きと納品は黒（値引き赤字廃止） */
.dc-nouhin,.dc-chin,.dc-sosei,.dc-tenpo,.dc-nebiki{font-size:15px;font-weight:700}
.dc-nouhin{color:var(--ink)}
.dc-chin{color:var(--sum-yellow-lbl)}
.dc-sosei{color:var(--sum-purple)}
.dc-tenpo{color:var(--sum-cyan)}
.dc-nebiki{color:var(--ink)}
.dc-extra{background:var(--sum-extra-bg)}
.dc-extra td:first-child{color:var(--sum-extra-ink);font-weight:700}
.dc-total{background:var(--sum-yellow-bg);font-weight:700;border-top:2px solid var(--sum-yellow-bd)!important}
.dc-total td:first-child{font-weight:700;color:var(--ink)}

/* ============ マニュアル・設定 ============ */
.manual{padding:16px}
.manual h2{font-size:16px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.manual h3{font-size:14px;font-weight:700;margin:16px 0 6px;color:var(--ink)}
.manual p{font-size:13px;color:#444;line-height:1.8;margin-bottom:6px}
.manual-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;margin-bottom:4px;background:#f0f0f0;color:var(--ink)}
.mb-green,.mb-blue,.mb-brown,.mb-yellow,.mb-purple,.mb-orange{background:#f0f0f0;color:var(--ink)}
.manual-tip{background:#f8f7f2;border-left:3px solid var(--border);border-radius:0 var(--r-btn) var(--r-btn) 0;padding:10px 12px;font-size:13px;color:#333;margin:10px 0;line-height:1.7}
.settings{padding:16px}
.settings h2{font-size:16px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.settings-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.settings-sec-hdr{padding:10px var(--pad-card);background:#f8f7f2;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em}
.settings-item{display:flex;align-items:center;padding:10px var(--pad-card);border-bottom:1px solid var(--border);gap:10px}
.settings-item:last-child{border-bottom:none}
.settings-item label{flex:1;font-size:13px}
.settings-item input[type=text]{flex:2;border:1px solid var(--border);border-radius:var(--r-btn);padding:6px 10px;font-size:13px;font-family:inherit}
.settings-item input:focus{outline:none;border-color:var(--ink)}
.staff-list-edit{padding:12px var(--pad-card)}
.staff-tag-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.staff-tag{display:flex;align-items:center;gap:4px;background:#f5f5f5;border-radius:20px;padding:4px 10px 4px 12px;font-size:13px}
.staff-tag-del{background:none;border:none;color:#999;cursor:pointer;font-size:16px;line-height:1;padding:0}
.staff-add-row{display:flex;gap:8px}
.staff-add-row input{flex:1;border:1px solid var(--border);border-radius:var(--r-btn);padding:8px 10px;font-size:14px;font-family:inherit}
.staff-add-row input:focus{outline:none;border-color:var(--ink)}
.add-btn{background:var(--green);color:#fff;border:none;border-radius:var(--r-btn);padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.save-btn{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.settings-msg{text-align:center;font-size:13px;padding:8px;color:var(--green);font-weight:600;display:none}

/* ============ ローディング ============ */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.loading-box{background:#fff;border-radius:var(--r);padding:24px 32px;text-align:center;font-size:14px;font-weight:600}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #eee;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 入力テーブル（メイン） ============ */
.itbl-wrap{overflow-x:auto}
.itbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.itbl th,.itbl td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--border)}
.itbl th{font-size:12px;font-weight:700;letter-spacing:.02em;position:sticky;top:0;z-index:1;background:#f8f7f2;color:var(--sub)}
.itbl .itbl-price{width:56px;font-size:13px;font-weight:700;color:var(--ink);background:#f8f7f2}
.itbl thead .itbl-price{color:var(--sub)}
/* 列ヘッダー：全てグレー統一（旧: 緑/青/紫/橙は廃止・値引き赤字も廃止） */
.itbl .itbl-col{color:var(--sub);background:#f8f7f2}
.itbl .itbl-col.ctl-red{color:var(--sub)}
/* 値引き列の左に縦区切り線（通常入力 | イレギュラー入力 の視覚分割） */
.itbl th.itbl-col.ctl-red,
.itbl td.itbl-cell.ctl-red{border-left:2px solid var(--divider)}
.itbl .itbl-cell{padding:4px 3px;background:#fff}
.itbl input[inputmode="numeric"]{
  width:100%;max-width:64px;height:42px;
  border:1px solid var(--border);border-radius:var(--r-btn);
  text-align:center;font-size:18px;font-weight:600;
  font-family:inherit;color:var(--ink);background:#fff;
  -moz-appearance:textfield;padding:0
}
.itbl input::-webkit-inner-spin-button,.itbl input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.itbl input:focus{outline:none;border-color:var(--ink)}
.itbl tr:last-child td{border-bottom:none}
.itbl .itbl-extra{background:transparent}
.itbl .itbl-extra .itbl-price{background:#f8f7f2;color:var(--ink)}
/* 値引き列の入力文字色も黒に統一（赤字廃止） */
.itbl td.itbl-cell.ctl-red input{color:var(--ink)}
/* 旧色分けクラス（ctl-green/blue/purple/orange/brown）は全て無色化 */
.ctl-green th.itbl-col.ctl-green,
.ctl-blue th.itbl-col.ctl-blue,
.ctl-purple th.itbl-col.ctl-purple,
.ctl-orange th.itbl-col.ctl-orange,
.ctl-brown th.itbl-col.ctl-brown{background:#f8f7f2;color:var(--sub)}

<body>

<div class="hdr">
  <div class="hdr-top">
    <h1 id="hTitle">🍄 配達日報</h1>
    <button class="back-btn" id="backBtn" style="display:none" onclick="goBack()">← 戻る</button>
  </div>
  <div class="hdr-date" id="hDate"></div>
  <!-- 経路タブは shared-stores.js の ROUTES から描画する（renderRouteTabs）。
       ラベルをここにベタ書きすると ROUTE_VERSION 切替で不整合になるので禁止。 -->
  <div class="route-tabs" id="routeTabs">
  </div>
</div>
<div id="app"></div>
<script src="shared-stores.js"></script>
<script src="irai-notice.js"></script>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbxGqsjIbO9PDjUpf2EWRD8AkVvYc7V77OJrh7h_PZCqtuV4aUL7NYz83VsNc5lY6sXONw/exec';
// ラベル在庫アラート スナップショット（夜の再計算結果。日中は固定表示）。
// テスト環境では _propagate_test_env.py が /test/ 版に差し替える。
var LABEL_SNAPSHOT_URL = 'https://storage.googleapis.com/sakae-garden-snapshots/label_alert.json';
// STORE_DEFS / ROUTES は shared-stores.js でグローバル定義（window.STORE_DEFS / window.ROUTES）

// ===== 環境別 localStorage キー =====
// /nippo/test/ は本番と同一オリジンなので localStorage を共有してしまう。
// 環境固有の状態（テストGAS/テストシート由来のデータ）を持つキーは全て分離する。
// 判定は _propagate_test_env.py が LABEL_SNAPSHOT_URL を /test/ 版へ差し替えるのを利用。
// 本番のキー名は従来のまま（サフィックス無し）なので、既存ユーザーの値は失われない。
var IS_TEST_ENV = String(LABEL_SNAPSHOT_URL).indexOf('/test/') > -1;
function lsKey(base){ return base + (IS_TEST_ENV ? '_test' : ''); }
var LS_CONFIG           = lsKey('nippo_config');
// 【2026-10-04 廃止】納品指示を端末に残していたキー（haitatsu_latest・取得日・対象日・受け取り時刻）。
// 前回の数字を画面に出す手段は設けない（杉さん決定 2026-10-04）ので、端末にも残さない。
// 起動時に、以前の版が残した値を消す（haitatsu.html も同じキーを消す）。
['haitatsu_latest','haitatsu_fetched_day_v1','haitatsu_target_day_v1','haitatsu_fetched_at_v1'].forEach(function(k){
  try{ localStorage.removeItem(lsKey(k)); }catch(e){}
});
var LS_SANCHI_ISSUED    = lsKey('sanchi_issued_today_v1');
// 【2026-09-29】保存と送信の記録（GAS の「保存送信ログ」シート）に付ける端末IDと画面の版。
// 端末IDはこの端末で一度だけ作るランダムな値（haitatsu.html と同じキーを共有＝同じ端末は同じID）。
// 氏名・電話番号などは入れない。localStorage が使えない端末では画面を開くたびに変わる。
var PAGE_BUILD = 'latest-only-20261004';   // 画面を変えて出すときに更新する（記録の「画面の版」）
var LS_DEVICE_ID = lsKey('device_id_v1');
var _deviceIdMemo = '';
function _deviceId(){
  if(_deviceIdMemo) return _deviceIdMemo;
  var id='';
  try{ id=localStorage.getItem(LS_DEVICE_ID)||''; }catch(e){}
  if(!/^[0-9a-z]{6,20}$/.test(id)){
    id=Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
    try{ localStorage.setItem(LS_DEVICE_ID,id); }catch(e){}
  }
  return (_deviceIdMemo=id);
}
function _auditQuery(extra){
  var q='&dev='+encodeURIComponent(_deviceId())+'&ver='+encodeURIComponent(PAGE_BUILD);
  Object.keys(extra||{}).forEach(function(k){ q+='&'+k+'='+encodeURIComponent(String(extra[k])); });
  return q;
}

var state = { screen:'home', route:0, store:null, formData:{}, staff:'', config:null, extraPrices:[], labelAlert:null, labelIssued:{}, labelIssuedTotal:null, manualIssueOpen:false, sanchiIssuedToday:0 };
var today = new Date();
var DAYS = ['日','月','火','水','木','金','土'];
var todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
// 臨時品目の有効判定（haitatsu.html の _extraUntil / _extraAliveOn と同じ中身）。
// 【2026-09-29】「対象日・最終編集日が当日か前日なら有効」（2日で失効）をやめ、
// 品目ごとの終了日 entry.extrasUntil = {'¥360':'', '¥178':'2026-09-30'} で判定する。
// 終了日が無い（''＝消すまで・旧データ）か、終了日が当日以降の品目だけが有効。
var EXTRAS_UNTIL_BUILD = 'extras-until-20260929';   // 本番反映の確認用マーカー
function _extraUntil(e, price){
  var u = e && e.extrasUntil;
  var v = String((u && typeof u === 'object' && u[price]) || '').slice(0,10);
  return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
}
function _extraAliveOn(e, price, day){ var u = _extraUntil(e, price); return !u || u >= day; }
document.getElementById('hDate').textContent = today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日（'+DAYS[today.getDay()]+'）';

function loadConfig(cb) {
  var cached = localStorage.getItem(LS_CONFIG);
  state.config = cached ? (function(){ try{return JSON.parse(cached);}catch(e){return getDefaultConfig();} })() : getDefaultConfig();
  if (cb) cb();
  jsonp(API_URL+'?action=getConfig','cb_cfg',function(res){ if(res.success&&res.config){ state.config=res.config; localStorage.setItem(LS_CONFIG,JSON.stringify(res.config)); } },function(){});
}

function getDefaultConfig() {
  var c = {};
  Object.keys(STORE_DEFS).forEach(function(k){ c[STORE_DEFS[k].name]=''; });
  c['ヤオコー寄居店']='河野さん・竹山さん'; c['ヤオコーみどりが丘店']='杉田さん・川野さん';
  return { staff:['八島','青柳','杉','その他'], storeContacts:c };
}

// JSONP。GASの /exec は HTTP 200 で HTML 中間ページ（ログイン/リダイレクト）を返すことがあり、
// その場合スクリプトは「読み込み成功」扱いになり onerror も発火しないため、コールバックが
// 呼ばれたかを onload 後に確認して失敗判定する（無検知だとタイムアウトまで無言でぶら下がる）。
// 【注意】この onload 検知は HTTP 応答が届いてからしか働かない。実測では GAS が
// 404/HTML中間ページを返すケースは応答自体に 30〜70秒かかるため、onload 検知は
// 「早期失敗」の手段にはならない。早く見切るのは timeoutMs の役目。
//
// 遅延到着(late arrival): JSONP はリクエストをキャンセルできないので、タイムアウトで
// 見切った後に本来の応答が届くことがある。opts.onLate を渡すと opts.lateGraceMs の間
// コールバックを残して拾う。短いタイムアウトで素早く確認導線に入りつつ、実際には
// 成立していた送信を捨てずに済む。
// settled ラッチで onOk/onErr の二重呼び出しを防ぐ。timeoutMs は呼び出し側で指定可（既定30秒）。
var cbIdx=0;
function jsonp(url,base,onOk,onErr,timeoutMs,opts) {
  opts = opts || {};
  var n=base+'_'+(cbIdx++), s=document.createElement('script');
  var settled=false, disposed=false, t=null, lt=null;
  function dispose(){
    if(disposed) return; disposed=true;
    clearTimeout(t); clearTimeout(lt);
    try{ delete window[n]; }catch(e){ window[n]=undefined; }
    if(s.parentNode) s.parentNode.removeChild(s);
  }
  window[n]=function(d){
    clearTimeout(t);
    if(!settled){ settled=true; dispose(); onOk(d); return; }
    dispose();
    if(opts.onLate){ try{ opts.onLate(d); }catch(e){} }
  };
  function failNow(){
    if(settled) return;
    settled=true;
    if(opts.onLate && opts.lateGraceMs>0){ lt=setTimeout(dispose, opts.lateGraceMs); }
    else { dispose(); }
    if(onErr) onErr();
  }
  t=setTimeout(failNow, timeoutMs||30000);
  s.onload=function(){
    // script は実行完了したが window[n] が呼ばれていなければ失敗扱い（HTML中間ページ等）
    if(settled) return;
    setTimeout(function(){ if(!settled) failNow(); },200);
  };
  s.onerror=function(){ failNow(); };
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+n;
  document.body.appendChild(s);
}
// 冪等キー用UUID（crypto.randomUUID 非対応端末のフォールバック付き）
function _uuid(){
  try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0, v=(c==='x')?r:((r&0x3)|0x8); return v.toString(16);
  });
}
function showLoading(msg){var el=document.getElementById('lo');if(!el){el=document.createElement('div');el.id='lo';el.className='loading-overlay';el.innerHTML='<div class="loading-box"><div class="spinner"></div><br>'+(msg||'送信中...')+'</div>';document.body.appendChild(el);}}
function hideLoading(){var el=document.getElementById('lo');if(el)el.parentNode.removeChild(el);}

function setHeader(title,showBack,showTabs) {
  document.getElementById('hTitle').textContent=title;
  document.getElementById('backBtn').style.display=showBack?'':'none';
  document.getElementById('routeTabs').style.display=showTabs?'':'none';
}
// 経路タブを ROUTES から描画（本数・ラベルとも ROUTE_VERSION に追随する）
function renderRouteTabs(){
  var el=document.getElementById('routeTabs');
  if(!el || typeof ROUTES==='undefined') return;
  var h='';
  for(var i=0;i<ROUTES.length;i++){
    h+='<button class="rtab'+(i===state.route?' active':'')+'" id="tab'+i+'" onclick="switchRoute('+i+')">'+eH(ROUTES[i].label)+'</button>';
  }
  el.innerHTML=h;
}
function switchRoute(idx) {
  state.route=idx;
  for(var i=0;i<ROUTES.length;i++){ var t=document.getElementById('tab'+i); if(t) t.classList.toggle('active',i===idx); }
  renderHome();
}
// 未送信の入力があるか判定：state.formData に空でない値が1つでもあれば true。
// 「入力フォーム画面」時のみ有効（他画面では常に false = 確認不要）。
function hasUnsavedInput(){
  if(state.screen !== 'form') return false;
  if(!state.formData) return false;
  return Object.keys(state.formData).some(function(k){
    var v = state.formData[k];
    return v !== '' && v !== null && v !== undefined && String(v).trim() !== '';
  });
}
// ホームに戻る前の確認：未入力なら即許可、入力ありなら confirm ダイアログ
function confirmLeaveIfDirty(){
  if(!hasUnsavedInput()) return true;
  return confirm('送信していない入力があります。\n送信せずに戻りますか？');
}
function goBack(){ if(confirmLeaveIfDirty()) renderHome(); }

function renderHome() {
  state.screen='home';
  setHeader('🍄 配達日報',false,true);
  var cfg=state.config||getDefaultConfig(), route=ROUTES[state.route];
  var html='<div class="screen">'
    + '<a href="summary.html" class="summary-link-btn">📊 サマリーを見る</a>'
    + '<div class="action-row"><button class="action-btn" onclick="renderManual()"><span class="a-icon">📖</span>マニュアル</button><button class="action-btn" onclick="renderSettings()"><span class="a-icon">⚙️</span>設定</button></div>'
    // 並び順: ②産地シールのアラート（通知＋全社一括の発行指示枚数）→ 任意発行パネル。
    // 産地シールは全社共通1在庫なので、経路タブに関係なく常に同じ位置に出す。
    + renderSanchiAlert()
    + renderManualIssue();
  route.groups.forEach(function(g) {
    html+='<div class="sec-lbl">'+g.label+'</div><div class="store-list">';
    g.stores.forEach(function(id) {
      // ③値段シール：男衾・川本の店舗名の上に、アラート時のみ表示（値段ごとの発行入力欄付き）
      if(id==='obusuma'||id==='kawamoto'){ html+=renderNedanAlertForStore(id); }
      var s=STORE_DEFS[id], sub=(cfg.storeContacts&&cfg.storeContacts[s.name])||'';
      html+='<button class="store-btn '+s.cls+'" onclick="openStore(\''+id+'\')"><span class="si">'+s.icon+'</span><span class="sinfo"><span class="sname">'+s.name+'</span>'+(sub?'<br><span class="ssub">'+sub+'</span>':'')+'</span><span class="sarr">›</span></button>';
    });
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('app').innerHTML=html;
  // 未送信の日報が端末に残っていれば、店舗一覧の先頭に再送導線を出す
  _updateSubmitPendingBanner();
  // 納品指示が取れていない／当日分が無いときの警告バー
  _updateHaitatsuNotice();
  _updateIraiNotice();
}

// ============ ラベル在庫アラート（②産地シール / ③値段シール） ============
// 夜生成のスナップショット(label_alert.json)を読み、店舗選択画面に表示する。
// 日中の発行入力は label_stock に追記されるが、スナップショットは夜まで再生成
// されないため、日中はアラートが固定表示される（その場では消えない）。
var _labelAlertFetched=false;
function fetchLabelAlert(){
  fetch(LABEL_SNAPSHOT_URL+'?_='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(j){
      if(j && (j.sanchi||j.nedan)){
        state.labelAlert=j; _labelAlertFetched=true;
        if(state.screen==='home') renderHome();
      }
    }).catch(function(){ /* スナップショット無し/取得失敗時はアラート非表示（機能は非破壊） */ });
}
// ===== 産地シール：当日の任意発行累計（localStorage 永続） =====
// 即時非表示の判定に使う。ページを開き直しても当日中は維持し、リロードで
// アラートが復活する事故を防ぐ。日付が変われば自動的に 0 から数え直す
// （翌朝の真値は夜間再計算＝スナップショット側で決まる）。
// キーは環境別（LS_SANCHI_ISSUED）。テストでの発行が本番のアラートを消す事故を防ぐ。
function _loadSanchiIssuedToday(){
  try{
    var r=JSON.parse(localStorage.getItem(LS_SANCHI_ISSUED)||'null');
    if(r && r.date===todayStr) return parseInt(r.count,10)||0;
  }catch(e){}
  return 0;
}
function _saveSanchiIssuedToday(n){
  try{ localStorage.setItem(LS_SANCHI_ISSUED, JSON.stringify({date:todayStr, count:n})); }catch(e){}
}

// ============ 産地シールの任意発行（アラート非表示時も常時使える） ============
// 現時点在庫 ＝ ライブの累計発行数（GAS getLabelIssuedTotal）− 前夜計算の累計消費
//              （スナップショット sanchi.delivered）。
// ＝「発行は最新・消費は前夜時点」。消費(−側)は朝4:45の再計算まで反映されない目安値。
// 【2026-10-04】ライブの累計発行数が届くまでは数字を出さない（従来は前夜計算の stock を先に出し、
// 届いたら差し替えていた）。取得できなければ「取得できませんでした」＋再取得。
var _labelIssuedState = 'loading';   // 'loading' / 'ok' / 'error'
function fetchLabelIssuedTotal(){
  _labelIssuedState = 'loading';
  jsonp(API_URL+'?action=getLabelIssuedTotal','cb_issued_total',function(res){
    if(res&&res.success&&typeof res.sanchi==='number'){
      state.labelIssuedTotal=res.sanchi;
      _labelIssuedState = 'ok';
    } else _labelIssuedState = 'error';
    if(state.screen==='home') renderHome();
  },function(){ _labelIssuedState = 'error'; if(state.screen==='home') renderHome(); });
}
function retryLabelIssuedTotal(){ fetchLabelIssuedTotal(); if(state.screen==='home') renderHome(); }

// （不足分 = 1000 − 在庫 → 上限200 → 10の位四捨五入）。
function _sanchiNeed(s){
  if(s.need!=null) return s.need;
  var target=(s.target!=null)?s.target:1000, cap=(s.cap!=null)?s.cap:200;
  var shortfall=(s.shortfall!=null)?s.shortfall:Math.max(target-(s.stock||0),0);
  return Math.round(Math.min(Math.max(shortfall,0),cap)/10)*10;
}

// 発行の送信。二重記録防止:
//   F) 送信中は全発行ボタンを disabled（連打・再タップ封じ）
//   B) 操作ごとに reqId(UUID) を発番し、再試行は同じ reqId で再送 → GAS側で重複検知
//      （duplicate:true も success 扱い。ローカル加算は1回だけ）
//   C) 全試行が失敗しても、最後に reqId で「記録が入ったか」をサーバに確認する。
//      入っていれば成功扱い（誤ってもう一度発行させない＝別reqIdでの真の二重行を防ぐ）。
// タイムアウトは30秒（GAS実測で15〜25秒かかることがある。HTML中間ページは onload 検知で
// 即失敗するので、長めのタイムアウトでも体感は悪化しない）。
var ISSUE_MAX_ATTEMPTS = 3;
var ISSUE_RETRY_WAIT   = 2000;
var ISSUE_TIMEOUT      = 30000;
var _issueBusy = false;
function _setIssueBtnsDisabled(d){
  var b=document.querySelectorAll('.lbl-issue-btn');
  for(var i=0;i<b.length;i++) b[i].disabled=!!d;
}
// 発行成功時のローカル計上（1回の発行につき1度だけ呼ぶ）
function _countIssued(key,n){
  // 当日画面上の累積（複数回に分けて入力しても合算）。規定到達で即時非表示（renderHome内で判定）。
  state.labelIssued[key]=(state.labelIssued[key]||0)+n;
  if(key==='sanchi_manual'){
    // 産地シールの即時非表示は「当日の任意発行累計」で判定。localStorage に永続化。
    state.sanchiIssuedToday+=n;
    _saveSanchiIssuedToday(state.sanchiIssuedToday);
  }
}
function _postIssue(baseUrl,key,n){
  if(_issueBusy) return;                    // 送信中の再タップを無視
  _issueBusy=true; _setIssueBtnsDisabled(true);
  var reqId=_uuid();
  var url=baseUrl+'&reqId='+encodeURIComponent(reqId);
  function done(){ _issueBusy=false; _setIssueBtnsDisabled(false); hideLoading(); }
  function succeed(){
    done();
    _countIssued(key,n);
    // 産地シールはライブ累計発行数にも加算 →「現時点在庫」がその場で増える
    if(key.indexOf('sanchi_')===0 && state.labelIssuedTotal!=null) state.labelIssuedTotal+=n;
    renderHome();
  }
  // 全試行が通信エラーで終わった時、reqId で記録の有無をサーバに確認する
  function confirmOrFail(){
    hideLoading(); showLoading('記録を確認中...');
    jsonp(API_URL+'?action=getLabelIssuedTotal&reqId='+encodeURIComponent(reqId)+'&_cb='+Date.now(),
      'cb_issue_confirm',function(res){
        if(res&&res.success&&res.found){
          if(typeof res.sanchi==='number'){ state.labelIssuedTotal=res.sanchi; _labelIssuedState='ok'; }
          done();
          _countIssued(key,n);
          renderHome();
          return;
        }
        done(); alert('通信エラーで発行を記録できませんでした。');
      },function(){ done(); alert('通信エラーで発行を記録できませんでした。\n記録されたか不明です。時間をおいて在庫表示をご確認ください。'); },
      ISSUE_TIMEOUT);
  }
  function attempt(i){
    hideLoading();
    showLoading(i===0?'発行を記録中...':'発行を記録中...（再試行 '+i+'/'+(ISSUE_MAX_ATTEMPTS-1)+'）');
    // _cb はGoogle側リダイレクト状態のリフレッシュ用（冪等キーではない）
    jsonp(url+'&_cb='+Date.now()+'_'+i,'cb_issue',function(res){
      // duplicate:true（同じreqIdの再送）も success として1回だけ計上する
      if(res&&res.success){ succeed(); return; }
      // ロック競合など retryable なサーバエラーは同じ reqId で再送
      if(res&&res.retryable&&i+1<ISSUE_MAX_ATTEMPTS){ setTimeout(function(){attempt(i+1);},ISSUE_RETRY_WAIT); return; }
      done(); alert('発行の記録に失敗しました。\n'+((res&&res.error)||''));
    },function(){
      if(i+1<ISSUE_MAX_ATTEMPTS){ setTimeout(function(){attempt(i+1);},ISSUE_RETRY_WAIT); return; }
      confirmOrFail();
    },ISSUE_TIMEOUT);
  }
  attempt(0);
}

// ===== 担当者の経路内自動引継 =====
// 保存: 送信成功時のみ (誤タップ波及防止)
// キー: LS_STAFF_MEMORY = { date:'YYYY-MM-DD', byRoute:{routeId: staffName} }
// 日次リセット: date が todayStr と異なれば全破棄
// 経路判定: ROUTES[i].groups[j].stores に storeId が含まれる経路
var LS_STAFF_MEMORY = lsKey('staff_by_route_v1');

function _routeIdOfStore(storeId){
  if(typeof ROUTES==='undefined') return null;
  for(var i=0;i<ROUTES.length;i++){
    var r = ROUTES[i];
    for(var j=0;j<r.groups.length;j++){
      if(r.groups[j].stores.indexOf(storeId) >= 0) return r.id;
    }
  }
  return null;
}

function _storeIdOfName(name){
  // state.store は STORE_DEFS の値なので、name→id 逆引き
  if(typeof STORE_DEFS==='undefined') return null;
  var ids = Object.keys(STORE_DEFS);
  for(var i=0;i<ids.length;i++){
    if(STORE_DEFS[ids[i]].name === name) return ids[i];
  }
  return null;
}

function rememberStaff(store, staff){
  if(!store || !staff) return;
  var storeId = _storeIdOfName(store.name);
  if(!storeId) return;
  var routeId = _routeIdOfStore(storeId);
  if(!routeId) return;  // どの経路にも属さない店舗は対象外
  try {
    var raw = localStorage.getItem(LS_STAFF_MEMORY);
    var mem = raw ? JSON.parse(raw) : null;
    if(!mem || mem.date !== todayStr) mem = { date: todayStr, byRoute: {} };
    if(!mem.byRoute) mem.byRoute = {};
    mem.byRoute[routeId] = staff;
    localStorage.setItem(LS_STAFF_MEMORY, JSON.stringify(mem));
  } catch(e){ /* 容量超は無視 */ }
}

function applyStaffMemory(id){
  // 呼出時点で state.staff は '' に初期化されているが、防御的にチェック
  if(state.staff) return;
  try {
    var raw = localStorage.getItem(LS_STAFF_MEMORY);
    if(!raw) return;
    var mem = JSON.parse(raw);
    if(!mem || mem.date !== todayStr) return;  // 日次リセット
    var routeId = _routeIdOfStore(id);
    if(!routeId) return;
    var s = mem.byRoute && mem.byRoute[routeId];
    if(s) state.staff = s;
  } catch(e){}
}

// ===== 納品指示（配達商品情報）の当日判定 =====
// 【2026-09-24 全面見直し】
// 2026-09-21 の対策は「端末がそのセットを取得した日」を見ていた。これは
// 「その日はじめて取得に成功するまで必ず当日でない」ことを意味するので、
// 起動直後に開く1店舗目は構造的に必ず自動入力されない。2店舗目以降は
// 起動時取得が返り終わっているので入る——というのが今回の症状。
// さらに、当日分の指示が入力されていない場合も取得日スタンプは当日になるため、
// 前日のセットを当日分として黙って自動入力してしまう欠陥もあった。
//
// 正しい基準は「そのセットが何日の配達に向けた指示か」＝対象日。
// 配達商品情報は全店舗まとめて1セットで upsert され、getHaitatsu の
// lastUpdated はそのセット全体の保存時刻（Asia/Tokyo, 'YYYY-MM-DD HH:mm:ss'）。
// 運用は「前夜または当日朝に入力、配達出発前には必ず存在」なので:
//   ・正午より前に保存 → その日の配達分
//   ・正午以降に保存   → 翌日の配達分（前夜入力）
// 配達の実測時間帯は 6:39〜11時台（日報の送信時刻・2026-08-25以降）なので、
// 正午を境にすれば配達中の修正が翌日分に化けることはない。
//
// ★★★ この「保存時刻から対象日を推定する」構造は暫定である（2026-09-24 杉さん承認） ★★★
// 本来は配達商品情報が保存の時点で「何日の配達に向けた指示か」を明示的に持つべきで、
// 推定は要らない。次の作業でそちらへ移行する:
//   ・配達商品情報シート（GAS nippo_summary_gas.js / HAITATSU_HEADERS）に対象日の列を追加
//   ・haitatsu.html が保存時に対象日を明示して送る
//   ・ここは lastUpdated からの推定をやめ、その対象日をそのまま使う
//     （_haitatsuTargetDay / HAITATSU_EVENING_CUTOFF_H はその時点で不要になる）
// 移行までの間だけ、正午を境にした推定で代用する。
// なお正午の境目は「配達後（正午以降）に当日分を修正する運用があるか」の
// 確認待ち。その運用があれば境目を後ろへずらす必要がある（ただし上の移行を
// 済ませれば境目そのものが不要になる）。
var HAITATSU_BUILD = 'haitatsu-target-day-20260924';   // 本番反映の確認用マーカー
var HAITATSU_EVENING_CUTOFF_H = 12;   // ↑のとおり暫定
// 【2026-09-29】取得中が長く続く対策。応答の遅れは転送層の裾（実測 中央値1.45秒・最大19.7秒）で、
// 1本の要求を長く待つより、4秒で応答が無ければ同じ要求をもう1本並べるほうが早い。
var HAITATSU_TIMEOUT      = 10000;   // 1本あたりのタイムアウト（旧20秒）
var HAITATSU_HEDGE_MS     = 4000;    // この時間応答が無ければ同じ要求をもう1本出す
var HAITATSU_RETRY_WAIT   = 8000;    // 失敗時に1回だけ置く間隔（1-4）

function _haitatsuTargetDay(lastUpdated){
  var m = /^(\d{4})-(\d{2})-(\d{2})[ T](\d{2}):/.exec(String(lastUpdated||''));
  if(!m) return '';
  var d = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  if(parseInt(m[4],10) >= HAITATSU_EVENING_CUTOFF_H) d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// 【2026-10-04 最新だけを使う】従来は端末に残した値（haitatsu_latest）の対象日が当日なら、起動直後の
// 取得が届く前から 'ok' にしてその数で自動入力していた。端末に残した後に配達商品情報が直されていると、
// 古い数が入り、届いた最新は「空欄だけ埋める」ので古い数のまま残る。
// 自動入力は、この画面で受け取った最新（haitatsuLatest）だけを使う。届くまでは 'loading'（自動入力しない）。
// 復帰時、最新の受け取りから HAITATSU_RESUME_STALE_MS 以上たっていれば取り直す（届くまで自動入力しない）。
// 取得できなかったときは「取得できませんでした」＋再取得だけ。前回の数字を見せる手段は設けない（2026-10-04 追補）。
var LATEST_ONLY_BUILD = 'latest-only-20261004';   // 本番反映の確認用マーカー
var HAITATSU_RESUME_STALE_MS = 60000;

// 通知バーの状態: 'ok' 取得済みで当日分 / 'loading' 取得中 /
//                 'stale' 当日分が無い / 'error' 取得できなかった
var haitatsuStatus = 'loading';
var haitatsuInfo   = { target:'', lastUpdated:'' };
var haitatsuLatest = null;     // この画面で受け取った最新の納品指示（getHaitatsu の items）
var haitatsuFreshAt = 0;       // それを受け取った時刻(ms)

// この画面で受け取った最新の配達商品情報から、当日分を state.formData['納品_'+price] にセット
// 同期処理。失敗は黙殺（起動を絶対に止めない）。
// opts.onlyEmpty : 既に値が入っている欄は触らない（人の手入力を絶対に上書きしない）
// 戻り値: 実際に値を入れたキーの配列
function applyHaitatsuDefault(id, opts) {
  opts = opts || {};
  var filled = [];
  function put(key, v){
    if(opts.onlyEmpty){
      var cur = state.formData[key];
      if(cur !== '' && cur !== null && cur !== undefined) return false;
    }
    state.formData[key] = String(v);
    filled.push(key);
    return true;
  }
  try {
    var def = STORE_DEFS[id];
    if(!def) return filled;
    // 最新を受け取っていて、その対象日が当日のときだけ入れる（前日以前の値を混入させない）
    if(haitatsuStatus !== 'ok' || !haitatsuLatest) return filled;
    var all = haitatsuLatest;
    var entry = all && all[def.name];
    if(!entry) return filled;
    if(entry.prices){
      Object.keys(entry.prices).forEach(function(price){
        var v = entry.prices[price];
        if(v!==''&&v!==null&&v!==undefined) put('納品_'+price, v);
      });
    }
    // 臨時品目（配達商品情報で追加された定番外の価格）も納品数の既定値にする。
    // 【2026-08-12 修正】配達商品情報は前夜に翌日分を入力する運用のため、
    // extrasDate === todayStr（入力日一致）だと入力の翌朝＝配達当日に消えていた。
    // 【2026-08-14 修正】さらに、前日日付のまま生きているセットを前夜に編集した分は
    // extrasDate が延びず翌朝に失効していたので、最終編集日(extrasTouched)も見る
    // 【2026-09-29】上の2日失効をやめ、品目ごとの終了日で判定する（_extraAliveOn）。
    // ここに来るのは対象日が当日の指示だけなので、当日（todayStr）と比べる。
    // 既存価格と同じ値は取り込まない（納品_¥99 等を二重に上書きしない）。
    if(entry.extras && typeof entry.extras === 'object' && (def.type==='yaoko' || def.type==='choku')){
      Object.keys(entry.extras).forEach(function(price){
        if(!/^¥\d+$/.test(price)) return;
        if((def.prices||[]).indexOf(price) > -1) return;
        if(!_extraAliveOn(entry, price, todayStr)) return;   // 終了した品目は入れない
        var v = entry.extras[price];
        if(v===''||v===null||v===undefined) return;
        var had = state.extraPrices.indexOf(price) >= 0;
        if(!had) state.extraPrices.push(price);
        // 値を入れられなかった（手入力済み・入力中）のに行だけ増やすことはしない
        if(!put('納品_臨#'+price, v) && !had) state.extraPrices.pop();
      });
      state.extraPrices.sort(function(a,b){return parseInt(a.replace('¥',''),10)-parseInt(b.replace('¥',''),10);});
    }
  } catch(e) {}
  return filled;
}

var _haitatsuBgInflight = false;
var _haitatsuGen = 0;          // 取得の世代。前面復帰で取り直したとき、古い世代の応答は捨てる
var _haitatsuStartedAt = 0;
// 起動時に1回だけ取得する（1-5）。失敗したときだけ、少し置いて1回再試行する（1-4）。
// 成功後は店舗を開くたびに叩き直さない。
// 【2026-09-29】4秒で応答が無ければ同じ要求をもう1本出し、先に返ったほうを使う
// （後から返ったほうは捨てる）。両方失敗したときだけ失敗扱い。
function fetchHaitatsuBackground(attempt) {
  attempt = attempt || 0;
  if(_haitatsuBgInflight) return;
  _haitatsuBgInflight = true;
  _haitatsuStartedAt = Date.now();
  var gen = ++_haitatsuGen;
  var settled = false, inflight = 0, hedgeT = null;
  function current(){ return !settled && gen === _haitatsuGen; }
  function fire(){
    inflight++;
    // 日付キー廃止：常に最新1セットを取得
    jsonp(API_URL+'?action=getHaitatsu&_cb='+Date.now(),'cb_hai',function(res){
      inflight--;
      if(!current()) return;
      if(res && res.success && res.items){ settled = true; clearTimeout(hedgeT); onOk(res); return; }
      onFail();
    },function(){ inflight--; if(current()) onFail(); }, HAITATSU_TIMEOUT);
  }
  function onFail(){
    if(inflight > 0) return;   // もう1本がまだ返っていない
    if(hedgeT){ clearTimeout(hedgeT); hedgeT = null; }
    settled = true;
    _haitatsuBgInflight = false;
    _haitatsuFetchFailed(attempt);
  }
  if(haitatsuStatus !== 'ok') { haitatsuStatus = 'loading'; _updateHaitatsuNotice(); }
  fire();
  hedgeT = setTimeout(function(){ hedgeT = null; if(current()) fire(); }, HAITATSU_HEDGE_MS);
  function onOk(res){
    _haitatsuBgInflight = false;
    if(res && res.success && res.items){
      // 店舗依頼のアラートは納品指示の対象日の判定と関係なく反映する
      if(res.irai){ state.irai = res.irai; _updateIraiNotice(); }
      var target = _haitatsuTargetDay(res.lastUpdated);
      haitatsuInfo = { target: target, lastUpdated: String(res.lastUpdated||'') };
      haitatsuLatest = res.items;
      haitatsuFreshAt = Date.now();
      haitatsuStatus = (target === todayStr) ? 'ok' : 'stale';
      if(haitatsuStatus === 'ok') _applyHaitatsuToOpenForm();
      _updateHaitatsuNotice();
    }
  }
}
function _haitatsuFetchFailed(attempt){
  if(attempt === 0){
    var gen = _haitatsuGen;
    // 待ちの間に前面復帰などで取り直していれば、この再試行は出さない
    setTimeout(function(){ if(gen === _haitatsuGen && !_haitatsuBgInflight) fetchHaitatsuBackground(1); }, HAITATSU_RETRY_WAIT);
    return;   // 再試行中は 'loading' のまま
  }
  if(haitatsuStatus !== 'ok') haitatsuStatus = 'error';
  _updateHaitatsuNotice();
}
function retryHaitatsu(){ fetchHaitatsuBackground(1); }
// アプリが前面に戻ったとき、当日分がまだ取れていなければ取り直す。
// 背面の間はタイマーが止まり、取得中の要求は宙に浮いたままになるので、
// 始めてから HAITATSU_HEDGE_MS 以上たった要求は見切って（世代を進めて応答を捨てる）出し直す。
// 【2026-10-04】取得済み（ok・stale）でも、受け取りから HAITATSU_RESUME_STALE_MS 以上たっていれば
// 未確認に戻して取り直す（届くまで、これから開く店舗は自動入力しない）。日付が変わっていれば開き直す。
// 入力中の店舗の欄には触らない（届いた最新は空欄だけに入る＝従来どおり）。
function _haitatsuOnForeground(){
  var n = new Date();
  var ymd = n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
  if(ymd !== todayStr){ if(!hasUnsavedInput()) location.reload(); return; }
  if(haitatsuStatus === 'ok' || haitatsuStatus === 'stale'){
    if(Date.now() - haitatsuFreshAt < HAITATSU_RESUME_STALE_MS) return;
    haitatsuStatus = 'loading';
    haitatsuLatest = null;
    _haitatsuGen++;
    _haitatsuBgInflight = false;
    fetchHaitatsuBackground(0);
    return;
  }
  if(_haitatsuBgInflight){
    if(Date.now() - _haitatsuStartedAt < HAITATSU_HEDGE_MS) return;
    _haitatsuGen++;
    _haitatsuBgInflight = false;
  }
  fetchHaitatsuBackground(0);
}

// 当日分が裏の取得で届いたときに、すでに描画済みの入力画面へ反映する（1-2）。
// 【2026-09-24 変更】従来は「納品欄にひとつでも値が入っていたら何もしない」
// 「入力欄にフォーカスがあったら何もしない」という全か無かの判定だった。
// 1店舗目は取得の到着前に人が入力を始めているのが普通なので、この条件では
// ほぼ必ず不発になる。未入力の欄だけを埋める方式に改める。
//   ・手入力済みの欄は触らない（onlyEmpty）
//   ・再描画はせず input.value を差し込む（キーボードを閉じさせない）
//   ・臨時品目で行が増えるときだけ再描画し、フォーカスと位置を復元する
// フォーカス中の欄も、空であれば入れる。空＝まだ人が何も入れていないので
// 奪うものが無く、ここを避けると「見ている欄だけ永久に空」になってしまう。
// ただし入れた値は選択状態にして、続けて打った数字が連結されないようにする。
function _applyHaitatsuToOpenForm(){
  try {
    if(state.screen !== 'form' || !state.storeId) return;
    var ae = document.activeElement;
    var beforeExtras = state.extraPrices.length;
    var filled = applyHaitatsuDefault(state.storeId, { onlyEmpty:true });
    if(!filled.length) return;
    if(state.extraPrices.length !== beforeExtras){ _renderFormKeepFocus(); return; }
    filled.forEach(function(key){
      var el = document.querySelector('[data-fkey="'+key+'"]');
      if(!el) return;
      el.value = state.formData[key];
      if(el === ae){ try{ el.select(); }catch(e){} }
    });
  } catch(e){}
}
function _renderFormKeepFocus(){
  var ae = document.activeElement;
  var k = (ae && ae.getAttribute) ? ae.getAttribute('data-fkey') : null;
  var wasVal = (ae && k) ? ae.value : null;
  var pos = null;
  try { pos = (ae && typeof ae.selectionStart === 'number') ? ae.selectionStart : null; } catch(e){}
  renderForm();
  if(!k) return;
  var el = document.querySelector('[data-fkey="'+k+'"]');
  if(!el) return;
  try {
    el.focus();
    // 空だった欄に指示が入ったときは選択状態にする（続けて打っても連結しない）
    if(el.value !== wasVal && el.value !== '') el.select();
    else if(pos !== null) el.setSelectionRange(pos,pos);
  } catch(e){}
}

// ===== 納品指示の状態バー（1-3 / 1-4） =====
// 「配達出発前には必ず存在する」ものなので、当日分が無ければ黙って空欄にせず
// 目立つ警告を出す。通信エラーで取れなかった場合とは文面を分ける。
// #app の外に置くので、ホーム↔入力画面を行き来しても消えない。
function _updateHaitatsuNotice(){
  var el = document.getElementById('haitatsu_notice');
  var show = (state.screen === 'home' || state.screen === 'form') && haitatsuStatus !== 'ok';
  if(!show){ if(el && el.parentNode) el.parentNode.removeChild(el); return; }
  if(!el){
    el = document.createElement('div');
    el.id = 'haitatsu_notice';
    var app = document.getElementById('app');
    if(app && app.parentNode) app.parentNode.insertBefore(el, app);
  }
  var tone = (haitatsuStatus === 'loading')
    ? {bg:'#f0f4f8',fg:'#5b7a99',bd:'#b0bec5',btn:'#5b7a99'}
    : (haitatsuStatus === 'stale')
      ? {bg:'#fdecea',fg:'#b71c1c',bd:'#ef9a9a',btn:'#b71c1c'}
      : {bg:'#fff8e1',fg:'#8a6100',bd:'#ffd54f',btn:'#8a6100'};
  el.style.cssText = 'background:'+tone.bg+';color:'+tone.fg+';border:1px solid '+tone.bd
    + ';border-radius:8px;padding:10px;margin:0 16px 8px;font-size:12px;text-align:center;font-weight:600;line-height:1.8';
  var h;
  if(haitatsuStatus === 'loading'){
    h = '納品指示を取得中…<br>届くまで納品数は自動入力されません。';
  } else if(haitatsuStatus === 'stale'){
    h = '⚠️ 本日分の納品指示がありません<br>'
      + '配達商品情報に本日（'+eH(todayStr)+'）の分が入っていません。'
      + (haitatsuInfo.lastUpdated ? '<br>最終更新 '+eH(haitatsuInfo.lastUpdated)
          + (haitatsuInfo.target ? '（'+eH(haitatsuInfo.target)+'の配達分）' : '') : '')
      + '<br>前の日の値を入れないため、納品数は空欄のままにしています。';
  } else {
    h = '⚠️ 納品指示を取得できませんでした<br>通信エラーです（再試行も失敗）。'
      + '<br>納品数は空欄のままです。手入力するか、電波の良い場所で再取得してください。';
  }
  if(haitatsuStatus !== 'loading'){
    h += '<div><button onclick="retryHaitatsu()" style="margin-top:7px;background:'+tone.btn
      + ';color:#fff;border:none;border-radius:6px;padding:6px 14px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">再取得する</button></div>';
  }
  el.innerHTML = h;
}

function renderForm() {
  var s=state.store, p=s.prices, cfg=state.config||getDefaultConfig();
  var html='<div class="screen">';

  // ① 担当者選択
  html+='<div class="staff-sec"><div class="staff-lbl">担当者</div><div class="staff-btns">';
  (cfg.staff||['八島','青柳','杉','その他']).forEach(function(n){ html+='<button class="sbtn'+(state.staff===n?' sel':'')+'" onclick="selStaff(\''+n+'\')">'+n+'</button>'; });
  html+='</div></div>';

  // ② 表（納品/陳列数/蘇生庫/持ち帰り/値引き）
  if(s.type==='yaoko'||s.type==='yaoko_simple') {
    html+=bTable(p, true, s.type==='yaoko');
  } else if(s.type==='choku') {
    html+=bTable(p, false, false);
  } else {
    html+=bSec('📦 納品数','','納品',p);
  }

  // ③ 保存データを読み込む
  html+='<button class="load-btn" id="loadBtn" onclick="loadSavedData()">📥 保存済みデータを読み込む</button>';

  // ④ 商品追加（ヤオコー・直売所）
  if(s.type==='yaoko' || s.type==='choku') html+=bExtraMgr();

  // ⑤ 値引きタイミング説明（ヤオコー系のみ）
  // ※ bExtraSales（追加商品の販売数手入力欄）は廃止：エスマルシェが自動取得するため不要
  if(s.type==='yaoko'||s.type==='yaoko_simple') {
    html+=bDiscountGuide();
  }

  // 特記事項＋送信
  html+='<div class="fsec"><div class="fsec-hdr">📝 特記事項</div><div class="frow"><textarea oninput="upd(\'特記事項\',this.value)" placeholder="気になることがあれば記入">'+eH(state.formData['特記事項']||'')+'</textarea></div></div>';
  html+='<button class="submit-btn" id="submitBtn" onclick="doSubmit()">✅ 送信する</button></div>';
  document.getElementById('app').innerHTML=html;
}

// 【新】表形式1画面入力: 行=価格帯、列=納品/陳列数/(蘇生庫)/値引き/持ち帰り
function bTable(prices, isYaokoLike, hasSosei) {
  // たまや（choku系）のみ「値引き」列を追加。男衾・川本等の他直売所は従来の3列のまま。
  var isTamaya = (state.store && state.store.name === 'たまや');
  var cols = isYaokoLike
    ? (hasSosei ? ['納品','陳列数','蘇生庫','値引き','持ち帰り']
                : ['納品','陳列数','値引き','持ち帰り'])
    : (isTamaya ? ['納品','前日在庫','値引き','持ち帰り']
                : ['納品','前日在庫','持ち帰り']);
  var colCls = {
    '納品':'ctl-green','陳列数':'ctl-blue','蘇生庫':'ctl-purple',
    '持ち帰り':'ctl-orange','値引き':'ctl-red','前日在庫':'ctl-brown'
  };
  var h='<div class="itbl-wrap"><table class="itbl"><thead><tr>';
  h+='<th class="itbl-price">価格</th>';
  cols.forEach(function(c){ h+='<th class="itbl-col '+colCls[c]+'">'+c+'</th>'; });
  h+='</tr></thead><tbody>';
  prices.forEach(function(p){
    h+='<tr><td class="itbl-price">'+eH(p)+'</td>';
    cols.forEach(function(c){
      var key = c+'_'+p;
      var v = state.formData[key] || '';
      h+='<td class="itbl-cell '+colCls[c]+'"><input type="text" inputmode="numeric" pattern="[0-9]*" data-fkey="'+eA(key)+'" placeholder="0" value="'+eA(v)+'" oninput="upd(\''+eA(key)+'\',this.value)"></td>';
    });
    h+='</tr>';
  });
  // 追加商品行（ヤオコー・直売所）
  if(state.store.type==='yaoko' || state.store.type==='choku'){
    state.extraPrices.forEach(function(p){
      var suffix='臨#'+p;
      h+='<tr class="itbl-extra"><td class="itbl-price">➕'+eH(p)+'</td>';
      cols.forEach(function(c){
        var key = c+'_'+suffix;
        var v = state.formData[key] || '';
        h+='<td class="itbl-cell '+colCls[c]+'"><input type="text" inputmode="numeric" pattern="[0-9]*" data-fkey="'+eA(key)+'" placeholder="0" value="'+eA(v)+'" oninput="upd(\''+eA(key)+'\',this.value)"></td>';
      });
      h+='</tr>';
    });
  }
  h+='</tbody></table></div>';
  if(isYaokoLike){
    h+='<div class="itbl-actions"><button class="apply-mini" onclick="applyToChin()">→ 納品数を陳列数に一括反映</button></div>';
  }
  return h;
}

        '<div class="dg-lbl-badge">07</div>' +

// 【互換】fallback: 卸/直売所用の従来1項目セクション（納品数のみ等）
function bSec(title,color,key,prices,note) {
  var h='<div class="fsec" id="sec_'+esc(key)+'"><div class="fsec-hdr '+color+'"><span>'+title+'</span>'+(note?'<span class="note">'+note+'</span>':'')+'</div><div>';
  prices.forEach(function(p){h+=frow(p,key+'_'+p);});
  if(state.store.type==='yaoko') state.extraPrices.forEach(function(p){h+=frow('➕'+p,key+'_臨#'+p,true);});
  return h+'</div></div>';
}
function bExtraMgr() {
  var h='<div class="extra-mgr"><div class="extra-mgr-hdr"><span>➕ 商品追加</span><button class="extra-mgr-add" onclick="addExtraPrice()">＋ 追加</button></div><div class="extra-mgr-body">';
  if(state.extraPrices.length===0){
    h+='<div class="extra-mgr-empty">定番外の商品を追加できます（例：158円の特売品）</div>';
  } else {
    h+='<div class="extra-chips">';
    state.extraPrices.forEach(function(p,i){
      h+='<span class="extra-chip">➕'+eH(p)+'<button class="extra-chip-del" onclick="rmExtraPrice('+i+')" aria-label="削除">×</button></span>';
    });
    h+='</div>';
  }
  return h+'</div></div>';
}
// bExtraSales: 廃止（追加商品の販売数手入力欄はエスマルシェ自動取得により不要）
// 過去に入力された「販売数_臨#¥XXX」キーは loadSavedData 経由で state.formData に
// 残る可能性があるが、入力UIが無いため上書き機会がなく、送信時にそのまま送られる。
// 通常は esmarche が別途書き込むためデータ側は問題なし。
function frow(label,key,isExtra) {
  var v=state.formData[key]||'';
  var unit=(state.store.units&&state.store.units[label])?state.store.units[label]:'個';
  return '<div class="frow'+(isExtra?' extra':'')+'"><span class="frow-lbl">'+label+'</span><div class="frow-inp"><input type="text" inputmode="numeric" pattern="[0-9]*" data-fkey="'+eA(key)+'" placeholder="0" value="'+eA(v)+'" oninput="upd(\''+eA(key)+'\',this.value)"><span class="frow-unit">'+unit+'</span></div></div>';
}
function addExtraPrice() {
  // prompt を廃止し、inputmode="numeric" のHTML入力モーダルで金額入力（数字テンキー対応）
  showPriceModal(function(v){
    if(v===null) return;
    v=String(v).trim().replace(/[¥￥]/g,'').replace(/[,，]/g,'');
    var n=parseInt(v,10);
    if(!n||n<=0||isNaN(n)){alert('正の整数を入力してください');return;}
    var label='¥'+n;
    if(state.extraPrices.indexOf(label)>-1){alert(label+'は既に追加されています');return;}
    if((state.store.prices||[]).indexOf(label)>-1){alert('既存価格('+label+')と同じです。追加できません。');return;}
    state.extraPrices.push(label);
    state.extraPrices.sort(function(a,b){return parseInt(a.replace('¥',''),10)-parseInt(b.replace('¥',''),10);});
    renderForm();
  });
}
// 金額入力モーダル（type=text inputmode=numeric pattern=[0-9]* で正の整数テンキー）
function showPriceModal(cb){
  var ov=document.createElement('div');
  ov.className='price-modal-ov';
  ov.innerHTML='<div class="price-modal"><div class="price-modal-ttl">追加する商品の価格（円）</div>'
    +'<input type="text" inputmode="numeric" pattern="[0-9]*" class="price-modal-inp" placeholder="例：158" maxlength="6">'
    +'<div class="price-modal-btns"><button type="button" class="price-modal-cancel">キャンセル</button><button type="button" class="price-modal-ok">追加</button></div></div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector('.price-modal-inp');
  var done=false;
  function close(val){ if(done)return; done=true; if(ov.parentNode)ov.parentNode.removeChild(ov); cb(val); }
  ov.querySelector('.price-modal-ok').onclick=function(){ close(inp.value); };
  ov.querySelector('.price-modal-cancel').onclick=function(){ close(null); };
  ov.addEventListener('click',function(e){ if(e.target===ov) close(null); });
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); close(inp.value); } else if(e.key==='Escape'){ close(null); } });
  setTimeout(function(){ try{ inp.focus(); }catch(e){} },50);
}
function rmExtraPrice(idx) {
  var p=state.extraPrices[idx];
  if(!p) return;
  if(!confirm(p+' の追加商品を削除しますか？\n入力したデータも消えます。')) return;
  Object.keys(state.formData).forEach(function(k){
    if(k.indexOf('_臨#'+p)>-1) delete state.formData[k];
  });
  state.extraPrices.splice(idx,1);
  renderForm();
}

function shiftDate(ds, days) {
  var d = new Date(ds+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function tryLoadDate(date, isFallback) {
  var btn = document.getElementById('loadBtn');
  var url = API_URL
    + '?action=getStoreData'
    + '&store=' + encodeURIComponent(state.store.name)
    + '&date=' + date;

  jsonp(url, 'cb_load', function(res) {
    if (!res.success) {
      if (!isFallback) {
        // 今日のデータが無ければ前日を試す（前日値引き継ぎ）
        tryLoadDate(shiftDate(todayStr, -1), true);
        return;
      }
      alert('本日・前日の保存データはありません。');
      if (btn) { btn.disabled = false; btn.textContent = '📥 保存済みデータを読み込む'; }
      return;
    }
    // 担当者は今日のデータからのみ反映（前日fallback時は触らない）
    if (res.staff && !isFallback) state.staff = res.staff;

    // formData / extraPrices をリセット
    state.formData = {};
    state.extraPrices = [];

    // GASのキー形式（例: "S品_¥99（個）"）→ アプリのキー形式（"S品_¥99"）に変換
    if (res.items) {
      Object.keys(res.items).forEach(function(key) {
        var cleanKey = key.replace('（個）', '').replace('（kg）', '');
        state.formData[cleanKey] = res.items[key];
        // 元のキーそのままも保持（互換性）
        state.formData[key] = res.items[key];
        // 追加商品（内部識別子: 臨#）をキーから抽出
        var m = cleanKey.match(/_臨#(¥\d+)/);
        if (m && state.extraPrices.indexOf(m[1])<0) state.extraPrices.push(m[1]);
      });
    }
    state.extraPrices.sort(function(a,b){return parseInt(a.replace('¥',''),10)-parseInt(b.replace('¥',''),10);});

    // 【後方互換】旧S品+A品+B品 → 陳列数、旧C品 → 値引き への統合
    // 過去データ (2026-07-02以前の S/A/B/C 形式) を新形式にマップ。
    // 新形式データ（陳列数_/値引き_）が既にあれば旧値を上書きしない。
    var suffixes = (state.store.prices||[]).slice();
    (state.extraPrices||[]).forEach(function(pp){ suffixes.push('臨#'+pp); });
    suffixes.forEach(function(sf){
      // 陳列数: 新形式なければ S+A+B 合計を採用
      if(state.formData['陳列数_'+sf] === undefined || state.formData['陳列数_'+sf] === ''){
        var sum=0, hasAny=false;
        ['S品','A品','B品'].forEach(function(cat){
          var v = state.formData[cat+'_'+sf];
          if(v!==undefined && v!==''){ sum += parseInt(v)||0; hasAny=true; }
        });
        if(hasAny) state.formData['陳列数_'+sf] = String(sum);
      }
      // 値引き: 新形式なければ C品 を採用
      if((state.formData['値引き_'+sf]===undefined || state.formData['値引き_'+sf]==='') &&
         state.formData['C品_'+sf]!==undefined && state.formData['C品_'+sf]!==''){
        state.formData['値引き_'+sf] = state.formData['C品_'+sf];
      }
      // 旧S/A/B/Cキーは削除（送信時に旧列を書かないため）
      ['S品','A品','B品','C品'].forEach(function(cat){
        delete state.formData[cat+'_'+sf];
        delete state.formData[cat+'_'+sf+'（個）'];
      });
    });

    // フォームを再描画
    renderForm();
    // 読み込み完了メッセージ
    var newBtn = document.getElementById('loadBtn');
    if (newBtn) {
      if (isFallback) {
        newBtn.textContent = '📥 '+date.slice(5).replace('-','/')+'(前日)を読込';
      } else {
        newBtn.textContent = '✅ 読み込み完了';
      }
      newBtn.disabled = true;
    }
  }, function() {
    alert('データの取得に失敗しました。');
    var newBtn = document.getElementById('loadBtn');
    if (newBtn) { newBtn.disabled = false; newBtn.textContent = '📥 保存済みデータを読み込む'; }
  });
}


// 日報送信。二重記録防止:
//   F) 送信中は送信ボタンを disabled ＋ _submitBusy で多重送信を無視
//   B) 送信操作ごとに reqId(UUID) を発番。自動リトライは同じ reqId で再送し、
//      GAS側が同一 date × reqId の行を検知して追記しない（duplicate:true）。
//      値を直しての「別の送信操作」は別 reqId → 従来どおり追記＋読み側マージで反映。
//   C) 全試行が通信エラーで終わったら getSubmitStatus で記録の有無を確認し、
//      入っていれば成功扱い（誤った再送信＝別reqIdでの真の二重行を防ぐ）。
// 【2026-08-05 再設計：配達員を1〜2分待たせない・入力を絶対に失わない】
// 旧設計は 30秒タイムアウト×3回＋確認30秒＝最大124秒待たせてから失敗表示していた。
// しかも入力の退避が無く、失敗後に画面を離れると入力が消えた。
//
// 実測（テストGAS・2026-08-05）:
//   submitForm      : GAS実行 0.9〜6.1秒 / 総応答 p50≈5秒・p90≈13秒
//   getSubmitStatus : p50≈3.1秒・p90≈3.8秒
//   ScriptLock 待ち : 配達員3名同時送信でも最大 3.4秒。5並列(3名同時送信＋
//                     サマリー閲覧＋配達商品情報保存)25回でもロック競合ゼロ
//                     → 「同時送信によるロック競合」は主因ではなかった
//   まれに 20〜70秒の外れ値・404/HTML中間ページ（Google側の転送レイヤ起因）
//
// 新方針:
//   1) タイムアウトで見切り、すぐ getSubmitStatus 確認へ
//   2) 見切った後も遅延到着を拾い、遅れて success が届いたら即完了にする
//   3) 全体締切 SUBMIT_DEADLINE を超えたら新しい試行を始めない
//   4) 送信前に必ず localStorage へ退避。失敗しても入力は消えず、
//      店舗一覧のバナーからいつでも再送できる（reqId 据え置きで二重記録なし）
//
// 【2026-08-12 計測でわかったこと → 楽観的UIへ】
//   区間計測の結果、GAS内部の実処理は中央値 1.5秒（ロック0.12/シートopen0.28/
//   ヘッダ0.22/reqId照合0.39/append0.15/キャッシュ0.21）にすぎず、体感時間の
//   大半は Google の転送・実行スケジューリング層だった。しかも「常に遅い」のではなく
//   「時々ひどく遅い」分布で、10回中3回が12秒タイムアウトに到達し体感14〜15秒。
//   シートに触らない getConfig でも同じ尾を引くため、サーバ処理の最適化では
//   この裾は消せない（＝待ち方を変えるしかない）。
//   → 送信ボタンで即「送信完了」を表示し、記録の確認は裏で行う。
//   安全性は3層で担保する:
//     層1 送信を始める前に localStorage へ退避（通信断でも入力は消えない）
//     層2 裏の確認が失敗し、完了画面がまだ開いていればその場で警告＋再送導線
//         （画面を離れていれば店舗一覧のバナーが即座に出る）
//     層3 次回起動時に reqId 照合し、未記録なら必ずバナーで知らせる
//   二重記録対策（reqId dedup / ScriptLock / 確認導線）は一切弱めていない。
// 【2026-09-29 再設計：送信は裏で届くまで面倒を見る。誤警告を出さない】
// 調査（_backup\20260929_nippo3件調査\report.md 件3）で分かった穴:
//   ・getSubmitStatus はロックを取らないので、送信が処理中・順番待ちでも「見つからない」を返す。
//     それを「未送信」と確定扱いしていた（誤警告）
//   ・見切った後に届いた成功を捨てていた。照合の結果も一度決まると再照合しなかった
//   ・JSONP（script タグ）は画面を移るとページごと中断される
//   ・日付が変わると前日の退避を黙って捨てていた
// 新方式:
//   ・送信は fetch の keepalive（画面を移っても送信が続く）。使えない端末は従来の JSONP
//   ・照合と再送は裏で自動に回す（送信の5秒・15秒・45秒・2分後、以後3分ごと。前面復帰・起動時も）
//   ・最後の送信から90秒以内の「見つからない」は処理中とみなし、数えない
//   ・90秒を過ぎて見つからなければ同じ reqId で自動再送（二重記録にはならない）
//   ・赤い警告は「最初の送信から10分・見つからない3回以上・自動再送2回済み」がそろったときだけ
//   ・警告を出した後も照合は続け、届いたと分かれば黙って「送信済み」に直す
//   ・前日以前の退避も捨てず、その日付のまま照合・再送する
// reqId による重複排除（GAS のロック内照合）はそのまま使う。GAS は変えていない。
var SUBMIT_BUILD          = 'submit-deliver-20260929';   // 本番反映の確認用マーカー
var SUBMIT_RETRY_WAIT     = 600;     // retryable（ロック待ち）のときの再送間隔(ms)
var SUBMIT_RETRYABLE_MAX  = 2;       // retryable の即時再送の上限（1回の送信あたり）
var SUBMIT_TIMEOUT        = 7500;    // 送信の応答を待つ時間。過ぎたら照合に任せる（送信自体は続く）
var SUBMIT_LATE_GRACE     = 25000;   // JSONP で見切り後に遅延到着を拾う猶予(ms)
var CONFIRM_TIMEOUT       = 8000;    // getSubmitStatus 実測 p90≈3.8秒
var SUBMIT_PROCESSING_MS  = 90000;   // 最後の送信からこの間の「見つからない」は処理中扱い
var SUBMIT_CHECK_STEPS    = [5000, 15000, 45000, 120000];   // 最後の送信からの照合の間隔
var SUBMIT_CHECK_EVERY    = 180000;  // 上の後は3分ごと
var SUBMIT_ALERT_AFTER_MS = 600000;  // 赤い警告の条件：最初の送信から10分
var SUBMIT_ALERT_NOTFOUND = 3;       //                  見つからない（処理中を除く）3回以上
var SUBMIT_AUTO_RESEND    = 2;       //                  自動再送2回済み
var SUBMIT_AUTO_RESEND_MAX = 6;      // 自動再送の上限（警告の後も続けるが、ここで止める）
var SUBMIT_AUTO_RESEND_GAP = 300000; // 2回目以降の自動再送の間隔の下限（警告後）
var SUBMIT_UNREACHABLE_MS = 900000;  // 照合に15分応答が無ければ「電波の良い所で自動で送ります」
var LS_SUBMIT_PENDING     = lsKey('nippo_submit_pending_v1');
var _submitBusy = false;
function _setSubmitBtnDisabled(d){
  var b=document.getElementById('submitBtn');
  if(b) b.disabled=!!d;
}

// ---- 未送信日報の退避 ----
// 保存するのは「そのまま再送できる完全な送信内容」と、配送の進み具合
// （firstSentAt/lastSentAt/sends/notFound/autoResends/lastReplyAt/rejected）。
// reqId も一緒に持つので、再送しても GAS 側の同一 date × reqId 重複検知で二重記録にならない。
//
// 【店舗×日付ごとに保持する】配達員は1経路で3〜6店舗を順に回り、店舗ごとに送信する。
// 【2026-09-29】前日分を捨てずに残すので、キーは「日付|店舗名」にする
// （前日の長瀬店が未着のまま今日の長瀬店を送っても、前日分を上書きしない）。
// 旧形式（キー＝店舗名）も読み込み時に同じ形へ直す。
function _pendingKey(p){ return p.date+'|'+p.storeName; }
function _readPendingMap(){
  try{
    var raw=localStorage.getItem(LS_SUBMIT_PENDING);
    if(!raw) return {};
    var m=JSON.parse(raw);
    if(!m||typeof m!=='object'||Array.isArray(m)) return {};
    var out={};
    Object.keys(m).forEach(function(k){
      var o=m[k];
      if(o&&o.storeName&&o.reqId&&o.items&&/^\d{4}-\d{2}-\d{2}$/.test(String(o.date||''))) out[_pendingKey(o)]=o;
    });
    return out;
  }catch(e){ return {}; }
}
function _savePendingMap(m){
  try{
    if(!m||Object.keys(m).length===0) localStorage.removeItem(LS_SUBMIT_PENDING);
    else localStorage.setItem(LS_SUBMIT_PENDING, JSON.stringify(m));
  }catch(e){}
}
function _writeSubmitPending(p){
  var m=_readPendingMap(); m[_pendingKey(p)]=p; _savePendingMap(m);
}
function _findPendingByReq(reqId){
  var m=_readPendingMap(), ks=Object.keys(m);
  for(var i=0;i<ks.length;i++){ if(m[ks[i]].reqId===reqId) return m[ks[i]]; }
  return null;
}
// reqId で書き換える（同じ店舗・日付を後から別の送信で上書きしていたら何もしない）
function _patchPending(reqId, fn){
  var m=_readPendingMap(), ks=Object.keys(m);
  for(var i=0;i<ks.length;i++){
    if(m[ks[i]].reqId===reqId){ fn(m[ks[i]]); _savePendingMap(m); return m[ks[i]]; }
  }
  return null;
}
function _clearPendingByReq(reqId){
  var m=_readPendingMap(), hit=false;
  Object.keys(m).forEach(function(k){ if(m[k].reqId===reqId){ delete m[k]; hit=true; } });
  if(hit) _savePendingMap(m);
  return hit;
}
function _listSubmitPending(){
  var m=_readPendingMap();
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return a.date<b.date ? -1 : a.date>b.date ? 1 : 0; });
}

// ---- 配送（送信・照合・自動再送）----
// 状態は退避（localStorage）に持つので、画面の再読み込み・日付の変わり目をまたいで続く。
// ここ（_dlRun）はこの画面の中だけの作業状態（通信中か・次のタイマー）。
var _dlRun = {};   // reqId -> { sending, checking, timer, checks（次に使う照合の段）, retryable }
function _dl(reqId){ return _dlRun[reqId] || (_dlRun[reqId]={ sending:false, checking:false, timer:null, checks:0, retryable:0 }); }

// 状態: 'checking'（確認中・処理中。警告しない）／'offline'（照合に長く応答が無い）／
//       'unsent'（赤い警告の条件がそろった）／'rejected'（サーバが受け付けなかった）
function _submitState(p, now){
  now = now || Date.now();
  if(p.rejected) return 'rejected';
  var first = p.firstSentAt || now;
  if(now-first >= SUBMIT_ALERT_AFTER_MS && (p.notFound||0) >= SUBMIT_ALERT_NOTFOUND
     && (p.autoResends||0) >= SUBMIT_AUTO_RESEND) return 'unsent';
  if(now-(p.lastReplyAt||first) >= SUBMIT_UNREACHABLE_MS) return 'offline';
  return 'checking';
}

function _submitUrl(p){
  return API_URL+'?action=submit&store='+encodeURIComponent(p.storeName)+'&date='+p.date
    +'&staff='+encodeURIComponent(p.staff)+'&items='+encodeURIComponent(JSON.stringify(p.items))
    +'&reqId='+encodeURIComponent(p.reqId);
}
function _canKeepalive(){
  try{ return typeof fetch==='function' && typeof Request==='function' && ('keepalive' in Request.prototype); }
  catch(e){ return false; }
}

// 1回送る。結果は onResult(kind,res)：'ok'／'retryable'／'rejected'／'unknown'（読めない・遅い・通信失敗）。
// 'unknown' の後に遅れて届いた応答も _dlOnLate で拾う。
function _dlTransmit(p, onResult){
  var url=_submitUrl(p)+'&_cb='+Date.now();
  // 保存と送信の記録用（GAS はこの値を記録するだけで、送信の処理には使わない）
  try{ url+=_auditQuery({ via:(_canKeepalive()?'keepalive':'jsonp'), why:(p.lastWhy||''), n:(p.sends||1) }); }catch(e){}
  var done=false;
  function fin(kind,res){ if(done) return false; done=true; onResult(kind,res); return true; }
  function classify(res){
    if(res&&res.success) return 'ok';               // duplicate:true（同じreqIdの再送）も成功
    if(res&&res.retryable) return 'retryable';      // ロックが取れず、書き込みは起きていない
    if(res&&res.success===false) return 'rejected'; // データ起因。行は追記されていない
    return 'unknown';
  }
  if(_canKeepalive()){
    // keepalive：画面を移っても・アプリを切り替えても要求は送られ続ける。
    // GAS は ANYONE_ANONYMOUS の GET なので、CORS で応答（JSON）を読める。
    // 読めなくても（CORS・通信断）書き込みは成立し得るので、結果は reqId の照合で確かめる。
    // タイムアウトで abort はしない（abort すると keepalive の意味が無くなる）。
    var t=setTimeout(function(){ fin('unknown'); }, SUBMIT_TIMEOUT);
    fetch(url,{ method:'GET', keepalive:true, mode:'cors', credentials:'omit', cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(res){ clearTimeout(t); var k=classify(res); if(!fin(k,res)) _dlOnLate(p.reqId,k,res); })
      .catch(function(){ clearTimeout(t); fin('unknown'); });
    return;
  }
  // keepalive の無い端末：従来の JSONP。画面を移ると中断されるが、次に開いたときの照合と自動再送で拾う。
  jsonp(url,'cb_sub',function(res){ var k=classify(res); if(!fin(k,res)) _dlOnLate(p.reqId,k,res); },
    function(){ fin('unknown'); }, SUBMIT_TIMEOUT,
    { lateGraceMs: SUBMIT_LATE_GRACE, onLate: function(res){ _dlOnLate(p.reqId,classify(res),res); } });
}
// 見切った後に届いた応答。成功ならその時点で「送信済み」に直す（警告を出した後でも）。
function _dlOnLate(reqId, kind, res){
  if(kind==='ok') _dlDelivered(reqId);
  else if(kind==='rejected') _dlRejected(reqId, res);
}

// why: 'first'（送信ボタン）／'auto'（自動再送）／'manual'（再送ボタン）
function _dlSend(reqId, why){
  var r=_dl(reqId);
  if(r.sending) return;
  var now=Date.now();
  var p=_patchPending(reqId, function(o){
    if(why==='manual' || !o.firstSentAt){
      // 再送ボタンは数え直し（ここから改めて10分・自動再送2回を待ってから警告する）
      o.firstSentAt=now; o.notFound=0; o.autoResends=0; o.rejected='';
    }
    if(why==='auto') o.autoResends=(o.autoResends||0)+1;
    o.sends=(o.sends||0)+1;
    o.lastWhy=why;   // 保存と送信の記録用（初回か再送か）
    o.lastSentAt=now;
    if(!o.lastReplyAt || why==='manual') o.lastReplyAt=now;
  });
  if(!p) return;
  r.sending=true; r.checks=0;
  clearTimeout(r.timer); r.timer=null;
  _dlTransmit(p, function(kind,res){
    r.sending=false;
    if(kind==='ok'){ _dlDelivered(reqId); return; }
    if(kind==='rejected'){ _dlRejected(reqId,res); return; }
    if(kind==='retryable' && r.retryable<SUBMIT_RETRYABLE_MAX){
      // 書き込みは起きていないので、照合を挟まずすぐ同じ reqId で送り直す（自動再送には数えない）
      r.retryable++;
      r.timer=setTimeout(function(){ r.timer=null; _dlSend(reqId,'retry'); }, SUBMIT_RETRY_WAIT);
      return;
    }
    r.retryable=0;
    _dlArm(reqId);
    _submitRefreshViews();
  });
}

// 次の照合を予約する（最後の送信からの経過で決める）
function _dlArm(reqId){
  var r=_dl(reqId), p=_findPendingByReq(reqId);
  if(!p || r.sending || r.checking || p.rejected) return;
  clearTimeout(r.timer);
  // 過ぎてしまった段（再読み込み・背面復帰の後）は飛ばし、次の未来の段に合わせる（照合を連打しない）
  var steps=SUBMIT_CHECK_STEPS, base=p.lastSentAt||0, now=Date.now(), at;
  for(;;){
    var i=r.checks;
    at = base + (i<steps.length ? steps[i] : steps[steps.length-1]+(i-steps.length+1)*SUBMIT_CHECK_EVERY);
    if(at>now) break;
    r.checks++;
  }
  r.timer=setTimeout(function(){ r.timer=null; _dlCheck(reqId); }, at-now);
}

function _dlCheck(reqId){
  var r=_dl(reqId), p=_findPendingByReq(reqId);
  if(!p || r.sending || r.checking) return;
  if(!p.sends){
    // 送った記録を持たない退避（旧版の退避・送信直前に画面が閉じた等）。届いている可能性があるので
    // まず照合し、見つからなければそのまま自動再送に進む（lastSentAt=0＝処理中とはみなさない）。
    var now0=Date.now();
    p=_patchPending(reqId,function(o){ o.sends=1; o.firstSentAt=o.firstSentAt||now0; o.lastSentAt=0; o.lastReplyAt=o.lastReplyAt||now0; });
  }
  r.checking=true;
  clearTimeout(r.timer); r.timer=null;
  jsonp(API_URL+'?action=getSubmitStatus&store='+encodeURIComponent(p.storeName)
    +'&date='+p.date+'&reqId='+encodeURIComponent(p.reqId)+'&_cb='+Date.now(),
    'cb_pend_chk',function(res){
      r.checking=false;
      if(res&&res.success&&res.found){ _dlDelivered(reqId); return; }
      var cur=_findPendingByReq(reqId);
      if(!cur) return;
      if(res&&res.success){
        var now=Date.now();
        var processing = now-(cur.lastSentAt||0) < SUBMIT_PROCESSING_MS;   // 処理中・順番待ちの可能性
        cur=_patchPending(reqId,function(o){ o.lastReplyAt=now; if(!processing) o.notFound=(o.notFound||0)+1; });
        if(!processing && _dlShouldAutoResend(cur, now)){ _dlSend(reqId,'auto'); _submitRefreshViews(); return; }
      }
      // 照合自体の失敗（success でない応答）は何も確定させない
      _dlArm(reqId);
      _submitRefreshViews();
    },function(){
      r.checking=false;
      _dlArm(reqId);
      _submitRefreshViews();
    },CONFIRM_TIMEOUT,{
      lateGraceMs: SUBMIT_LATE_GRACE,
      onLate: function(res){ if(res&&res.success&&res.found) _dlDelivered(reqId); }
    });
}
function _dlShouldAutoResend(p, now){
  var n=p.autoResends||0;
  if(n < SUBMIT_AUTO_RESEND) return true;
  if(n >= SUBMIT_AUTO_RESEND_MAX) return false;
  return now-(p.lastSentAt||0) >= SUBMIT_AUTO_RESEND_GAP;
}

function _dlDelivered(reqId){
  var r=_dlRun[reqId];
  if(r){ clearTimeout(r.timer); delete _dlRun[reqId]; }
  _clearPendingByReq(reqId);
  _setDoneStatus(reqId,'ok','送信済み（サーバへの記録を確認しました）');
  _updateSubmitPendingBanner();
}
function _dlRejected(reqId, res){
  var r=_dlRun[reqId];
  if(r){ clearTimeout(r.timer); r.timer=null; }
  _patchPending(reqId,function(o){ o.rejected=String((res&&res.error)||'サーバエラー'); });
  _submitRefreshViews();
}

// 退避が残っているものすべてについて、照合を始める。
// now=true：前面復帰・起動時。予約を待たずにすぐ照合する（最後の送信から5秒以内は除く）。
function _kickSubmitPendingChecks(now){
  _listSubmitPending().forEach(function(p){
    var r=_dl(p.reqId);
    if(r.sending || r.checking || p.rejected) return;
    if(now && Date.now()-(p.lastSentAt||0) >= SUBMIT_CHECK_STEPS[0]){ _dlCheck(p.reqId); return; }
    if(!r.timer) _dlArm(p.reqId);
  });
}

function _submitRefreshViews(){
  _updateSubmitPendingBanner();
  var el=document.getElementById('done_status');
  var reqId=el && el.getAttribute('data-req');
  if(!reqId) return;
  var p=_findPendingByReq(reqId);
  if(!p) return;
  var st=_submitState(p);
  if(st==='unsent' || st==='rejected') _setDoneStatus(reqId,'ng',_submitStateMsg(p,st),reqId);
  else if(st==='offline') _setDoneStatus(reqId,'warn','電波の良い所で自動で送ります',null);
  else _setDoneStatus(reqId,'pending','確認中…（届いていなければ自動で送り直します）');
}
function _mdOf(date){ var m=/^\d{4}-(\d{2})-(\d{2})$/.exec(date||''); return m ? (parseInt(m[1],10)+'/'+parseInt(m[2],10)) : String(date||''); }
function _submitStateMsg(p, st){
  if(st==='rejected') return 'サーバが受け付けませんでした（'+p.rejected+'）';
  return (p.date!==todayStr ? '前日以前（'+_mdOf(p.date)+'）の日報が' : '')+'まだサーバに届いていません';
}

function _updateSubmitPendingBanner(){
  _kickSubmitPendingChecks(false);
  var list=_listSubmitPending();
  var el=document.getElementById('submit_pending_notice');
  if(list.length===0){
    if(el&&el.parentNode) el.parentNode.removeChild(el);
    return;
  }
  var now=Date.now();
  // 全体の色は最も重い状態に合わせる（未着・受付不可 ＞ 照合できず ＞ 確認中）
  var anyRed=false, anyOffline=false;
  list.forEach(function(p){
    var st=_submitState(p,now);
    if(st==='unsent'||st==='rejected') anyRed=true; else if(st==='offline') anyOffline=true;
  });
  var tone = anyRed     ? {bg:'#fdecea',fg:'#b71c1c',bd:'#ef9a9a',rule:'#f3c4c0',btn:'#b71c1c'}
           : anyOffline ? {bg:'#fff8e1',fg:'#8a6100',bd:'#ffd54f',rule:'#f0dca8',btn:'#8a6100'}
           :              {bg:'#f0f4f8',fg:'#5b7a99',bd:'#b0bec5',rule:'#d4dde4',btn:'#5b7a99'};
  if(!el){
    el=document.createElement('div');
    el.id='submit_pending_notice';
    var app=document.getElementById('app');
    if(app&&app.parentNode) app.parentNode.insertBefore(el,app);
  }
  el.style.cssText='background:'+tone.bg+';color:'+tone.fg+';border:1px solid '+tone.bd
    +';border-radius:8px;padding:10px;margin:0 16px 8px;font-size:12px;text-align:center;font-weight:600;line-height:1.8';
  var h = anyRed     ? '⚠️ サーバに届いていない日報があります<br>入力内容はこの端末に残っています。自動で送り直していますが、まだ届いていません。'
        : anyOffline ? 'サーバに確認できていない日報があります<br>入力内容はこの端末に残っています。電波の良い所で自動で送ります。'
        :              '送信を確認しています…<br>入力内容はこの端末に残っています。届いていなければ自動で送り直します。';
  list.forEach(function(p){
    var st=_submitState(p,now);
    var lbl = (st==='unsent'||st==='rejected') ? _submitStateMsg(p,st)
            : (st==='offline') ? '自動で送ります（電波待ち）' : '確認中…';
    var when = (p.date!==todayStr ? _mdOf(p.date)+' ' : '')+(p.at||'');
    h+='<div style="margin-top:7px;padding-top:7px;border-top:1px solid '+tone.rule+'">'
      +eH(p.storeName)+'（'+eH(p.staff)+'・'+eH(when)+'）　'+eH(lbl)+'<br>';
    if(st==='unsent'||st==='rejected'){
      var rq=eA(String(p.reqId).replace(/'/g,''));
      h+='<button onclick="resendSubmitPending(\''+rq+'\')" style="margin-top:5px;background:'+tone.btn+';color:#fff;border:none;border-radius:6px;padding:6px 14px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">いますぐ再送する</button>'
        +' <button onclick="discardSubmitPending(\''+rq+'\')" style="margin-top:5px;margin-left:4px;background:none;border:1px solid '+tone.bd+';border-radius:6px;padding:6px 10px;font-family:inherit;font-size:12px;color:'+tone.fg+';cursor:pointer">破棄</button>';
    }
    h+='</div>';
  });
  el.innerHTML=h;
}
// 再送ボタン（同じ reqId で送るので二重記録にはならない）
function resendSubmitPending(reqId){
  if(!_findPendingByReq(reqId)){ _updateSubmitPendingBanner(); return; }
  _dlSend(reqId,'manual');
  _submitRefreshViews();
}
function discardSubmitPending(reqId){
  var p=_findPendingByReq(reqId);
  if(!p){ _updateSubmitPendingBanner(); return; }
  if(!confirm(p.storeName+'（'+_mdOf(p.date)+'）の未送信日報を破棄します。よろしいですか？')) return;
  var r=_dlRun[reqId];
  if(r){ clearTimeout(r.timer); delete _dlRun[reqId]; }
  _clearPendingByReq(reqId);
  _updateSubmitPendingBanner();
}

function doSubmit() {
  if(_submitBusy) return;                    // 送信中の再タップを無視
  if(!state.staff){alert('担当者を選択してください');return;}
  var items=[];
  Object.keys(state.formData).forEach(function(k){var v=state.formData[k];if(v!==''&&v!==null&&v!==undefined)items.push({key:k,value:String(v)});});
  var d=new Date();
  var pending={
    storeName: state.store.name,
    storeId:   state.storeId || '',
    staff:     state.staff,
    date:      todayStr,
    items:     items,
    reqId:     _uuid(),
    at:        String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
  };
  // 【最優先】送信を始める前に端末へ退避。以降どこで失敗しても入力は失われない。
  _writeSubmitPending(pending);
  _runSubmit(pending);
}

// 完了画面に出す「確認中／送信済み／届いていない」の控えめな表示。
// 操作はブロックしない。表示中の完了画面が別の送信のものなら何もしない
// （A店の完了画面を見ている最中に、先に出したB店の確認結果で書き換えない）。
function _setDoneStatus(reqId, kind, msg, resendReqId){
  var el=document.getElementById('done_status');
  if(!el || el.getAttribute('data-req')!==reqId) return false;
  el.className='done-status ds-'+kind;
  if(kind==='ng'||kind==='warn'){
    el.innerHTML='<div class="ds-msg">⚠️ '+eH(msg)+'</div>'
      +'<div class="ds-sub">入力内容はこの端末に残っています。自動で送り直しています（二重記録にはなりません）。</div>'
      +(resendReqId ? '<button class="ds-retry" onclick="resendSubmitPending(\''+eA(String(resendReqId).replace(/'/g,''))+'\')">🔄 いますぐ再送する</button>' : '');
  } else {
    el.innerHTML='<div class="ds-msg">'+eH(msg)+'</div>';
  }
  return true;
}

// 【楽観的UI】応答を待たず完了画面へ。退避は呼び出し元で済んでいる。
// 以降の送信・照合・再送はすべて裏（_dlSend/_dlCheck）で行う。
function _runSubmit(pending){
  rememberStaff(state.store, pending.staff);   // 確認の成否に関わらず害はない
  _submitBusy=false; _setSubmitBtnDisabled(false); hideLoading();
  renderDone(pending.reqId);
  _dlSend(pending.reqId,'first');
}
