<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配達日報 サマリー | 栄ガーデン</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root{
  --ink:#1a1a2e; --paper:#faf8f3; --accent:#c0392b; --rule:#d4c9b0; --light:#f0ebe0;
  --green:#27ae60; --blue:#2980b9; --brown:#795548; --purple:#7b1fa2; --orange:#e65100;
  --yellow-bg:#fffde7; --yellow-bd:#f9a825; --yellow-lbl:#f57f17;
  --cyan:#0097a7; --cyan-bg:#e0f7fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:#e8e0d0;min-height:100vh;padding:12px 12px 60px;color:var(--ink)}
.topbar{background:var(--ink);color:#fff;padding:14px 16px 10px;border-radius:10px 10px 0 0;margin-bottom:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.topbar h1{font-size:17px;letter-spacing:.08em;font-weight:700}
.topbar select{font-family:inherit;font-size:14px;padding:6px 10px;border:none;border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
.route-tabs{display:flex;gap:6px;background:var(--ink);padding:0 16px 12px;border-radius:0 0 10px 10px;margin-bottom:14px}
.rtab{flex:1;padding:7px 4px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;transition:all .15s}
.rtab.active{background:#fff;color:var(--ink)}
#loading{text-align:center;padding:50px 0;color:#888;font-size:14px}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid #ccc;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
#error{display:none;text-align:center;padding:40px;color:var(--accent);font-size:14px}
#report{display:none}
.rhdr{background:var(--paper);border:2px solid var(--ink);border-radius:10px 10px 0 0;padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px double var(--ink)}
.rhdr-l h2{font-size:20px;letter-spacing:.12em;color:var(--accent)}
.rhdr-l p{font-size:11px;color:#888;margin-top:3px}
.rhdr-r{text-align:right;font-size:12px;color:#555}
.rhdr-r .dbig{font-size:17px;font-weight:bold;color:var(--ink)}
.ssec{background:var(--paper);border:1px solid var(--rule);border-top:none}
.ssec:last-child{border-radius:0 0 10px 10px}
.shdr{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--light)}
.sname{font-size:14px;font-weight:bold;letter-spacing:.04em}
.sname.yaoko{color:var(--accent)}.sname.choku{color:var(--green)}.sname.others{color:var(--blue)}
.sstaff{font-size:11px;color:#888}
.nodata{padding:10px 14px;font-size:12px;color:#aaa;font-style:italic;border-bottom:1px dashed var(--rule)}
.ts-row{padding:5px 14px;font-size:11px;color:#888;background:#f9f7f2;border-bottom:1px solid var(--rule)}

/* 店頭在庫テーブル */
.inv-wrap{padding:10px 12px 6px}
.inv-table{width:100%;border-collapse:collapse;font-size:13px}
.inv-table th{padding:5px 6px;background:var(--light);font-size:10px;font-weight:700;color:#666;letter-spacing:.06em;text-align:center;border-bottom:2px solid var(--rule)}
.inv-table th:first-child{text-align:left}
.inv-table td{padding:6px 6px;border-bottom:1px dotted #e0d9cc;text-align:center;vertical-align:middle}
.inv-table td:first-child{text-align:left;font-size:12px;color:#555;white-space:nowrap}
.inv-table tr:last-child td{border-bottom:none}
.iv{font-size:15px;font-weight:700}
.iv-chin{color:var(--yellow-lbl)}
.iv-sosei{color:var(--purple)}
.iv-tenpo{color:var(--cyan)}
.iv-zan{color:var(--green)}
.iv-total{background:var(--yellow-bg);font-weight:700;border-top:2px solid var(--yellow-bd)!important}
.iv-sales{font-size:15px;font-weight:700;color:#c0392b}
.iv-extra{background:#fff8e1}
.iv-extra td:first-child{color:#e65100;font-weight:700}
.dsec-hdr.orange{background:#fff3e0;color:#e65100}
.drow.extra{background:#fff8e1}
.drow.extra .dlbl{color:#e65100;font-weight:700}

/* 詳細アコーディオン */
.dtoggle{display:flex;align-items:center;gap:6px;padding:8px 14px;cursor:pointer;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:#f5f3ee;font-size:11px;font-weight:700;color:#777;letter-spacing:.08em;user-select:none}
.dtoggle .tri{display:inline-block;transition:transform .2s;font-size:9px}
.dtoggle.open .tri{transform:rotate(90deg)}
.dbody{display:none}
.dbody.open{display:block}
.dsec-hdr{padding:6px 14px;font-size:10px;font-weight:700;letter-spacing:.08em;border-bottom:1px solid var(--rule)}
.dsec-hdr.green{background:#edf7f1;color:var(--green)}.dsec-hdr.blue{background:#e8f0fb;color:var(--blue)}
.dsec-hdr.brown{background:#f5ede4;color:var(--brown)}.dsec-hdr.purple{background:#f3e5f5;color:var(--purple)}
.dsec-hdr.yellow{background:var(--yellow-bg);color:var(--yellow-lbl)}.dsec-hdr.gray{background:#f5f5f5;color:#666}
.drow{display:flex;align-items:center;padding:6px 14px;border-bottom:1px dotted #e0d9cc;font-size:12px}
.drow:last-child{border-bottom:none}.dlbl{flex:1;color:#666}
.dval{font-size:14px;font-weight:700;min-width:40px;text-align:right;color:var(--ink)}
.dunit{font-size:10px;color:#999;margin-left:3px}
.tokki-txt{font-size:12px;color:#444;padding:7px 14px;font-style:italic;border-bottom:1px dotted #e0d9cc}
.footer{text-align:center;padding:14px;font-size:11px;color:#aaa}
.topbar-l{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.esm-stat{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.04em;line-height:1.3}
.esm-stat.reflected{color:#2ecc71;font-weight:600}
.esm-stat.pending{color:rgba(255,255,255,.5)}
.esm-stat.stale{color:#ffb74d;font-weight:600}
/* 取得失敗（数字は出さない。再取得だけ） */
.fail-btns{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
.fail-btns button{font-family:inherit;font-size:13px;font-weight:700;padding:9px 18px;border-radius:8px;cursor:pointer}
.fail-btns .retry{background:var(--ink);color:#fff;border:none}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-l">
    <h1>🍄 配達日報サマリー</h1>
    <div id="esmStat" class="esm-stat"></div>
    <div id="shownStat" class="esm-stat"></div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
    <a href="index.html" style="font-size:12px;color:rgba(255,255,255,.7);text-decoration:none">← 日報入力に戻る</a>
    <select id="dateSelect" onchange="userPickedDate=true;showReport(this.value)" disabled>
      <option value="">読み込み中...</option>
    </select>
  </div>
</div>
<!-- 経路タブは shared-stores.js の ROUTES から描画する（renderRouteTabs）。
     ラベルをここにベタ書きすると ROUTE_VERSION 切替で不整合になるので禁止。 -->
<div class="route-tabs" id="routeTabs"></div>
<div id="loading"><div class="spinner"></div><br>最新を取得中…</div>
<div id="error">データの取得に失敗しました。<br>しばらく待ってから再度お試しください。</div>
<div id="report"></div>
<div class="footer">栄ガーデン 配達日報システム</div>

<script src="shared-stores.js"></script>
<script>
var API_URL='https://script.google.com/macros/s/AKfycbxGqsjIbO9PDjUpf2EWRD8AkVvYc7V77OJrh7h_PZCqtuV4aUL7NYz83VsNc5lY6sXONw/exec';
// スナップショット配信URL（GCS+CORS+publicRead）。
// summary.json は 4:30 とエスマルシェの反映ごとに snapshot_writer が getAllData から作る。
// 【2026-10-04】先に描く材料にはしない。GAS の応答に販売数だけ取り込む（GAS より大きい＝新しいときだけ。
// 下の _mergeSales）だけ。GAS が取れなければ使わない。
var SNAPSHOT_URL='https://storage.googleapis.com/sakae-garden-snapshots/summary.json';
// スナップショット鮮度上限（超過時は使わない）
var SNAPSHOT_MAX_AGE_MS = 6 * 3600 * 1000;
// /nippo/test/ は本番と同一オリジンで localStorage を共有するため、
// スナップショットURL(/test/)で環境を判定してキーを分ける。本番のキー名は従来のまま。
var IS_TEST_ENV = String(SNAPSHOT_URL).indexOf('/test/') > -1;
function lsKey(base){ return base + (IS_TEST_ENV ? '_test' : ''); }
// 【2026-10-04 廃止】サマリーの数字を端末に残していたキー（summary_cache_v1）。
// 前回の数字を画面に出す手段は設けない（杉さん決定 2026-10-04）ので、端末にも残さない。以前の版が残した値を消す。
try{ localStorage.removeItem(lsKey('summary_cache_v1')); }catch(e){}
var CACHED=null, currentRoute=0, userPickedDate=false;
// 表示中のデータが「いつ時点」か。src: 'gas'（今回取得）。at: 受信時刻(ms)
var SHOWN = { at:0, src:'' };
var esmStatus = null;        // getEsmarcheStatus の最新値
var lastGasOkAt = 0;         // この画面で getAllData が最後に成功した時刻
var gasInFlight = false;     // getAllData 取得中（再検証の重複起動を防ぐ）
var reqSeq = 0, appliedSeq = 0;   // 遅れて届いた古い応答で新しい表示を巻き戻さないための通し番号

// 経路の編成（ラベル・所属・順序）は shared-stores.js の ROUTES を唯一の出典とする。
// ここに経路をベタ書きすると ROUTE_VERSION の 1 行切替で戻せなくなるので禁止。
// 表示データは STORE_DEFS（name/type/prices）から組み立て、summary 固有の
// 見た目（担当者サブラベル・色クラス）だけを下のオーバーライドで足す。
var SUMMARY_SUB = {
  yorii:  '河野さん・竹山さん',
  midori: '杉田さん・川野さん'
};
// summary では たまや/農林公園/道の駅おがわまち を直売所色（緑）で出す。
// STORE_DEFS の cls は 'others'（青）なので、従来の見た目を維持するため上書き。
var SUMMARY_CLS = { tamaya:'choku', nourin:'choku', michieki:'choku' };

function buildRouteGroups(){
  if(typeof ROUTES==='undefined'||typeof STORE_DEFS==='undefined') return [];
  return ROUTES.map(function(r){
    var stores=[];
    r.groups.forEach(function(g){
      g.stores.forEach(function(id){
        var d=STORE_DEFS[id]; if(!d) return;
        stores.push({ name:d.name, cls:(SUMMARY_CLS[id]||d.cls), sub:(SUMMARY_SUB[id]||''),
                      type:d.type, prices:d.prices });
      });
    });
    return { label:r.label, stores:stores };
  });
}
var ROUTE_GROUPS=buildRouteGroups();
var STORES=[]; ROUTE_GROUPS.forEach(function(g){STORES=STORES.concat(g.stores);});

// 経路タブを ROUTES から描画（本数・ラベルとも ROUTE_VERSION に追随する）
function renderRouteTabs(){
  var el=document.getElementById('routeTabs'); if(!el) return;
  var h='';
  for(var i=0;i<ROUTE_GROUPS.length;i++){
    h+='<button class="rtab'+(i===currentRoute?' active':'')+'" id="rtab'+i+'" onclick="switchRoute('+i+')">'
      +String(ROUTE_GROUPS[i].label).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</button>';
  }
  el.innerHTML=h;
}
renderRouteTabs();

var SP=[
  {keys:['納品'],        id:'nouhin',  label:'🟩 納品数',           color:'green'},
  // 【新形式】新日報UI（陳列数を直接入力）のラベル。S/A/B/C品より前に置いて優先マッチ
  {keys:['陳列数'],      id:'chin',    label:'🟦 陳列数',            color:'blue'},
  {keys:['S品','在庫S'], id:'zaikoS',  label:'🟦 S品陳列数（当日）', color:'blue'},
  {keys:['A品','在庫A'], id:'zaikoA',  label:'🟫 A品陳列数（1日前）',color:'brown'},
  {keys:['B品','在庫B'], id:'zaikoB',  label:'🟫 B品陳列数（2日前）',color:'brown'},
  {keys:['C品','在庫C'], id:'zaikoC',  label:'🟫 C品陳列数（3日前）',color:'brown'},
  {keys:['前日在庫'],    id:'zenjitsu',label:'🟫 前日在庫',          color:'brown'},
  {keys:['蘇生庫'],      id:'sosei',   label:'🟪 蘇生庫へ',          color:'purple'},
  {keys:['値引き'],      id:'nebiki',  label:'🟥 値引き',            color:'yellow'},
  {keys:['持ち帰り'],    id:'mochikae',label:'🟧 持ち帰り',          color:'yellow'},
  {keys:['特記事項'],    id:'tokki',   label:'📝 特記事項',          color:'gray'},
];
var YD=['nouhin','zaikoS','zaikoA','zaikoB','zaikoC','sosei','nebiki','mochikae','tokki'];
// 直売所詳細に nebiki を追加：たまやのみ値引きデータを持つため、他直売所では
// secs.nebiki が無く renderAccordion でスキップされる（列構成は変わらない）。
var CD=['nouhin','zenjitsu','nebiki','mochikae','tokki'];
var OD=['nouhin','tokki'];

var cbIdx=0;
// opts.timeoutMs: 見切るまでの時間（既定45秒）。
// opts.lateMs: 見切った後も応答を待ち続ける時間。届いたら opts.onLate(d) を呼ぶ。
//   【2026-09-27】GAS は詰まると L2 ヒットの getAllData でも 51 秒かかる（実測）。
//   従来は 45 秒で見切るとコールバックを消していたので、51 秒目に届いた最新データを捨て、
//   端末の古いキャッシュを出したまま再試行を繰り返していた。JSONP は取り消せないので、
//   見切った後の到着も拾う（haitatsu/index の onLate と同じ考え方）。
function jsonp(url,ok,err,opts){
  opts=opts||{};
  var cb='c'+(cbIdx++),s=document.createElement('script'),timedOut=false,lateT=null;
  var t=setTimeout(function(){
    timedOut=true;
    if(opts.lateMs&&opts.onLate) lateT=setTimeout(cl,opts.lateMs); else cl();
    if(err)err();
  },opts.timeoutMs||45000);
  function cl(){clearTimeout(t);clearTimeout(lateT);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
  window[cb]=function(d){var late=timedOut;cl();if(late){if(opts.onLate)opts.onLate(d);}else ok(d);};
  s.onerror=function(){var late=timedOut;cl();if(!late&&err)err();};
  // _= は途中の HTTP キャッシュに古い応答を返させないため（GAS は未知の引数を無視する）
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb+'&_='+Date.now();
  document.body.appendChild(s);
}

// スナップショット取得（generated_at検証、鮮度確認）
function _fetchSummarySnapshot(cb){
  var url = SNAPSHOT_URL + '?_=' + Date.now();
  fetch(url, { cache:'no-store' }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(j){
    if(!j || !j.generated_at || !j.allData || !j.availableDates){ cb(null); return; }
    var gen = Date.parse(j.generated_at);
    if(isNaN(gen)){ cb(null); return; }
    if(Date.now() - gen > SNAPSHOT_MAX_AGE_MS){
      // 古すぎる → 使わない（誤認防止）
      cb(null, { tooOld:true, generated_at:j.generated_at });
      return;
    }
    j._genAt = gen;
    cb(j);
  }).catch(function(){ cb(null); });
}

// 販売数（エスマルシェ由来）だけを、別の出どころ other から base へ取り込む。
// ・販売数は1日の中で減らないので、同じ日・同じ店舗・同じラベルは大きい方を採る
// ・納品数・陳列数など自社入力は base（GAS）を正とし、触らない
// ・base に無い店舗（エスマルシェだけが当日行を作った店）は other のエントリをそのまま足す
// base を直接書き換えて返す。
function _mergeSales(base, other){
  if(!base || !base.allData || !other || !other.allData) return base;
  (base.availableDates||[]).forEach(function(d){
    var od = other.allData[d]; if(!od) return;
    var bd = base.allData[d] || (base.allData[d] = {});
    Object.keys(od).forEach(function(sn){
      var oe = od[sn]; if(!oe || !oe.items) return;
      var be = bd[sn];
      if(!be || !be.items){ bd[sn] = oe; return; }
      oe.items.forEach(function(oit){
        if(String(oit.label).indexOf('販売数_') !== 0) return;
        var ov = parseInt(oit.value, 10); if(isNaN(ov)) return;
        for(var i=0;i<be.items.length;i++){
          if(be.items[i].label === oit.label){
            var bv = parseInt(be.items[i].value, 10);
            if(isNaN(bv) || ov > bv) be.items[i] = { label: oit.label, value: String(ov) };
            return;
          }
        }
        be.items.push({ label: oit.label, value: String(ov) });
      });
    });
  });
  return base;
}

// "9/27 13:05" / 当日なら "13:05"
function fmtAt(ms){
  if(!ms) return '―';
  var d = new Date(ms), hm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  var isToday = (d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')) === fmtTodayLocal();
  return isToday ? hm : (d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
function switchRoute(i){
  currentRoute=i;
  for(var j=0;j<ROUTE_GROUPS.length;j++){ var t=document.getElementById('rtab'+j); if(t) t.classList.toggle('active',j===i); }
  var d=document.getElementById('dateSelect').value;
  if(d) showReport(d);
}

// ──── 日付の選択肢 ────
// 【2026-09-27】従来は選択肢を availableDates（＝どこかの店のシートにその日付の行がある日）だけで作っていた。
// 当日は、日報の送信もエスマルシェの取り込みもまだ無い間（日曜昼などに実際に発生）、
// また GAS が詰まって端末の前日までのキャッシュを出している間、選択肢そのものが無かった。
// 選択肢は暦（今日から DATE_WINDOW_DAYS 日さかのぼる）で作り、データの有無は表示の側で出す。
var DATE_WINDOW_DAYS = 14;   // GAS の RECENT_DAYS と同じ
var WDAYS = ['日','月','火','水','木','金','土'];
function _ymd(dt){
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function _dateOptions(availableDates){
  var seen={}, out=[], base=new Date();
  base.setHours(12,0,0,0);
  for(var i=0;i<DATE_WINDOW_DAYS;i++){
    var s=_ymd(new Date(base.getFullYear(), base.getMonth(), base.getDate()-i, 12));
    seen[s]=1; out.push(s);
  }
  (availableDates||[]).forEach(function(s){ if(s && !seen[s]){ seen[s]=1; out.push(s); } });
  return out.sort().reverse();
}
// その日に1店舗でも品目があるか
function _hasDayData(dayData){
  if(!dayData) return false;
  return Object.keys(dayData).some(function(k){ var s=dayData[k]; return s && s.items && s.items.length; });
}
function _dateLabel(d){
  var p=d.split('-');
  return p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日（'+WDAYS[new Date(d+'T00:00:00').getDay()]+'）';
}
function pickDate(d){
  var sel=document.getElementById('dateSelect');
  userPickedDate=true; sel.value=d; showReport(d);
}

// 差替時に既選択の日付を維持するSWR対応版。
// preserveDate: 明示指定があればそれを優先。無ければ現在のselect値を維持。
// どちらも存在しなければ availableDates[0] にフォールバック。
function _applyAllData(data, preserveDate){
  CACHED = data.allData||{};
  document.getElementById('loading').style.display='none';
  var sel=document.getElementById('dateSelect');
  // ユーザーが手動で日付を選んだ時のみ選択を維持。未選択(自動)なら最新日(=当日があれば当日)を選ぶ。
  // 朝の初回描画で前日を自動選択後、getAllDataが当日を返したら当日へ更新される（日報→即反映）。
  var wantSel = userPickedDate ? (preserveDate || sel.value || '') : '';
  var today = fmtTodayLocal();
  var opts = _dateOptions(data.availableDates);
  sel.innerHTML='<option value="">-- 日付を選択 --</option>';
  sel.disabled=false;
  opts.forEach(function(d){
    var o=document.createElement('option');
    o.value=d;
    o.textContent=_dateLabel(d)+(d===today?' 今日':'')+(_hasDayData(CACHED[d])?'':'・データなし');
    sel.appendChild(o);
  });
  // 選択維持ロジック：手動で選んだ日はそのまま。自動なら最新のデータのある日（当日があれば当日）。
  // 当日にまだデータが無いときに前日を出す場合は、render が「今日はまだ無い」と画面に出す。
  var latest = (data.availableDates||[]).filter(function(d){ return _hasDayData(CACHED[d]); })[0];
  var target = (wantSel && opts.indexOf(wantSel) >= 0) ? wantSel : (latest || today);
  sel.value = target;
  showReport(target);
}

function fmtTodayLocal(){
  var n=new Date();
  return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}
function handleEsmarcheStatus(d){
  if(d && !d.error) esmStatus = d;
  renderEsmStat();
}
// 上段の2行：①エスマルシェの反映状況 ②この画面のデータがいつ時点か。
// 【2026-09-27】従来は getEsmarcheStatus だけで「◯時 売上反映済み」（緑）を出していた。
// getAllData が詰まって端末の古いキャッシュを出している間も緑のままで、
// 「最新が出ている」と誤解させた。反映の記録時刻(ts)が表示中データより新しければ
// 「この画面は未反映」と出し分ける。
function renderEsmStat(){
  var el=document.getElementById('esmStat');
  if(el){
    var d=esmStatus;
    if(!d){ el.textContent=''; }
    else if(d.date===fmtTodayLocal() && d.updateTime){
      var refAt = d.ts ? Date.parse(d.ts) : NaN;
      if(!isNaN(refAt) && SHOWN.at && SHOWN.at < refAt){
        el.className='esm-stat stale';
        el.textContent='🛒 ヤオコー '+d.updateTime+' 売上：この画面は未反映';
      } else {
        el.className='esm-stat reflected';
        el.textContent='🛒 ヤオコー '+d.updateTime+' 売上反映済み';
      }
    } else {
      el.className='esm-stat pending';
      el.textContent='🛒 ヤオコー売上 未反映';
    }
  }
  var sh=document.getElementById('shownStat');
  if(sh){
    if(!SHOWN.at){ sh.textContent=''; }
    else { sh.className='esm-stat'; sh.textContent='🕐 '+fmtAt(SHOWN.at)+' に取得'; }
  }
}
// ──── 最新だけを表示する（2026-10-04 杉さん要望）────
// 従来は 端末に残した値（localStorage）→ スナップショット → GAS の順に描き、開いた直後に古い数字が出て
// 2〜3秒後に最新へ切り替わっていた。最終更新の表示を見て古い数字を正しいと思い込むミスにつながる。
//   ・起動時・復帰時（前回の取得から60秒以上）は数字を出さず「最新を取得中…」。GAS の応答で確定してから描く
//   ・スナップショットは GAS の応答に販売数だけ取り込む（販売数は1日の中で減らないので、大きい方＝新しい方）。
//     GAS より先に届いても描かない。GAS が先に届いたら、スナップショットを最大 SNAP_WAIT_MS だけ待つ
//     （待たないと、販売数だけ後から書き換わる2段階の表示になる）
//   ・取得できなければ数字なしで「最新を取得できませんでした」＋再取得。裏で自動の再取得を続ける。
//     前回の数字を見る手段は設けない（杉さん決定 2026-10-04 09:54）。サマリーの数字は端末にも残さない
var LATEST_ONLY_BUILD = 'latest-only-20261004';   // 本番反映の確認用マーカー
var VIEW = 'loading';   // 'loading' 取得中 / 'fresh' 最新 / 'failed' 取得失敗（数字なし）
// ──── GAS取得ドライバ（初回・リトライ・自動再取得・手動再取得の共通経路）────
// GASは混雑時に404/タイムアウトを返すことがある（収集バッチ併走時に実測）。
// 1回の失敗で失敗の画面を出し（数字は出さない）、裏で5秒後→15秒後→以後60秒ごとに試し続ける。
// 成功した時点で最新を描くので、放置していても復旧する。
var RETRY_DELAYS  = [5000, 15000];  // 初回失敗→5秒後→15秒後（計3回）
var AUTO_RETRY_MS = 60000;          // 失敗表示中の自動再取得間隔
// 1本あたりの見切り時間と、並走の2本目を出すまでの時間（日報の納品指示〔件2〕と同じ 10秒・4秒）。
// 通常は約3秒で返る（2026-09-27 実測 2.7〜3.2秒）。遅れの多くは転送層の裾なので、待つより並べるほうが早い。
// 見切った後も GAS_LATE_MS の間は遅れて届いた応答を採用する（詰まると51秒かかった実測がある）。
var GAS_TIMEOUT_MS = 10000;
var GAS_HEDGE_MS   = 4000;
var GAS_LATE_MS    = 90000;
var SNAP_WAIT_MS   = 500;           // GAS が先に届いたとき、スナップショットを待つ上限
var snapLatest    = null;           // この画面で取得できた summary.json（販売数の取り込み元）
var snapPending   = false;          // summary.json を取得中
var _gasHold = null, _gasHoldT = null;   // スナップショット待ちの GAS 応答
var lastAttemptAt = 0;              // getAllData を最後に投げた時刻
var autoRetryTimer = null;
var _keepDate = '';                 // 取り直しの間も、手で選んだ日付を覚えておく

function _startAutoRetry(){
  if(autoRetryTimer) return;
  autoRetryTimer = setInterval(function(){
    _fetchAllDataFromGas(RETRY_DELAYS.length, true);   // 1回だけ静かに試す
  }, AUTO_RETRY_MS);
}
function _stopAutoRetry(){
  if(autoRetryTimer){ clearInterval(autoRetryTimer); autoRetryTimer = null; }
}

// 表示の差し替え（出どころ共通）。src/at は上段の「いつ時点か」表示に使う。
function _showData(data, src, at){
  // ユーザーが手動で日付を選んだ時のみ選択を維持。未選択(自動)なら最新日(=当日があれば当日)を表示。
  // これにより、朝の初回描画で前日を自動選択後に getAllData が当日を返したら当日へ更新される
  // （日報送信→即・当日反映。エスマルシェ収集とは独立）。
  var prevSel = userPickedDate ? (document.getElementById('dateSelect').value || _keepDate) : null;
  SHOWN = { at: at, src: src };
  _applyAllData(data, prevSel);
  renderEsmStat();
}

// 数字を消して「最新を取得中…」にし、取り直す（起動時・復帰時）。
function _beginLoad(){
  VIEW = 'loading';
  var sel = document.getElementById('dateSelect');
  if(userPickedDate && sel.value) _keepDate = sel.value;
  CACHED = null; SHOWN = { at:0, src:'' };
  _gasHold = null; clearTimeout(_gasHoldT);
  appliedSeq = reqSeq + 1;   // 取り直しの前に投げた要求の応答は使わない（背面に回る前の内容のため）
  fetchGen++; _stopAutoRetry();   // 前の取得の失敗・自動の取り直しも出さない
  var rp = document.getElementById('report'); rp.innerHTML = ''; rp.style.display = 'none';
  document.getElementById('error').style.display = 'none';
  var ld = document.getElementById('loading');
  ld.innerHTML = '<div class="spinner"></div><br>最新を取得中…'; ld.style.display = 'block';
  sel.innerHTML = '<option value="">最新を取得中…</option>'; sel.disabled = true;
  esmStatus = null; renderEsmStat();
  jsonp(API_URL+'?action=getEsmarcheStatus',handleEsmarcheStatus,function(){});
  _loadSnapshot();
  _fetchAllDataFromGas(0, false);
}

// GAS の応答を受け取る。形が正しければ true（＝この取得は成功）。
// seq: この応答を投げた通し番号。後から投げた要求の応答がすでに出ていれば捨てる
// （遅れて届いた古い応答で表示を巻き戻さない）。
function applyFromGas(data, seq){
  if(!data || data.error || !data.availableDates || !data.allData) return false;
  if(seq < appliedSeq) return true;
  appliedSeq = seq;
  lastGasOkAt = Date.now();
  _stopAutoRetry();
  if(snapPending){
    // スナップショットがまだ届いていない。販売数を取り込んでから1回で描くために少しだけ待つ
    _gasHold = data; clearTimeout(_gasHoldT);
    _gasHoldT = setTimeout(_releaseGasHold, SNAP_WAIT_MS);
    return true;
  }
  _commitGas(data);
  return true;
}
function _releaseGasHold(){
  clearTimeout(_gasHoldT);
  var d = _gasHold; _gasHold = null;
  if(d) _commitGas(d);
}
function _commitGas(data){
  // 販売数だけはスナップショットと大きい方を採る（自社入力は GAS が正）。
  if(snapLatest) _mergeSales(data, snapLatest);
  VIEW = 'fresh';
  document.getElementById('error').style.display = 'none';
  _showData(data, 'gas', lastGasOkAt);
}

// attempt: 0=初回。RETRY_DELAYS.length に達したら打ち切り（=60秒ごとの自動再取得へ移行）。
// silent=true: 自動／手動の再取得（表示中の失敗の画面はそのまま）。
// 【2026-10-04】4秒で応答が無ければ同じ要求をもう1本出し、先に返ったほうを使う。両方だめなら失敗。
// 【2026-10-04 失敗画面を減らす】1本目がすぐエラー（404・5xx・通信エラー・形の違う応答）で返ったら、
// 失敗を確定せずに4秒を待たずに2本目を出す（1回の試行で最大2本）。復帰・回線切替で捨てた試行（gen が古い）は失敗を出さない。
var fetchGen = 0;
function _fetchAllDataFromGas(attempt, silent){
  var seq = ++reqSeq, gen = fetchGen;
  lastAttemptAt = Date.now();
  var won = false, done = false, inflight = 0, fired = 0, hedgeT = null;
  function take(d){
    if(won) return true;
    if(applyFromGas(d, seq)){ won = true; done = true; clearTimeout(hedgeT); return true; }
    return false;
  }
  function failOne(){
    if(done || gen !== fetchGen) return;
    if(fired < 2){ clearTimeout(hedgeT); hedgeT = null; fire(); return; }   // すぐエラーなら2本目
    if(inflight > 0) return;   // もう1本がまだ返っていない
    done = true; clearTimeout(hedgeT); hedgeT = null;
    onFail();
  }
  function fire(){
    fired++;
    inflight++;
    jsonp(API_URL+'?action=getAllData',
      function(d){ inflight--; if(!take(d)) failOne(); },
      function(){ inflight--; failOne(); },
      { timeoutMs: GAS_TIMEOUT_MS, lateMs: GAS_LATE_MS,
        onLate: function(d){ take(d); } });
  }
  function onFail(){
    if(lastGasOkAt > lastAttemptAt) return;   // 別の要求（遅れて届いた分を含む）がすでに成功
    _showFailed();
    if(attempt < RETRY_DELAYS.length){
      var at = Date.now();
      setTimeout(function(){
        if(lastGasOkAt > at || gen !== fetchGen) return;   // 待っている間に遅れて届いた応答で成功済み・復帰で取り直し済み
        _fetchAllDataFromGas(attempt+1, true);
      }, RETRY_DELAYS[attempt]);
      return;
    }
    _startAutoRetry();
  }
  fire();
  hedgeT = setTimeout(function(){ hedgeT = null; if(!done && gen === fetchGen && fired < 2) fire(); }, GAS_HEDGE_MS);
}

// 取得失敗の表示。数字は出さず、再取得だけを置く（前回の数字を見る手段は設けない）。
function _showFailed(){
  if(VIEW === 'fresh') return;   // 表示中の最新はそのまま（ここには来ない想定）
  VIEW = 'failed';
  CACHED = null; SHOWN = { at:0, src:'' }; renderEsmStat();
  document.getElementById('loading').style.display = 'none';
  var rp = document.getElementById('report'); rp.innerHTML = ''; rp.style.display = 'none';
  var sel = document.getElementById('dateSelect');
  sel.innerHTML = '<option value="">取得できませんでした</option>'; sel.disabled = true;
  var el = document.getElementById('error');
  el.innerHTML = '⚠️ 最新を取得できませんでした<br><small>自動で再取得を続けています</small>'
    + '<div class="fail-btns"><button class="retry" id="retryBtn" onclick="retryNow()">🔄 再取得</button>'
    + '</div>';
  el.style.display = 'block';
}
function retryNow(){
  var b = document.getElementById('retryBtn');
  if(b){ b.disabled = true; b.textContent = '取得中…'; }
  if(!snapLatest && !snapPending) _loadSnapshot();
  _fetchAllDataFromGas(RETRY_DELAYS.length, true);
}

// summary.json（GCS）を取りに行く。描く材料にはしない（上の方針）。
// GAS がすでに出ていれば販売数だけ取り込み、GAS がスナップショット待ちならここで描く。
function _loadSnapshot(){
  snapPending = true;
  _fetchSummarySnapshot(function(j){
    snapPending = false;
    if(j) snapLatest = j;
    if(_gasHold){ _releaseGasHold(); return; }
    if(!j || VIEW !== 'fresh') return;
    _mergeSales({availableDates:Object.keys(CACHED||{}), allData:CACHED}, j);
    var d=document.getElementById('dateSelect').value;
    if(d && CACHED && CACHED[d]) render(d, CACHED[d]);
  });
}

// 画面に戻ってきたとき（タブ切替・アプリ切替・戻る）。
// 【2026-09-27】従来は onload の1回だけで、開いたまま裏に回したサマリーに戻ると取り直さなかった。
// 【2026-10-04】前回の取得から60秒以上たっていれば、数字を消して取り直す（古い表示のまま待たせない）。
var REVALIDATE_MIN_MS = 60000;   // 直近60秒以内に取得成功していれば取り直さない
// 【2026-10-04 失敗画面を減らす】取得中・失敗の表示中は、始めてから4秒以上たった取得を捨てて出し直す
// （スリープ中・回線切替で宙に浮いた要求を待ち続けない。日報の納品指示と同じ）。回線が戻ったとき（online）も同じ。
function _revalidate(){
  var now = Date.now();
  if(VIEW === 'fresh'){
    if(now - lastGasOkAt < REVALIDATE_MIN_MS) return;
    _beginLoad();
    return;
  }
  // 取得中・失敗の表示中：始めて4秒未満の取得はそのまま待つ。それ以外は捨てて出し直す（届けば最新を描く）
  if(lastAttemptAt > lastGasOkAt && now - lastAttemptAt < GAS_HEDGE_MS) return;
  fetchGen++;
  appliedSeq = reqSeq + 1;   // それまでに投げた要求の応答は使わない（背面に回る前の内容のため）
  _stopAutoRetry();
  if(VIEW === 'failed') jsonp(API_URL+'?action=getEsmarcheStatus',handleEsmarcheStatus,function(){});
  _fetchAllDataFromGas(0, VIEW === 'failed');
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') _revalidate();
});
window.addEventListener('pageshow', function(e){ if(e.persisted) _revalidate(); });
window.addEventListener('online', function(){ _revalidate(); });

window.onload=function(){
  // 端末に残した値もスナップショットも先に描かない。GAS(getAllData)の応答で確定してから描く（上の方針）。
  _beginLoad();
};

function showReport(date){
  if(!date||!CACHED) return;
  document.getElementById('error').style.display='none';
  if(CACHED[date]) { render(date, CACHED[date]); return; }
  // 手元に無い日（まだデータの無い当日・直近14日外）: getDayData でシートから個別取得（GAS側で5分キャッシュ）。
  // 取得中・失敗時は前の日の表示を残さない。
  document.getElementById('report').innerHTML='';
  document.getElementById('loading').innerHTML='<div class="spinner"></div><br>'+_dateLabel(date)+' のデータを取得中...';
  document.getElementById('loading').style.display='block';
  function stillShown(){ return document.getElementById('dateSelect').value===date; }
  jsonp(API_URL+'?action=getDayData&date='+encodeURIComponent(date),
    function(d){
      var stores=(d&&!d.error&&d.stores)||null;
      if(stores && CACHED && !CACHED[date]) CACHED[date]=stores;
      if(!stillShown()) return;   // 待っている間に別の日へ切り替えた
      document.getElementById('loading').style.display='none';
      if(!stores){
        document.getElementById('error').innerHTML=_dateLabel(date)+' のデータの取得に失敗しました。';
        document.getElementById('error').style.display='block';
        return;
      }
      render(date, stores);
    },
    function(){
      if(!stillShown()) return;
      document.getElementById('loading').style.display='none';
      document.getElementById('error').innerHTML=_dateLabel(date)+' のデータの取得に失敗しました。';
      document.getElementById('error').style.display='block';
    }
  );
}

function parseSecs(sd){
  var secs={};
  sd.items.forEach(function(it){
    for(var i=0;i<SP.length;i++){
      var pat=SP[i];
      if(pat.keys.some(function(k){return it.label.indexOf(k)>-1;})){
        if(!secs[pat.id]) secs[pat.id]={label:pat.label,color:pat.color,id:pat.id,items:[]};
        secs[pat.id].items.push(it);break;
      }
    }
  });
  return secs;
}

function getRaw(sec,price){
  // 通常価格: 「臨#」を含む臨時行を除外して、価格を含むラベルを合算
  if(!sec) return 0;
  var t=0;sec.items.forEach(function(it){
    if(it.label.indexOf('臨#')>-1) return;
    if(it.label.indexOf(price)>-1) t+=parseInt(it.value)||0;
  });
  return t;
}

function getRawExtra(sec,price){
  // 追加商品（内部識別子: 臨#）: ラベルに「_臨#¥158」を含むものを合算
  if(!sec) return 0;
  var needle='_臨#'+price;
  var t=0;sec.items.forEach(function(it){
    if(it.label.indexOf(needle)>-1) t+=parseInt(it.value)||0;
  });
  return t;
}

function extractExtraPrices(items){
  if(!items) return [];
  var seen={}, out=[];
  items.forEach(function(it){
    var m=String(it.label||'').match(/_臨#(¥\d+)/);
    if(m && !seen[m[1]]){seen[m[1]]=1;out.push(m[1]);}
  });
  out.sort(function(a,b){return parseInt(a.replace('¥',''),10)-parseInt(b.replace('¥',''),10);});
  return out;
}

function getChin(secs,prices,isYaoko){
  var r={};
  prices.forEach(function(p){
    if(!isYaoko){
      r[p] = getRaw(secs.nouhin,p) + getRaw(secs.zenjitsu,p);
      return;
    }
    // 新形式（陳列数_¥XX）があればそれを使い、無ければ旧S+A+B+C品合算にfallback
    var newVal = getRaw(secs.chin, p);
    r[p] = newVal > 0
      ? newVal
      : (getRaw(secs.zaikoS,p)+getRaw(secs.zaikoA,p)+getRaw(secs.zaikoB,p)+getRaw(secs.zaikoC,p));
  });
  return r;
}
// 追加商品（1価格分）の陳列数：新形式優先・旧形式fallback
function getChinExtra(secs, price){
  var newVal = getRawExtra(secs.chin, price);
  if(newVal > 0) return newVal;
  return getRawExtra(secs.zaikoS,price)+getRawExtra(secs.zaikoA,price)+getRawExtra(secs.zaikoB,price)+getRawExtra(secs.zaikoC,price);
}

function eId(s){return String(s).split('').map(function(c){var cc=c.charCodeAt(0);return (cc<128&&/[a-zA-Z0-9]/.test(c))?c:'x'+cc.toString(16);}).join('');}
function eA(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function eH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(date,dayData){
  var p=date.split('-'),days=['日','月','火','水','木','金','土'];
  var ds=p[0]+'年'+parseInt(p[1])+'月'+parseInt(p[2])+'日（'+days[new Date(date+'T00:00:00').getDay()]+'）';
  // shared-stores.js が読めないと経路が組み立たない。無言で白画面にせず明示する。
  if(!ROUTE_GROUPS[currentRoute]){
    document.getElementById('report').innerHTML='<div class="nodata">店舗定義(shared-stores.js)が読み込めません。再読み込みしてください。</div>';
    document.getElementById('report').style.display='block';
    return;
  }
  var rs=ROUTE_GROUPS[currentRoute].stores,staff='';
  rs.forEach(function(s){if(!staff&&dayData[s.name]&&dayData[s.name].担当者)staff=dayData[s.name].担当者;});

  var html='<div class="rhdr"><div class="rhdr-l"><h2>配 達 日 報</h2><p>'+ROUTE_GROUPS[currentRoute].label+'</p></div>';
  html+='<div class="rhdr-r"><div class="dbig">'+ds+'</div><div>担当：'+(staff||'―')+'</div></div></div>';

  // データの無い日・当日の代わりに前の日を自動で出しているときは、黙らずに画面に出す
  var today=fmtTodayLocal(), note='';
  if(!_hasDayData(dayData)){
    note='📭 '+ds+' のデータはまだありません（日報の送信・ヤオコー販売数の取り込みがまだ）';
  } else if(date<today && !userPickedDate && !_hasDayData(CACHED&&CACHED[today])){
    note='📭 今日（'+_dateLabel(today)+'）の分はまだこの画面に届いていません。表示は '+ds+' です。'
        +' <button onclick="pickDate(\''+today+'\')" style="margin-left:6px;padding:3px 10px;font-size:12px;font-weight:600;color:#e65100;background:#fff;border:1px solid #ffb74d;border-radius:6px;cursor:pointer">今日を開く</button>';
  }
  if(note) html+='<div id="dayNote" style="background:#fff3e0;color:#e65100;border:1px solid #ffb74d;border-radius:8px;padding:6px 10px;margin:8px 0;font-size:13px;font-weight:600;text-align:center">'+note+'</div>';

  rs.forEach(function(store){
    html+='<div class="ssec"><div class="shdr"><span class="sname '+store.cls+'">■ '+store.name+'</span>';
    if(store.sub) html+='<span class="sstaff">'+store.sub+'</span>';
    html+='</div>';
    var sd=dayData[store.name];
    if(!sd||!sd.items||!sd.items.length){html+='<div class="nodata">本日訪問なし / データなし</div></div>';return;}
    if(sd.timestamp) html+='<div class="ts-row">🕐 最終更新：'+sd.timestamp+'</div>';

    var isY=store.type==='yaoko', isC=store.type==='choku', isO=store.type==='oroshi';
    var secs=parseSecs(sd);

    if(isO){
      html+=renderOroshi(store,secs);
    } else {
      html+=renderInvTable(store,secs,isY,sd.items);
      html+=renderAccordion(store,secs,isY);
    }
    html+='</div>';
  });

  document.getElementById('report').innerHTML=html;
  document.getElementById('report').style.display='block';
}

function renderInvTable(store,secs,isY,items){
  var prices=store.prices,sn=store.name;
  var chin=getChin(secs,prices,isY);
  var tc=0,ts=0,tt=0,totalZan=0,totalSales=0,hasAnySales=false;

  // 価格列は常に表示
  var showPrice=true;

  // 追加商品はヤオコー・直売所の両方に対応
  var extraPrices = extractExtraPrices(items);

  var html='<div class="inv-wrap"><table class="inv-table"><thead><tr>';
  if(showPrice) html+='<th>価格</th>';
  html+=isY?'<th>陳列数</th>':'<th>納品数</th>';
  if(isY) html+='<th>蘇生庫</th>';
  html+='<th>店頭在庫</th><th>販売数</th><th>残在庫</th></tr></thead><tbody>';

  prices.forEach(function(p){
    // yaoko: 1列目=陳列数(新形式優先・旧S+A+B+C fallback) / choku: 1列目=納品数のみ
    var c=isY?(chin[p]||0):(getRaw(secs.nouhin,p)||0);
    var sv=isY?(getRaw(secs.sosei,p)||0):0;
    // 店頭在庫: yaoko=陳列数+蘇生庫+値引き / choku=納品+前日在庫
    var tenpo=isY?(c+sv+(getRaw(secs.nebiki,p)||0)):(chin[p]||0);
    tc+=c;ts+=sv;tt+=tenpo;

    // items から「販売数_¥99」等のラベルを直接検索
    var salesVal='';
    if(items){
      items.forEach(function(it){
        if(it.label==='販売数_'+p && it.value!=='' && it.value!==null && it.value!==undefined){
          salesVal=String(it.value);
        }
      });
    }

    var zan=salesVal!==''?Math.max(tenpo-(parseInt(salesVal)||0),0):'';
    if(salesVal!==''){hasAnySales=true;totalZan+=zan;totalSales+=parseInt(salesVal)||0;}
    else totalZan+=tenpo;

    html+='<tr>';
    if(showPrice) html+='<td>'+eH(p)+'</td>';
    html+='<td><span class="iv iv-chin">'+c+'</span></td>';
    if(isY) html+='<td><span class="iv iv-sosei">'+sv+'</span></td>';
    html+='<td><span class="iv iv-tenpo">'+tenpo+'</span></td>';
    html+='<td><span class="iv iv-sales">'+eH(salesVal!==''?salesVal:'-')+'</span></td>';
    html+='<td><span class="iv iv-zan">'+(zan===''?'-':zan)+'</span></td></tr>';
  });

  // 追加商品行（ヤオコー・直売所の両方に対応）
  extraPrices.forEach(function(p){
    var c, sv=0, nb=0, tenpo;
    if(isY){
      // ヤオコー: 陳列(新形式優先・旧S+A+B+C fallback) + 蘇生 + 値引き
      c = getChinExtra(secs, p);
      sv = getRawExtra(secs.sosei, p);
      nb = getRawExtra(secs.nebiki, p);
      tenpo = c + sv + nb;
    } else {
      // 直売所: 納品数 + 前日在庫 = 店頭在庫
      c = getRawExtra(secs.nouhin, p);
      tenpo = c + getRawExtra(secs.zenjitsu, p);
    }
    tc+=c; ts+=sv; tt+=tenpo;

    var salesVal='';
    if(items){
      items.forEach(function(it){
        if(it.label==='販売数_臨#'+p && it.value!==''&&it.value!==null&&it.value!==undefined){
          salesVal=String(it.value);
        }
      });
    }
    // 【臨時価格0件表示修正】この行が描画される＝extraPricesにこの価格が含まれる
    // ＝店舗が臨時価格を扱っている確定（extractExtraPricesがitems内の_臨#¥XXXから抽出）。
    // esmarche側は0件時に販売数_臨#¥XXX列を作らない仕様なので、ラベル欠落は
    // 「0件」として扱う（そもそも使っていない店舗はこの行に来ない）。
    if(salesVal==='') salesVal='0';
    var zan = Math.max(tenpo-(parseInt(salesVal)||0),0);
    hasAnySales=true; totalZan+=zan; totalSales+=parseInt(salesVal)||0;

    html+='<tr class="iv-extra">';
    if(showPrice) html+='<td>➕'+eH(p)+'</td>';
    html+='<td><span class="iv iv-chin">'+c+'</span></td>';
    if(isY) html+='<td><span class="iv iv-sosei">'+sv+'</span></td>';
    html+='<td><span class="iv iv-tenpo">'+tenpo+'</span></td>';
    html+='<td><span class="iv iv-sales">'+eH(salesVal)+'</span></td>';
    html+='<td><span class="iv iv-zan">'+zan+'</span></td></tr>';
  });

  // 合計行
  html+='<tr class="iv-total">';
  if(showPrice) html+='<td>合計</td>';
  html+='<td><span class="iv iv-chin">'+tc+'</span></td>';
  if(isY) html+='<td><span class="iv iv-sosei">'+ts+'</span></td>';
  html+='<td><span class="iv iv-tenpo">'+tt+'</span></td>';
  html+='<td><span class="iv iv-sales">'+(hasAnySales?String(totalSales):'-')+'</span></td>';
  html+='<td><span class="iv iv-zan">'+(hasAnySales?String(totalZan):'-')+'</span></td></tr>';

  html+='</tbody></table></div>';
  return html;
}


function renderAccordion(store,secs,isY){
  var detail=isY?YD:CD;
  var id=eId(store.name);
  var html='<div class="dtoggle" id="dt_'+id+'" onclick="togD(\''+id+'\')"><span class="tri">▶</span>詳細データ</div>';
  html+='<div class="dbody" id="db_'+id+'">';
  detail.forEach(function(did){
    if(!secs[did]) return;
    var sec=secs[did];
    html+='<div><div class="dsec-hdr '+sec.color+'">'+sec.label+'</div>';
    if(did==='tokki'){
      sec.items.forEach(function(it){html+='<div class="tokki-txt">'+eH(it.value||'―')+'</div>';});
    } else {
      sec.items.forEach(function(it){
        var lbl=it.label.replace(/納品\s?/,'').replace(/[SABC]品\s?/,'').replace(/在庫[SABC]\s?/,'')
          .replace(/前日在庫\s?/,'').replace(/蘇生庫\s?/,'').replace(/値引き\s?/,'')
          .replace(/持ち帰り\s?/,'').replace('（個）','').replace(/^_/,'');
        var isExtra = lbl.indexOf('臨#')>-1;
        lbl = lbl.replace(/^臨#/,'➕').replace(/_臨#/,'_➕');
        html+='<div class="drow'+(isExtra?' extra':'')+'"><span class="dlbl">'+eH(lbl)+'</span><span class="dval">'+eH(it.value)+'</span><span class="dunit">個</span></div>';
      });
    }
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function togD(id){
  var t=document.getElementById('dt_'+id),b=document.getElementById('db_'+id);
  if(!t||!b) return;
  var o=b.classList.contains('open');
  b.classList.toggle('open',!o);t.classList.toggle('open',!o);
}

function renderOroshi(store,secs){
  var html='<div>';
  OD.forEach(function(did){
    if(!secs[did]) return;
    var sec=secs[did];
    html+='<div><div class="dsec-hdr '+sec.color+'">'+sec.label+'</div>';
    if(did==='tokki'){
      sec.items.forEach(function(it){html+='<div class="tokki-txt">'+eH(it.value||'―')+'</div>';});
    } else {
      sec.items.forEach(function(it){
        var lbl=it.label.replace(/納品\s?/,'').replace('（個）','').replace(/^_/,'');
        var unit=(store.units&&store.units[lbl])?store.units[lbl]:'個';
        html+='<div class="drow"><span class="dlbl">'+eH(lbl)+'</span><span class="dval">'+eH(it.value)+'</span><span class="dunit">'+unit+'</span></div>';
      });
    }
    html+='</div>';
  });
  html+='</div>';
  return html;
}
