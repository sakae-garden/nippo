<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>【TEST】配達商品情報 | 栄ガーデン</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root{
  --ink:#1c1c1e; --paper:#fdfbf7; --bg:#f5f1e8; --card:#fff; --border:#e8e2d5;
  --sub:#777; --green:#2d7a4f; --green-bg:#edf7f1; --yellow:#f9a825; --yellow-bg:#fffde7;
  --blue:#1976d2; --blue-bg:#e3f2fd; --orange:#e65100;
  --r:14px; --shadow:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);padding-bottom:60px}
.hdr{background:var(--ink);color:#fff;padding:14px 16px 0;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hdr-top h1{font-size:17px;letter-spacing:.06em;font-weight:700}
.mode-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:6px 14px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
.mode-btn.edit{background:#fff;color:var(--ink);border-color:#fff}
.hdr-date{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:10px;letter-spacing:.02em}
.route-tabs{display:flex;gap:6px;padding-bottom:12px}
.rtab{flex:1;padding:8px 4px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:8px;transition:all .15s}
.rtab.active{background:#fff;color:var(--ink)}
#app{padding:16px}
.mode-banner{font-size:12px;text-align:center;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-weight:600;letter-spacing:.04em}
.mode-banner.view{background:#f0f4f8;color:#37474f;border:1px dashed #b0bec5}
.mode-banner.edit{background:#fff8e1;color:#e65100;border:1px solid #ffb74d}

/* ルート合計 */
.route-total{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.route-total-ttl{font-size:11px;color:var(--sub);letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.route-total-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.route-total-cell{text-align:center;background:var(--green-bg);border-radius:8px;padding:8px 4px}
.route-total-cell .rt-p{font-size:11px;color:var(--green);font-weight:600;margin-bottom:2px}
.route-total-cell .rt-v{font-size:18px;color:var(--green);font-weight:700;font-family:'Inter','Noto Sans JP',sans-serif}
.route-total-cell .rt-u{font-size:10px;color:#999;margin-left:2px}

/* グループラベル */
.sec-lbl{font-size:11px;color:var(--sub);letter-spacing:.12em;font-weight:700;margin:18px 0 8px;padding-left:4px}
.sec-lbl:first-child{margin-top:0}
/* 残在庫/販売数の参照日（いつ時点の値かを控えめに明示）と取得状態 */
.zaiko-asof{font-size:10px;color:#aaa;letter-spacing:0;font-weight:500;margin-left:6px}
.zaiko-asof.loading{color:#7a9ec4}
.zaiko-asof.err{color:#c62828}

/* ヤオコー店舗カード */
.ya-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.ya-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fafaf6;border-bottom:1px solid var(--border)}
.ya-icon{font-size:18px}
.ya-name{font-size:14px;font-weight:700;color:var(--ink);flex:1}
.ya-stotal{font-size:11px;color:var(--sub);background:#eee;border-radius:10px;padding:3px 8px;font-weight:600}
.ya-body{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid #f0ebe0}
.ya-cell{padding:10px 6px;border-right:1px dotted #ede5d3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.ya-cell:last-child{border-right:none}
.ya-cell-p{font-size:15px;color:var(--ink);font-weight:700;font-family:'Inter','Noto Sans JP',sans-serif;letter-spacing:.02em;line-height:1.1;white-space:nowrap}
.ya-cell-zan{font-size:11px;color:var(--orange);font-weight:600;background:#fff3e0;border-radius:4px;padding:2px 8px;line-height:1.2;white-space:nowrap}
.ya-cell-zan.none{background:#f2f2f2;color:#bbb}
/* 販売数（編集モードのみ表示） - 残在庫と縦に並べ、全価格でセル高が揃うようにする */
.ya-cell-sales{font-size:11px;color:var(--blue);font-weight:600;background:var(--blue-bg);border-radius:4px;padding:2px 8px;line-height:1.2;white-space:nowrap}
.ya-cell-sales.none{background:#f2f2f2;color:#bbb}
/* 取得中（スケルトン風の点滅）と取得失敗。「値なし(-)」と見た目で区別する */
.ya-cell-zan.loading,.ya-cell-sales.loading{background:#eef2f7;color:#8fa6bd;animation:zskel 1.1s ease-in-out infinite}
.ya-cell-zan.err,.ya-cell-sales.err{background:#fdecea;color:#c62828}
@keyframes zskel{0%,100%{opacity:1}50%{opacity:.45}}
.ya-cell input{width:100%;font-family:'Inter','Noto Sans JP',sans-serif;font-size:17px;font-weight:700;text-align:center;border:1.5px solid var(--border);border-radius:8px;padding:6px 4px;background:#fff;color:var(--green);margin-top:2px}
.ya-cell input:focus{outline:none;border-color:var(--green)}
.ya-cell input:read-only{background:#f7f4ec;border-color:transparent;color:var(--ink)}

/* ── 臨時品目（チラシ割引等・その日限りの価格）──────────────────
   基本4価格の .ya-body とは別セクションにし、淡いアンバー地＋破線で
   「定番ではない」ことを控えめに示す。合計・サマリー・シール計算には
   一切入らない（フロントも updExtraPrice しか呼ばない）。 */
.ya-extra{border-top:1px dashed #e6d9b8;background:#fffdf5}
.ya-extra-hdr{display:flex;align-items:center;gap:8px;padding:7px 12px 3px}
.ya-extra-ttl{font-size:10px;font-weight:700;color:#a1791f;letter-spacing:.1em;flex:1;min-width:0}
.ya-extra-note{font-size:9px;color:#bda86f;font-weight:500;letter-spacing:0}
.ya-extra-add{background:#fff;color:#a1791f;border:1px solid #e0c97f;border-radius:14px;padding:4px 10px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
.ya-extra-add:active{opacity:.7}
.ya-extra-body{border-top:none!important}
.ya-extra-body .ya-cell{position:relative;border-right-color:#ede0bd;padding-top:8px}
.ya-extra-body .ya-cell-p{color:#8a6a1c}
.ya-extra-body .ya-cell input{border-color:#e0c97f;color:#8a6a1c}
.ya-extra-body .ya-cell input:focus{border-color:#a1791f}
.ya-rinji-badge{font-size:9px;font-weight:700;color:#a1791f;background:#fdf3d8;border-radius:3px;padding:1px 5px;line-height:1.3;letter-spacing:.04em}
.ya-extra-del{position:absolute;top:1px;right:2px;width:18px;height:18px;line-height:16px;padding:0;background:none;border:none;color:#c9b071;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.ya-extra-del:active{color:#8a6a1c}
/* 閲覧モード（配達員が見る画面）の臨時品目行。納品指示が入っている時だけ出す。 */
.ya-extra-view{background:#fffdf5;border:1px solid #ede0bd;border-radius:10px;padding:9px 12px;margin:-6px 0 14px;font-size:12px;color:#8a6a1c;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ya-extra-view-ttl{font-size:10px;font-weight:700;letter-spacing:.1em;color:#a1791f;width:100%}
.ya-extra-view-chip{background:#fff;border:1px solid #e0c97f;border-radius:6px;padding:3px 9px;font-weight:700;font-family:'Inter','Noto Sans JP',sans-serif}
.ya-extra-view-chip b{color:var(--green);font-size:14px;margin-left:3px}
.ya-extra-view-chip i{font-style:normal;font-weight:600;font-size:10px;color:#a1791f;margin-left:5px;white-space:nowrap}

/* 金額入力モーダル（日報 index.html の showPriceModal と同一仕様） */
.price-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:20px}
.price-modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.price-modal-ttl{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;text-align:center}
.price-modal-inp{width:100%;font-family:'Inter','Noto Sans JP',sans-serif;font-size:20px;font-weight:700;text-align:center;border:1.5px solid var(--border);border-radius:8px;padding:10px;color:var(--ink)}
.price-modal-inp:focus{outline:none;border-color:var(--green)}
.price-modal-btns{display:flex;gap:8px;margin-top:14px}
.price-modal-btns button{flex:1;padding:10px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none}
.price-modal-cancel{background:#f0ede6;color:#666}
.price-modal-ok{background:var(--green);color:#fff}

/* その他（コメント） */
.cm-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.cm-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fafaf6;border-bottom:1px solid var(--border)}
.cm-icon{font-size:18px}.cm-name{font-size:14px;font-weight:700;color:var(--ink);flex:1}
.cm-body{padding:10px 14px}
.cm-body textarea{width:100%;min-height:38px;font-family:inherit;font-size:13px;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);resize:none;overflow:hidden;line-height:1.6;display:block;box-sizing:border-box}
.cm-body textarea:focus{outline:none;border-color:var(--blue)}
.cm-body textarea:read-only{background:#f7f4ec;border-color:transparent}
.cm-empty{font-size:12px;color:#aaa;font-style:italic;padding:6px 0}

/* 保存ボタン */
.save-bar{position:sticky;bottom:0;background:linear-gradient(to top,rgba(245,241,232,1) 60%,rgba(245,241,232,0));padding:14px 0 4px;margin-top:8px}
.save-btn{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.04em;box-shadow:0 2px 8px rgba(45,122,79,.3)}
.save-btn:active{opacity:.85}.save-btn:disabled{opacity:.5;cursor:not-allowed}

/* 最終更新表示（目立たせる） */
.last-upd{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow);letter-spacing:.02em}
.last-upd.none{color:#b71c1c;border-left-color:#d32f2f;background:#ffebee}

/* ヤオコー統合表（閲覧モード） */
.ya-tbl-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.ya-tbl{width:100%;border-collapse:collapse;font-size:13px}
.ya-tbl th{background:#f5f3ee;color:var(--ink);font-weight:700;font-size:15px;padding:10px 4px;text-align:center;border-bottom:2px solid var(--border);letter-spacing:.02em;font-family:'Inter','Noto Sans JP',sans-serif}
.ya-tbl th:first-child{text-align:left;padding-left:12px;font-size:12px;color:#666;letter-spacing:.04em}
.ya-tbl td{padding:8px 4px;text-align:center;border-bottom:1px dotted #ede5d3;vertical-align:middle}
.ya-tbl td:first-child{text-align:left;padding-left:12px;color:#333;font-size:12px;font-weight:600;white-space:nowrap}
.ya-tbl tr.total-row{background:var(--green-bg);border-top:2px solid #66bb6a}
.ya-tbl tr.total-row td:first-child{color:var(--green);font-weight:700}
.ya-tbl tr:last-child td{border-bottom:none}
.nh-val{font-size:17px;font-weight:700;color:var(--green);font-family:'Inter','Noto Sans JP',sans-serif;line-height:1.1}
.nh-val.zero{color:#bbb}
.zan-mini{font-size:11px;color:var(--orange);font-weight:600;background:#fff3e0;border-radius:4px;padding:2px 6px;display:inline-block;margin-left:6px;vertical-align:middle}
.zan-mini.none{background:#f2f2f2;color:#aaa}

/* 全ルート総合計（編集モード最上段） */
.all-total{background:#fff;border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.all-total-ttl{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.08em;margin-bottom:8px}
.all-total-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.all-total-cell{text-align:center;background:var(--green-bg);border-radius:8px;padding:8px 4px}
.all-total-cell .at-p{font-size:14px;color:var(--green);font-weight:700;margin-bottom:2px;font-family:'Inter','Noto Sans JP',sans-serif}
.all-total-cell .at-v{font-size:20px;color:var(--green);font-weight:700;font-family:'Inter','Noto Sans JP',sans-serif;line-height:1.1}
.all-total-cell .at-u{font-size:10px;color:#888;margin-left:2px}

/* 商品別合計に足す臨時品目の行（全ルート総合計／経路別合計 共通）。
   既存の商品別合計グリッドの下に別枠で置き、アンバー地で定番外だと分かるようにする。 */
.xt-rows{margin-top:8px;padding-top:8px;border-top:1px dashed #e6d9b8;display:flex;flex-direction:column;gap:6px}
.xt-row{display:flex;align-items:center;gap:10px;background:#fffdf5;border:1px solid #ede0bd;border-radius:8px;padding:6px 12px}
.xt-p{font-size:13px;font-weight:700;color:#a1791f;font-family:'Inter','Noto Sans JP',sans-serif;letter-spacing:.02em;flex:1;min-width:0}
.xt-v{font-size:18px;font-weight:700;color:#8a6a1c;font-family:'Inter','Noto Sans JP',sans-serif;line-height:1.1;flex:none}

/* エラー・再試行UI */
.err-box{background:#fff;border:1px solid #ffb74d;border-left:4px solid #d32f2f;border-radius:10px;padding:14px 16px;margin:16px 0;text-align:center;color:#b71c1c;font-size:13px;line-height:1.6;box-shadow:var(--shadow)}
.err-box .retry-btn{margin-top:10px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.loading-retry{margin-top:14px;font-size:12px;color:#999}
.loading-retry button{background:none;border:1px solid #ccc;border-radius:6px;padding:6px 14px;font-family:inherit;font-size:12px;color:#666;cursor:pointer;margin-left:4px}

/* ローディング・トースト */
#loading{text-align:center;padding:40px 0;color:#888;font-size:13px}
.spinner{display:inline-block;width:26px;height:26px;border:3px solid #e0d9cc;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:70px;left:0;right:0;display:flex;justify-content:center;padding:0 20px;pointer-events:none;z-index:200}
.toast-inner{background:#1c1c1e;color:#fff;padding:11px 22px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);transform:translateY(80px);opacity:0;transition:transform .3s,opacity .3s}
.toast-inner.show{transform:translateY(0);opacity:1}
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:300}
.loading-box{background:#fff;border-radius:14px;padding:22px 30px;text-align:center;font-size:14px;font-weight:600}
.footer{position:fixed;bottom:0;left:0;width:100%;height:52px;background:#1c1c1e;display:flex;align-items:center;justify-content:center;z-index:100}
.footer a{color:#fff;text-decoration:none;font-size:14px;font-weight:500}

/* 日報入力トップへのリンク（index.html。summary-link-btn相当の小型版・常時表示） */
.nippo-link-wrap{padding:12px 16px 0}
.nippo-link-btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border-radius:18px;padding:6px 14px;text-decoration:none;font-size:12px;font-weight:600;letter-spacing:.02em;box-shadow:var(--shadow)}
.nippo-link-btn:active{opacity:.8}
</style>
</head>
<body>

<!-- ▼▼▼ 【テスト環境】バナー（本番と誤認防止）▼▼▼ -->
<style>
  html { border-top: 6px solid #d93025 !important; }
  #__test_env_banner__ {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
    background: #d93025; color: #fff; text-align: center;
    font: bold 13px/1.4 system-ui, -apple-system, sans-serif;
    padding: 4px 8px; letter-spacing: 0.05em;
    box-shadow: 0 2px 4px rgba(0,0,0,.3);
    pointer-events: none;
  }
  body { margin-top: 26px !important; }
</style>
<div id="__test_env_banner__">⚠️ テスト環境 - 本番ではありません（TEST）⚠️</div>
<!-- ▲▲▲ 【テスト環境】バナー ▲▲▲ -->

<div class="hdr">
  <div class="hdr-top">
    <h1>📦 配達商品情報</h1>
    <button class="mode-btn" id="modeBtn" onclick="toggleMode()">✏️ 編集モード</button>
  </div>
  <div class="hdr-date" id="hDate"></div>
  <!-- 経路タブは shared-stores.js の ROUTES から描画する（renderRouteTabs）。
       ラベルをここにベタ書きすると ROUTE_VERSION 切替で不整合になるので禁止。 -->
  <div class="route-tabs" id="routeTabs">
  </div>
</div>
<div class="nippo-link-wrap"><a href="index.html" class="nippo-link-btn">📝 日報入力へ</a></div>
<div id="app"><div id="loading"><div class="spinner"></div><br>読み込み中...</div></div>
<div class="toast"><div class="toast-inner" id="toast"></div></div>
<footer class="footer"><a href="https://sakae-garden.github.io/">🏠 ホームに戻る</a></footer>
<script src="shared-stores.js"></script>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbwe8_3Dp1U7an5wPVt8T2c2AXT6ltwM-T-bquI5IdGk4-uNCHtvd1Ifhn4MRv1-Oegp/exec';
// スナップショット配信URL（GCS+CORS+publicRead。フロントの初期表示を高速化する）
var SNAPSHOT_URL = 'https://storage.googleapis.com/sakae-garden-snapshots/test/haitatsu.json';
// 残在庫/販売数スナップショット（GASのgetYaokoZaiko代替。編集モード切替時のみ使用）
var ZAIKO_SNAPSHOT_URL = 'https://storage.googleapis.com/sakae-garden-snapshots/test/zaiko.json';
// スナップショット鮮度の上限（これより古ければGAS直取得へフォールバック）。朝の運用に十分な6時間。
var SNAPSHOT_MAX_AGE_MS = 6 * 3600 * 1000;
var YAOKO_PRICES = ['¥99','¥198','¥398','¥598'];

// SWR用 localStorage キー。/nippo/test/ は本番と同一オリジンで localStorage を共有するため、
// スナップショットURL(/test/)で環境を判定してキーを分ける。本番のキー名は従来のまま。
// index.html も同じ規則で haitatsu_latest を読むので、両者のキーは常に一致する。
var IS_TEST_ENV = String(SNAPSHOT_URL).indexOf('/test/') > -1;
function lsKey(base){ return base + (IS_TEST_ENV ? '_test' : ''); }
var LS_HAITATSU_CACHE = lsKey('haitatsu_cache_v1');
var LS_HAITATSU_LATEST = lsKey('haitatsu_latest');
// 残在庫/販売数のSWRキャッシュ。既存の haitatsu_cache_v1 は納品数(items)と
// lastUpdated しか持たないため専用キーを新設する。必ず lsKey() 経由（環境別分離）。
var LS_ZAIKO_CACHE = lsKey('zaiko_cache_v1');

var state = { mode:'view', route:0, data:{}, zaiko:{}, zaikoExtras:{}, zaikoDataDate:'', lastUpdated:'', dirty:false, loaded:false,
              zaikoLoaded:false, zaikoLoading:false, zaikoError:false, zaikoFromCache:false, zaikoFetched:false,
              dataStale:false };

var today = new Date();
var DAYS = ['日','月','火','水','木','金','土'];
var todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
// 前日（臨時品目の有効期間判定に使う）
var yesterdayStr = (function(){
  var d = new Date(today.getFullYear(), today.getMonth(), today.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
})();
// 臨時品目の有効期間。
// 【2026-08-12 修正】配達商品情報は「前夜に翌日分を入力する」運用のため、
// extrasDate === todayStr（入力日一致）だと入力した翌朝に必ず消えていた
// （8/11夜入力の¥300 12店舗・115個が8/12朝に全滅）。
// 入力日D の指示は D（入力日）と D+1（配達日）に有効、D+2 で自動失効とする。
function _extrasAlive(d){ return !!d && String(d) >= yesterdayStr; }
document.getElementById('hDate').textContent = today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日（'+DAYS[today.getDay()]+'）';

// ============ jsonp ============
// 強化1: script.onload で「スクリプトはロードされたがコールバック未呼出」
//        （Drive 404 HTML が返ったケース等）を検知して onErr に倒す。
//        ※ただしこれは HTTP 応答が届いてからしか判定できない。実測では
//          GAS が 404/HTML中間ページを返すケースは応答自体が 30〜70秒
//          かかるため、onload 検知だけでは早期失敗にならない。早期に
//          見切るのは timeoutMs の役目で、下の「遅延到着」で無駄を消す。
// 強化2: 遅延到着(late arrival)の受け取り。JSONP はリクエストをキャンセル
//        できないので、タイムアウトで見切った後に応答が届くことがある。
//        opts.onLate を渡すと、タイムアウト後 opts.lateGraceMs の間だけ
//        コールバックと script タグを残し、遅れて届いた応答を拾う。
//        → 「短いタイムアウトで素早く確認導線へ入る」のに、実際には
//           成立していた保存を捨てずに済む（無駄な再送を止められる）。
// 実測(2026-08-05, テストGAS): submit/saveHaitatsu とも p50≈3〜5秒・
// p90≈9〜13秒。まれに 20〜70秒の外れ値と 404/HTML中間ページが出る。
var cbIdx=0;
function jsonp(url,base,onOk,onErr,timeoutMs,opts){
  opts = opts || {};
  var n=base+'_'+(cbIdx++), s=document.createElement('script');
  var settled=false;   // onOk/onErr のいずれかを呼び終えた
  var disposed=false;  // 後片付け済み
  var t=null, lt=null;
  function dispose(){
    if(disposed) return; disposed=true;
    clearTimeout(t); clearTimeout(lt);
    try{ delete window[n]; }catch(e){ window[n]=undefined; }
    if(s.parentNode) s.parentNode.removeChild(s);
  }
  window[n]=function(d){
    clearTimeout(t);
    if(!settled){ settled=true; dispose(); onOk(d); return; }
    // タイムアウト後に遅れて届いた応答
    dispose();
    if(opts.onLate){ try{ opts.onLate(d); }catch(e){} }
  };
  function failNow(){
    if(settled) return;
    settled=true;
    if(opts.onLate && opts.lateGraceMs>0){
      // script タグとコールバックは猶予時間だけ残し、遅延到着を拾えるようにする
      lt=setTimeout(dispose, opts.lateGraceMs);
    } else {
      dispose();
    }
    if(onErr) onErr();
  }
  t=setTimeout(failNow, timeoutMs||45000);
  s.onload=function(){
    // script は実行完了したが window[n] が呼ばれていなければ失敗扱い
    if(settled) return;
    setTimeout(function(){ if(!settled) failNow(); },200);
  };
  s.onerror=function(){ failNow(); };
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+n;
  document.body.appendChild(s);
}

// ============ utility ============
function eH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function eA(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function esc(s){return String(s).replace(/[^a-zA-Z0-9]/g,'_');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('show');},2500);}
function showLoading(msg){var el=document.getElementById('lo');if(!el){el=document.createElement('div');el.id='lo';el.className='loading-overlay';el.innerHTML='<div class="loading-box"><div class="spinner"></div><br><span id="loMsg"></span></div>';document.body.appendChild(el);}var m=document.getElementById('loMsg');if(m)m.textContent=msg||'保存中...';}
function hideLoading(){var el=document.getElementById('lo');if(el)el.parentNode.removeChild(el);}

// ============ route ヘルパー ============
function routeStores(routeIdx){
  // ROUTES[routeIdx].groups の stores を flat に
  var ids=[];
  ROUTES[routeIdx].groups.forEach(function(g){ g.stores.forEach(function(id){ids.push(id);}); });
  return ids;
}
function routeYaokoIds(routeIdx){
  return routeStores(routeIdx).filter(function(id){ var d=STORE_DEFS[id]; return d && d.type==='yaoko'; });
}
function routeOtherIds(routeIdx){
  return routeStores(routeIdx).filter(function(id){ var d=STORE_DEFS[id]; return d && d.type!=='yaoko'; });
}

}

// ============ 臨時品目（その日限りの価格）============
// 【設計 2026-08-11】
// チラシ割引（178/188/158…毎回変わる）は常設列を作らず、店舗エントリの
// entry.extras = {'¥178':'30'} / entry.extrasDate = 'YYYY-MM-DD' に持つ。
//   ・entry.prices（既存4価格）には絶対に入れない。したがって
//     経路合計・全ルート総合計・店舗小計・産地シール消費(¥99)・
//     値段ラベル(男衾/川本の固定4価格)のどれにも混ざらない。
//   ・extrasDate が当日でないものは「持ち越さない」ため読み込み時に捨てる。
//     ただし『残在庫がある間の参照表示』は state.zaikoExtras 側で出続ける。
function extrasOf(storeName){
  var e = state.data[storeName];
  if(!e || !e.extras || typeof e.extras !== 'object') return {};
  if(!_extrasAlive(e.extrasDate)) return {};   // 前々日以前の指示は失効
  return e.extras;
}
// 参照用（日報で発生した臨時品目の残在庫/販売数）
function extraZanFor(storeName, price){
  var s = state.zaikoExtras && state.zaikoExtras[storeName];
  if(!s || !s[price]) return null;
  return s[price];  // { zan, tenpo, sales, hasSales }
}
function _priceNum(p){ return parseInt(String(p).replace(/[^0-9]/g,''),10) || 0; }
// この店舗で臨時品目として表示すべき価格の一覧（昇順）。
//   ① 有効期間内の納品指示が入っているもの（0 を含む＝入力途中でも消えない）
//   ② 残在庫が残っている、または販売数があるもの
// 【2026-08-12 修正】従来は zan>0 のみだったため、前日に売り切れた臨時価格
//   （例: 178円が完売）が翌日まったく見えず、「昨日何個売れたか」から今日の
//   納品数を判断できなかった。残0でも販売実績があれば行を残す。
//   両方0/無しのときだけ非表示。
// ※「前日」を独自に決める処理はここには無い。参照するのは state.zaikoExtras で、
//   その中身は getYaokoZaiko / zaiko.json が「直近に実データがある日」として
//   解決した actualDate の値（＝既存の仕組みそのまま）。入力日基準ではない。
function _extraRefVisible(z){
  if(!z) return false;
  return (parseInt(z.zan,10)||0) > 0 || (parseInt(z.sales,10)||0) > 0;
}
function storeExtraPrices(storeName){
  var set = {}, out = [];
  var ex = extrasOf(storeName);
  Object.keys(ex).forEach(function(p){ set[p]=true; });
  var z = (state.zaikoExtras && state.zaikoExtras[storeName]) || {};
  Object.keys(z).forEach(function(p){
    if(YAOKO_PRICES.indexOf(p) > -1) return;          // 念のため既存価格は除外
    if(_extraRefVisible(z[p])) set[p]=true;
  });
  Object.keys(set).forEach(function(p){ out.push(p); });
  out.sort(function(a,b){ return _priceNum(a)-_priceNum(b); });
  return out;
}
function updExtraPrice(storeName, price, val){
  if(YAOKO_PRICES.indexOf(price) > -1) return;        // 既存価格は臨時にしない
  if(!state.data[storeName]) state.data[storeName]={};
  var e = state.data[storeName];
  if(!e.extras || typeof e.extras !== 'object' || !_extrasAlive(e.extrasDate)){
    // 新しくセットを起こすときだけ当日を刻む
    e.extras = {};
    e.extrasDate = todayStr;
  }
  // 有効期間内の既存セットを編集した場合は extrasDate を書き換えない。
  // 書き換えると編集のたびに期限が1日延び、いつまでも失効しなくなる。
  e.extras[price] = val;
  state.dirty = true;
  // 既存4価格の合計（at_/rt_・店舗小計）はここでは触らない＝臨時は既存合計に入らない。
  // 臨時は専用行(axt_/rxt_)だけをリアルタイム更新する。
  updateAllRoutesTotal();
  updateRouteTotal();
}
// 保存済みデータのうち、当日でない臨時指示を落とす（その日・その店舗限りの扱い）。
function _purgeStaleExtras(items){
  Object.keys(items || {}).forEach(function(nm){
    var e = items[nm];
    if(!e || typeof e !== 'object') return;
    if(e.extras && !_extrasAlive(e.extrasDate)){
      delete e.extras;
      delete e.extrasDate;
    }
  });
  return items;
}
function addExtraForStore(storeName){
  showPriceModal(function(v){
    if(v===null) return;
    v = String(v).trim().replace(/[¥￥]/g,'').replace(/[,，]/g,'');
    var n = parseInt(v,10);
    if(!n || n<=0 || isNaN(n)){ alert('正の整数を入力してください'); return; }
    var label = '¥'+n;
    // 【二重計上の遮断】既存4価格と同じ臨時品目は作らせない。
    // ¥99 は産地シール消費の唯一の集計源なので特に重要。
    if(YAOKO_PRICES.indexOf(label) > -1){
      alert('既存価格('+label+')と同じです。追加できません。\n既存価格は上の入力欄に入れてください。');
      return;
    }
    if(storeExtraPrices(storeName).indexOf(label) > -1){
      alert(label+'は既に追加されています');
      return;
    }
    updExtraPrice(storeName, label, '');
    renderRoute();
  });
}
// 金額入力モーダル（日報 index.html の showPriceModal と同一仕様：
// type=text / inputmode=numeric / pattern=[0-9]* で数字テンキーが出る）
function showPriceModal(cb){
  var ov=document.createElement('div');
  ov.className='price-modal-ov';
  ov.innerHTML='<div class="price-modal"><div class="price-modal-ttl">追加する商品の価格（円）</div>'
    +'<input type="text" inputmode="numeric" pattern="[0-9]*" class="price-modal-inp" placeholder="例：178" maxlength="6">'
    +'<div class="price-modal-btns"><button type="button" class="price-modal-cancel">キャンセル</button><button type="button" class="price-modal-ok">追加</button></div></div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector('.price-modal-inp');
  var done=false;
  function close(val){ if(done)return; done=true; if(ov.parentNode)ov.parentNode.removeChild(ov); cb(val); }
  ov.querySelector('.price-modal-ok').onclick=function(){ close(inp.value); };
  ov.querySelector('.price-modal-cancel').onclick=function(){ close(null); };
  ov.addEventListener('click',function(e){ if(e.target===ov) close(null); });
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); close(inp.value); } else if(e.key==='Escape'){ close(null); } });
  setTimeout(function(){ try{ inp.focus(); }catch(e){} },50);
}
// 納品指示を取り消す。残在庫が残っていれば参照表示としては出続ける。
function rmExtraForStore(storeName, price){
  var ex = extrasOf(storeName);
  if(ex[price]===undefined) return;
  if(!confirm(price+' の臨時品目の納品指示を取り消しますか？')) return;
  delete state.data[storeName].extras[price];
  if(!Object.keys(state.data[storeName].extras).length){
    delete state.data[storeName].extras;
    delete state.data[storeName].extrasDate;
  }
  state.dirty = true;
  renderRoute();
}

// ============ 計算 ============
function priceTotalForRoute(routeIdx, price){
  var ids = routeYaokoIds(routeIdx);
  var t=0;
  ids.forEach(function(id){
    var nm = STORE_DEFS[id].name;
    var v = state.data[nm] && state.data[nm].prices && state.data[nm].prices[price];
    t += parseInt(v)||0;
  });
  return t;
}
function storeSubtotal(storeName){
  var entry = state.data[storeName];
  if(!entry || !entry.prices) return 0;
  var t=0;
  YAOKO_PRICES.forEach(function(p){ t += parseInt(entry.prices[p])||0; });
  return t;
}
// 残在庫（店舗×価格）：state.zaiko[storeName][price].zan
function zanFor(storeName, price){
  var s = state.zaiko && state.zaiko[storeName];
  if(!s || !s[price]) return null;
  return s[price];  // { zan, tenpo, sales, hasSales }
}
function zanTotalForRoute(routeIdx, price){
  var ids = routeYaokoIds(routeIdx);
  var t=0, any=false;
  ids.forEach(function(id){
    var nm = STORE_DEFS[id].name;
    var z = zanFor(nm, price);
    if(z){ t += z.zan||0; any=true; }
  });
  return any ? t : null;
}
// 全ルートのヤオコー店舗 ID
function allYaokoIds(){
  var ids=[];
  for(var i=0;i<ROUTES.length;i++){
    routeYaokoIds(i).forEach(function(id){ if(ids.indexOf(id)<0) ids.push(id); });
  }
  return ids;
}
// 全ヤオコー店舗の指定価格の納品数合計
function priceTotalAllRoutes(price){
  var t=0;
  allYaokoIds().forEach(function(id){
    var nm = STORE_DEFS[id].name;
    var v = state.data[nm] && state.data[nm].prices && state.data[nm].prices[price];
    t += parseInt(v)||0;
  });
  return t;
}
// ---- 臨時品目の商品別合計（既存4価格の合計とは完全に別枠）----
// 【対象はヤオコー店舗のみ】ids は allYaokoIds()/routeYaokoIds() を渡す。両者とも
// STORE_DEFS.type==='yaoko' で絞られているため、直売所・たまや・道の駅の臨時品目が
// 「ヤオコー納品数合計」に混入する経路が存在しない。
// 既存4価格(YAOKO_PRICES)と同じキーは念のためここでも除外する。
// 戻り: [{price:'¥300', total:150}, ...] を価格の昇順で。
function extraTotalsFor(ids){
  var m = {};
  ids.forEach(function(id){
    var def = STORE_DEFS[id];
    if(!def || def.type !== 'yaoko') return;      // 二重の防御
    var ex = extrasOf(def.name);                  // 当日分のみ（extrasDate===todayStr）
    Object.keys(ex).forEach(function(p){
      if(YAOKO_PRICES.indexOf(p) > -1) return;
      if(!(p in m)) m[p] = 0;
      m[p] += parseInt(ex[p], 10) || 0;
    });
  });
  return Object.keys(m)
    .sort(function(a,b){ return _priceNum(a)-_priceNum(b); })
    .map(function(p){ return { price: p, total: m[p] }; });
}
function extraTotalsAllRoutes(){ return extraTotalsFor(allYaokoIds()); }
function extraTotalsForRoute(r){ return extraTotalsFor(routeYaokoIds(r)); }
// 表示ラベル: '¥300' → '+300円'
function extraTotalLabel(price){ return '+'+_priceNum(price)+'円'; }

// 全ルート総合計の各セルを即時更新（入力ごとに呼ぶ）
function updateAllRoutesTotal(){
  YAOKO_PRICES.forEach(function(p){
    var el = document.getElementById('at_'+esc(p));
    if(el) el.textContent = priceTotalAllRoutes(p);
  });
  // 臨時品目行（存在する行の数値だけ差し替える。行の増減は renderRoute 側で行う）
  extraTotalsAllRoutes().forEach(function(e){
    var el = document.getElementById('axt_'+esc(e.price));
    if(el) el.textContent = e.total;
  });
}
function updateRouteTotal(){
  YAOKO_PRICES.forEach(function(p){
    var el = document.getElementById('rt_'+esc(p));
    if(el) el.textContent = priceTotalForRoute(state.route, p);
  });
  extraTotalsForRoute(state.route).forEach(function(e){
    var el = document.getElementById('rxt_'+esc(e.price));
    if(el) el.textContent = e.total;
  });
}
function updateStoreSubtotal(storeName){
  var el = document.getElementById('st_'+esc(storeName));
  if(el) el.textContent = '合計 '+storeSubtotal(storeName)+'個';
}

// ============ 描画 ============
function switchRoute(i){
  if(state.dirty && state.mode==='edit'){
    if(!confirm('編集中の変更があります。タブを切り替えると保存ボタンを押すまで保持されますが、続けますか？')){
      return;
    }
  }
  state.route=i;
  for(var j=0;j<ROUTES.length;j++){ var t=document.getElementById('tab'+j); if(t) t.classList.toggle('active',j===i); }
  renderRoute();
}
// 経路タブを ROUTES から描画（本数・ラベルとも ROUTE_VERSION に追随する）
function renderRouteTabs(){
  var el=document.getElementById('routeTabs');
  if(!el || typeof ROUTES==='undefined') return;
  var h='';
  for(var i=0;i<ROUTES.length;i++){
    h+='<button class="rtab'+(i===state.route?' active':'')+'" id="tab'+i+'" onclick="switchRoute('+i+')">'+eH(ROUTES[i].label)+'</button>';
  }
  el.innerHTML=h;
}
function toggleMode(){
  if(state.mode==='edit' && state.dirty){
    if(!confirm('未保存の変更があります。閲覧モードに戻すと変更は破棄されます（保存しても戻せます）。続けますか？')){
      return;
    }
    state.data = JSON.parse(JSON.stringify(state.origData||{}));
    state.dirty = false;
  }
  var toEdit = (state.mode==='view');
  state.mode = (toEdit?'edit':'view');
  var b=document.getElementById('modeBtn');
  if(state.mode==='edit'){ b.textContent='👁 閲覧モードへ'; b.classList.add('edit'); }
  else                  { b.textContent='✏️ 編集モード';   b.classList.remove('edit'); }
  // 【2026-08-12 変更】従来は編集モード遷移時にだけ残在庫/販売数を用意していたが、
  // 閲覧モードでも臨時品目の残在庫・販売数を出す要件になったため両モードで用意する。
  // 取得はスナップショット優先（GCS・GAS実行スロットを消費しない）で、
  // スナップショットが使えないときだけ GAS へフォールバックする。
  var needFetch = _prepareZaiko();
  renderRoute();
  if(needFetch) _fetchZaiko(0);
}

// 編集モードに入るときの残在庫/販売数の準備。
//  - 初回はキャッシュがあれば描画前に載せて0秒表示にし、裏で最新を取得（層2 SWR）。
//  - キャッシュが無いときだけ「読み込み中」状態にする（層1。「-」で黙って待たせない）。
//  - 取得失敗後に編集モードへ入り直したら再試行する（従来の !zaikoLoaded 条件と同等）。
// 戻り値: 取得を走らせるべきなら true（呼び出し側が renderRoute 後に実行する）。
function _prepareZaiko(){
  if(state.zaikoLoading) return false;                                          // 取得中は二重に走らせない
  if(state.zaikoFetched && state.zaikoLoaded && !state.zaikoError) return false; // 取得済み
  if(!state.zaikoFetched){
    state.zaikoFetched = true;
    var zc = _readZaikoCache();
    if(zc){
      state.zaiko = zc.items;
      state.zaikoExtras = zc.extras || {};
      state.zaikoDataDate = zc.dataDate;   // ★参照日はキャッシュ保存時のものを必ず使う
      state.zaikoLoaded = true;
      state.zaikoFromCache = true;
    }
  }
  state.zaikoLoading = !state.zaikoLoaded;  // 出せる値が無いときだけ「読み込み中」
  state.zaikoError = false;
  return true;
}

// 残在庫/販売数の状態ラベル（ヤオコー見出し横の控えめ表示）。
// 参照日は必ず state.zaikoDataDate（＝その値が実際にいつのものか）から作る。
// キャッシュ表示中もキャッシュに保存された参照日を出すので、前日の値なのに
// 当日日付を表示する誤表示は起こらない。
function zaikoStatusLabel(){
  if(!state.zaikoLoaded){
    if(state.zaikoError) return { cls:'err', text:'残・売 取得失敗（再読込で再試行）' };
    if(state.zaikoLoading) return { cls:'loading', text:'残・売 読み込み中…' };
    return null;
  }
  var m = String(state.zaikoDataDate||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  var d = '残・売 '+parseInt(m[2])+'/'+parseInt(m[3])+'時点';
  if(state.zaikoError)     return { cls:'err',     text:d+'（更新失敗）' };
  if(state.zaikoFromCache) return { cls:'loading', text:d+' · 更新中…' };
  return { cls:'', text:d };
}

function fmtLastUpdated(ts){
  // ts 形式: 'yyyy-MM-dd HH:mm:ss'
  if(!ts) return '';
  var m = ts.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
  if(!m) return ts;
  return parseInt(m[2])+'月'+parseInt(m[3])+'日 '+m[4]+':'+m[5];
}

function renderRoute(){
  try { _renderRouteUnsafe(); }
  catch(e){
    // 描画失敗時はエラー画面 + 再読込ボタンを表示（「読み込み中」で固まらないように）
    var msg = (e && e.message) ? e.message : String(e);
    document.getElementById('app').innerHTML =
      '<div class="err-box">⚠️ 画面表示でエラーが発生しました<br>'
      +'<span style="font-size:11px;color:#888">'+eH(msg)+'</span><br>'
      +'<button class="retry-btn" onclick="location.reload()">🔄 再読み込み</button></div>';
  }
}

// 閲覧モード（配達員が見る画面）の臨時品目。統合表の下に1ブロックとして出す。
// 統合表そのもの・経路合計・全ルート総合計の計算には一切関与しない。
// 【2026-08-12 修正】表示対象を編集モードと同じ storeExtraPrices() に統一した。
//   ＝ 有効期間内の納品指示があるもの ＋ 残在庫が残っている/販売数があるもの。
//   納品指示数に加えて残在庫・販売数も出すので、配達員が閲覧モードのまま
//   「昨日どれだけ売れて何個残っているか」を見て納品数を判断できる。
function _extraViewHtml(yaIds){
  var rows = [];
  yaIds.forEach(function(id){
    var nm = STORE_DEFS[id].name;
    var ps = storeExtraPrices(nm);
    if(!ps.length) return;
    rows.push({ nm: nm, ps: ps, ex: extrasOf(nm) });
  });
  if(!rows.length) return '';
  var zs = zaikoStatusLabel();
  var h = '<div class="ya-extra-view"><span class="ya-extra-view-ttl">➕ 臨時品目'
        + (zs ? '<span class="zaiko-asof'+(zs.cls?' '+zs.cls:'')+'">'+eH(zs.text)+'</span>' : '')
        + '</span>';
  rows.forEach(function(r){
    r.ps.forEach(function(p){
      var z = extraZanFor(r.nm, p);
      var qty = r.ex[p];
      var body = eH(r.nm.replace('ヤオコー','').replace('店','')) + ' ' + eH(p);

      if(qty !== undefined && String(qty).trim() !== '') body += '<b>→'+eH(qty)+'個</b>';
      if(z){

      }
      h += '<span class="ya-extra-view-chip">'+body+'</span>';

  return h + '</div>';
}

// ============ 保存 ============
// saveHaitatsu は Google Apps Script のリダイレクト層（script.google.com →
// googleusercontent.com）が連続・コールドアクセス時に一時的な 404 を返すほか、
// 応答が数秒〜数十秒までばらつく（コールドスタート＋ScriptLock 待ち）。
//
// 【2026-07-30 の障害から得た教訓】
// JSONP はリクエストをキャンセルできないため、クライアントがタイムアウトしても
// GAS 側の書き込みはそのまま成立する。旧実装は
//   ・save 側タイムアウト 15秒 ≦ GAS 側 tryLock 待ち 15秒
//   ・1.5秒間隔で最大6回リトライ
// だったため、1回目が遅延すると後続リトライが全部 ScriptLock の行列に並び、
// 必ず 15秒で打ち切られる＝「全滅表示なのにサーバには書けている」状態に陥った
// （実際に 2026-07-29 23:11:35 の書き込みが成立していた）。
// 【2026-08-05 再設計：待つのをやめ、早く見切って素早く確定させる】
// 直前の対策（タイムアウト30秒・3回・確認導線）は「安全だが遅い」に振れすぎていた。
// 最悪 30+1.5+25+2+30+1.5+25+2+30+1.5+25 ≒ 173秒 かかり実用に耐えなかった。
//
// 実測（テストGAS・2026-08-05）:
//   saveHaitatsu  : GAS実行 0.8〜6.1秒 / 総応答 p50≈4秒・p90≈9秒
//   getHaitatsu   : p50≈2.5秒・p90≈12秒
//   ScriptLock 待ち: 5並列でも最大 3.4秒（＝ロック競合は律速ではない）
//   まれに 20〜70秒の外れ値・404/HTML中間ページが出る（Google側の転送レイヤ起因）
// つまり「30秒待つ」のは p90 の3倍以上を無駄に待つ設計だった。
//
// 新方針:
//   1) タイムアウトは p90 相当（10秒）。ここで見切って即座に確認導線へ入る
//   2) ただし JSONP はキャンセルできないので、見切った後も遅延到着を拾い続ける
//      （jsonp の onLate）。遅れて success が届いたらその場で確定し再送を打ち切る
//   3) 確認(getHaitatsu)も 8秒で見切る
//   4) 全体締切 SAVE_DEADLINE を持ち、超えたら即バナーへ倒す（待たせ続けない）
//   5) 送信前に必ず localStorage へ退避。以降どこで失敗しても入力は消えない
//   6) バナーへ倒した後もバックグラウンドで再確認し、実は保存されていたら自動解消
var SAVE_MAX_ATTEMPTS = 3;    // 合計試行回数
var SAVE_RETRY_WAIT   = 600;  // リトライ間隔(ms)
var SAVE_TIMEOUT      = 10000;// save 専用タイムアウト(ms)。実測 p90≈9秒
var SAVE_LATE_GRACE   = 25000;// 見切った後に遅延到着を拾う猶予(ms)
var VERIFY_WAIT       = 700;  // 失敗検知からサーバ確認までの待ち(ms)
var VERIFY_TIMEOUT    = 8000; // 保存確認(getHaitatsu)のタイムアウト(ms)
var SAVE_DEADLINE     = 20000;// 新しい試行を始めてよい上限(ms)。超えたらバナーへ
var SAVE_RECHECK_MS   = [6000, 15000];  // バナー後の自動再確認タイミング(ms)
var LS_HAITATSU_PENDING = lsKey('haitatsu_pending_v1');

// 保存セッション。1回の「保存」操作に属する試行・確認・遅延到着をまとめ、
// どれか1つが成功したら以降を全て無視する（多重確定・無駄な再送を防ぐ）。
var _saveSess = null;
function _newSaveSession(payload){
  return { id: 'S'+Date.now()+'_'+Math.random().toString(36).slice(2),
           payload: payload, t0: Date.now(), done: false, timers: [] };
}
function _sessAlive(sess){ return !!sess && !sess.done && _saveSess === sess; }
function _sessTimer(sess, fn, ms){
  var h = setTimeout(function(){ if(_sessAlive(sess)) fn(); }, ms);
  sess.timers.push(h); return h;
}
function _sessEnd(sess){
  if(!sess) return;
  sess.done = true;
  sess.timers.forEach(function(h){ clearTimeout(h); });
  sess.timers = [];
}
function _elapsed(sess){ return Date.now() - sess.t0; }

function doSave(){
  var payload = JSON.parse(JSON.stringify(state.data || {}));
  // 【最優先】送信を始める前に端末へ退避する。この時点以降、通信・タブ閉じ・
  // 端末再起動のいずれが起きても入力内容は失われない。
  _writePending(payload);
  _sessEnd(_saveSess);
  var sess = _newSaveSession(payload);
  _saveSess = sess;
  _doSaveAttempt(0, payload, sess);
}

// 送った payload がサーバに反映されているかを比較する。
// getHaitatsu は空値を落として返す・数値を文字列で返すため、両者を正規化して突合。
function _normVal(v){ return (v===undefined || v===null) ? '' : String(v).trim(); }
function _payloadMatches(items, payload){
  if(!items || typeof items !== 'object') return false;
  var PR = ['¥99','¥198','¥398','¥598'];
  var names = Object.keys(payload || {});
  for(var i=0;i<names.length;i++){
    var exp = payload[names[i]] || {}, got = items[names[i]] || {};
    var ep = exp.prices || {}, gp = got.prices || {};
    for(var j=0;j<PR.length;j++){
      if(_normVal(ep[PR[j]]) !== _normVal(gp[PR[j]])) return false;
    }
    if(_normVal(exp.comment) !== _normVal(got.comment)) return false;
    if(!_extrasMatch(exp, got)) return false;
  }
  return true;
}
// 臨時品目の突合。GAS は空値・数値化できない値を落として返すので、
// 送信側も同じ規則（空は無し扱い・整数化）に正規化してから比べる。
function _extrasNorm(entry){
  var src = (entry && entry.extras) || {};
  var out = {};
  Object.keys(src).forEach(function(k){
    if(!/^¥\d+$/.test(k)) return;
    if(YAOKO_PRICES.indexOf(k) > -1) return;
    var n = parseInt(src[k], 10);
    if(isNaN(n)) return;
    out[k] = String(n);
  });
  return out;
}
function _extrasMatch(exp, got){
  var a = _extrasNorm(exp), b = _extrasNorm(got);
  var ka = Object.keys(a), kb = Object.keys(b);
  if(ka.length !== kb.length) return false;
  for(var i=0;i<ka.length;i++){
    if(a[ka[i]] !== b[ka[i]]) return false;
  }
  return true;
}

function _nowStamp(){
  var nd=new Date();
  return nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-'+String(nd.getDate()).padStart(2,'0')
    +' '+String(nd.getHours()).padStart(2,'0')+':'+String(nd.getMinutes()).padStart(2,'0')+':'+String(nd.getSeconds()).padStart(2,'0');
}

function _saveSucceeded(payload, toastMsg){
  hideLoading();
  _clearPending();
  state.dirty = false;
  state.origData = JSON.parse(JSON.stringify(payload));
  state.lastUpdated = _nowStamp();
  // localStorageキャッシュ更新（保存本人は即時反映を体感できる。他閲覧者はスナップショット更新間隔待ち）
  _writeCache({ items: payload, lastUpdated: state.lastUpdated });
  // 旧キーも互換で更新（既存フォールバックのため）
  try { localStorage.setItem(LS_HAITATSU_LATEST, JSON.stringify(payload)); } catch(e){}
  state.dataStale = false;
  renderRoute();
  showToast(toastMsg);
}

function _doSaveAttempt(attempt, payload, sess){
  if(!_sessAlive(sess)) return;
  // リトライ中もローディングを継続表示（試行回数を明示し、途切れさせない）
  showLoading(attempt>0 ? ('保存中...（再送 '+attempt+'/'+(SAVE_MAX_ATTEMPTS-1)+'）') : '保存中...');
  var dataStr = encodeURIComponent(JSON.stringify(payload));
  // 日付キー廃止：saveHaitatsu は常に最新1セットを店舗名キーで upsert
  // _cb: キャッシュバスター。Google 側リダイレクト状態のリフレッシュを促し 404 を軽減
  var url = API_URL+'?action=saveHaitatsu&data='+dataStr+'&_cb='+Date.now()+'_'+attempt;
  jsonp(url, 'cb_save', function(res){
    if(!_sessAlive(sess)) return;
    if(res && res.success){
      _saveSucceeded2(sess, payload, attempt>0 ? ('✅ 保存しました（再送'+attempt+'回で成功）') : '✅ 保存しました（'+res.saved+'件）');
    } else if(res && res.retryable){
      // GAS 側が ScriptLock を取れなかった（他の処理と競合）。
      // 書き込みは行われていないので確認を挟まず、短い間隔ですぐ再送する。
      _retryOrGiveUp(attempt, payload, 'サーバ混雑', sess);
    } else {
      // GAS が応答した success:false はデータ起因（invalid data 等）で、
      // 同じ data を再送しても結果は変わらないため即エラー表示（無駄な再送を避ける）。
      _sessEnd(sess);
      hideLoading();
      alert('保存に失敗しました\n'+((res&&res.error)||'')+'\nもう一度お試しください。');
    }
  }, function(){
    // タイムアウト or 通信失敗。JSONP はキャンセルできないのでサーバ側では
    // 書き込みが成立している可能性がある。再送の前に必ず確認する。
    if(!_sessAlive(sess)) return;
    _verifyThenRetry(attempt, payload, '応答待ち切れ', sess);
  }, SAVE_TIMEOUT, {
    lateGraceMs: SAVE_LATE_GRACE,
    // 見切った後に本来の応答が届いた場合。成功していれば即確定し、
    // 進行中の確認・再送を全部止める（2〜3分コースに入るのを防ぐ主役）。
    onLate: function(res){
      if(!_sessAlive(sess)) return;
      if(res && res.success){
        _saveSucceeded2(sess, payload, '✅ 保存しました（応答が遅れて到着）');
      }
    }
  });
}

// 失敗検知後：サーバに実際に保存されたかを確認し、
//   保存済み → 成功扱い（誤った失敗表示と無駄な再送を止める）
//   未保存   → 残り試行があれば再送、無ければ入力を退避して案内
function _verifyThenRetry(attempt, payload, reason, sess){
  if(!_sessAlive(sess)) return;
  showLoading('保存を確認中...');
  _sessTimer(sess, function(){
    jsonp(API_URL+'?action=getHaitatsu&_cb='+Date.now(), 'cb_verify', function(res){
      if(!_sessAlive(sess)) return;
      if(res && res.success && _payloadMatches(res.items, payload)){
        _saveSucceeded2(sess, payload, '✅ 保存されていました（サーバで確認）');
        return;
      }
      _retryOrGiveUp(attempt, payload, reason, sess);
    }, function(){
      // 確認自体も失敗 → 保存できたか不明。再送で確定させる
      if(!_sessAlive(sess)) return;
      _retryOrGiveUp(attempt, payload, reason, sess);
    }, VERIFY_TIMEOUT, {
      lateGraceMs: SAVE_LATE_GRACE,
      onLate: function(res){
        if(!_sessAlive(sess)) return;
        if(res && res.success && _payloadMatches(res.items, payload)){
          _saveSucceeded2(sess, payload, '✅ 保存されていました（確認応答が遅れて到着）');
        }
      }
    });
  }, VERIFY_WAIT);
}

function _retryOrGiveUp(attempt, payload, reason, sess){
  if(!_sessAlive(sess)) return;
  // 全体締切を超えていたら、残り試行があっても待たせない。
  // 入力は退避済みで、この後もバックグラウンド再確認と再送導線が効く。
  if(attempt < SAVE_MAX_ATTEMPTS-1 && _elapsed(sess) < SAVE_DEADLINE){
    showLoading('保存中...（再送 '+(attempt+1)+'/'+(SAVE_MAX_ATTEMPTS-1)+'）');
    _sessTimer(sess, function(){ _doSaveAttempt(attempt+1, payload, sess); }, SAVE_RETRY_WAIT);
  } else {
    _giveUpToBanner(payload, reason, sess);
  }
}

// 見切り。入力は退避済みなので失われない。以降はバックグラウンドで
// 「実は保存されていた」を拾いにいき、拾えたらバナーを自動で消す。
function _giveUpToBanner(payload, reason, sess){
  _sessEnd(sess);
  hideLoading();
  _writePending(payload);
  _updatePendingBanner();
  _scheduleRecheck(payload);
  alert('保存の確認が取れませんでした（'+reason+'）。\n'
    +'入力内容は端末に保存してあります。サーバ側で保存が成立していれば\n'
    +'まもなく自動で解消されます。解消されない場合は画面上部の\n'
    +'「未送信の入力があります」から再送してください。');
}

// バナーへ倒した後の自動再確認。GAS の応答が数十秒遅れて成立するケースを
// ユーザーの操作なしで回収する（配達員・担当者を待たせない）。
var _recheckTimers = [];
function _scheduleRecheck(payload, delaysMs){
  _recheckTimers.forEach(function(h){ clearTimeout(h); });
  _recheckTimers = (delaysMs || SAVE_RECHECK_MS).map(function(ms){
    return setTimeout(function(){
      if(!_readPending()) return;   // 既に解消済み
      jsonp(API_URL+'?action=getHaitatsu&_cb='+Date.now(), 'cb_recheck', function(res){
        if(!_readPending()) return;
        if(!(res && res.success && _payloadMatches(res.items, payload))) return;
        _clearPending();
        try { localStorage.setItem(LS_HAITATSU_LATEST, JSON.stringify(payload)); } catch(e){}
        // 画面状態の更新は初期ロード完了後だけ（読み込み中に横入りして
        // 描画を壊さないようにする）。未完了ならバナー解消のみで十分。
        if(state && state.data){
          state.dirty = false;
          state.origData = JSON.parse(JSON.stringify(payload));
          state.lastUpdated = _nowStamp();
          _writeCache({ items: payload, lastUpdated: state.lastUpdated });
          renderRoute();
        }
        showToast('✅ 保存が確認できました');
      }, function(){}, VERIFY_TIMEOUT);
    }, ms);
  });
}

// セッション付きの成功確定。二重確定を防ぎつつ既存の成功処理へ委譲する。
function _saveSucceeded2(sess, payload, msg){
  _sessEnd(sess);
  _recheckTimers.forEach(function(h){ clearTimeout(h); });
  _recheckTimers = [];
  _saveSucceeded(payload, msg);
}

// ---- 未送信入力の退避と再送導線 ----
function _writePending(payload){
  try {
    localStorage.setItem(LS_HAITATSU_PENDING, JSON.stringify({ items: payload, at: _nowStamp() }));
  } catch(e){}
}
function _clearPending(){
  try { localStorage.removeItem(LS_HAITATSU_PENDING); } catch(e){}
  var el = document.getElementById('pending_notice');
  if(el && el.parentNode) el.parentNode.removeChild(el);
}
function _readPending(){
  try {
    var raw = localStorage.getItem(LS_HAITATSU_PENDING);
    if(!raw) return null;
    var o = JSON.parse(raw);
    return (o && o.items) ? o : null;
  } catch(e){ return null; }
}
function _updatePendingBanner(){
  var p = _readPending();
  var el = document.getElementById('pending_notice');
  if(!p){ if(el && el.parentNode) el.parentNode.removeChild(el); return; }
  if(!el){
    el = document.createElement('div');
    el.id = 'pending_notice';
    el.style.cssText = 'background:#fdecea;color:#b71c1c;border:1px solid #ef9a9a;border-radius:8px;padding:8px 10px;margin:0 16px 8px;font-size:12px;text-align:center;font-weight:600';
    var app = document.getElementById('app');
    if(app && app.parentNode) app.parentNode.insertBefore(el, app);
  }
  el.innerHTML = '⚠️ 未送信の入力があります（'+eH(p.at||'')+'）'
    +' <button onclick="resendPending()" style="margin-left:6px;background:#b71c1c;color:#fff;border:none;border-radius:6px;padding:5px 12px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer">再送する</button>'
    +' <button onclick="discardPending()" style="margin-left:4px;background:none;border:1px solid #ef9a9a;border-radius:6px;padding:5px 10px;font-family:inherit;font-size:12px;color:#b71c1c;cursor:pointer">破棄</button>';
}
function resendPending(){
  var p = _readPending();
  if(!p){ _updatePendingBanner(); return; }
  state.data = _purgeStaleExtras(JSON.parse(JSON.stringify(p.items)));
  state.dirty = true;
  renderRoute();
  doSave();
}
function discardPending(){
  if(!confirm('未送信の入力を破棄します。よろしいですか？')) return;
  _clearPending();
  showToast('未送信の入力を破棄しました');
}

// ============ SWR初期読み込み ============
// 読み込み優先順位:
//   1. localStorage（あれば即座に描画。0秒表示）
//   2. スナップショット（GCS配信、~200ms、CORS対応）
//      - generated_at が SNAPSHOT_MAX_AGE_MS 以内なら採用
//   3. GAS 直接（最終手段、コールドスタート10秒スパイクの影響を受ける）
// いずれのパスも成功時に localStorage を更新する（次回0秒表示のため）。
var _haitatsuRetries = 0;
function forceReload(){ location.reload(); }

function _readCache(){
  try {
    var raw = localStorage.getItem(LS_HAITATSU_CACHE);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || typeof o !== 'object') return null;
    return o;
  } catch(e){ return null; }
}
function _writeCache(payload){
  try {
    var o = {
      items:       payload.items || {},
      lastUpdated: payload.lastUpdated || '',
      cachedAt:    Date.now()
    };
    localStorage.setItem(LS_HAITATSU_CACHE, JSON.stringify(o));
  } catch(e){ /* 容量超等は無視 */ }
}

function _applyHaitatsuData(items, lastUpdated){
  // 臨時品目は「その日限り」。前日以前の指示は読み込み時点で落とす
  // （＝翌日以降に自動で持ち越さない。残在庫の参照表示は zaikoExtras 側で継続）。
  state.data = _purgeStaleExtras(items || {});
  state.lastUpdated = lastUpdated || '';
  state.origData = JSON.parse(JSON.stringify(state.data));
  state.loaded = true;
  renderRoute();
}

// lastUpdated('yyyy-MM-dd HH:mm:ss')を比較可能なミリ秒に変換。空/不正は0。
function _luMs(lu){
  if(!lu) return 0;
  var t = Date.parse(String(lu).replace(' ','T'));
  return isNaN(t) ? 0 : t;
}
// 鮮度ガード：現在表示中(state.lastUpdated)より新しいデータの場合のみ差し替える。
//  - 一度も描画していない(!state.loaded)場合は無条件採用（初回表示）。
//  - 編集中(dirty)は入力を失わないよう一切上書きしない。
//  - 採用時はlocalStorageキャッシュも更新（次回0秒表示 & 以後の上書きガードの基準）。
// これにより generated_at が新しくても lastUpdated が古いスナップショットが、
// 新しいlocalStorage/表示中データを上書きするバグを防ぐ。
function _applyIfNewer(items, lastUpdated){
  if(state.dirty) return false;
  if(!state.loaded || _luMs(lastUpdated) > _luMs(state.lastUpdated)){
    _applyHaitatsuData(items, lastUpdated);
    _writeCache({ items: items, lastUpdated: lastUpdated });
    return true;
  }
  return false;
}

function _updateStaleBanner(msg){
  var el = document.getElementById('stale_notice');
  if(!msg){
    if(el) el.parentNode.removeChild(el);
    return;
  }
  if(!el){
    el = document.createElement('div');
    el.id = 'stale_notice';
    el.style.cssText = 'background:#fff3e0;color:#e65100;border:1px solid #ffb74d;border-radius:8px;padding:6px 10px;margin:0 16px 8px;font-size:12px;text-align:center;font-weight:600';
    var app = document.getElementById('app');
    if(app && app.parentNode) app.parentNode.insertBefore(el, app);
  }
  el.textContent = msg;
}

function _fetchSnapshot(cb){
  // キャッシュバスターで CDN/ブラウザキャッシュを回避
  var url = SNAPSHOT_URL + '?_=' + Date.now();
  fetch(url, { cache: 'no-store' }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(j){
    if(!j || !j.generated_at){ cb(null); return; }
    var gen = Date.parse(j.generated_at);
    if(isNaN(gen)){ cb(null); return; }
    if(Date.now() - gen > SNAPSHOT_MAX_AGE_MS){
      // 古すぎる → 使わない（配達員が古いデータを新しいと誤認するのを防止）
      cb(null, { tooOld: true, generated_at: j.generated_at });
      return;
    }
    cb({ items: j.items||{}, lastUpdated: j.lastUpdated||'', generated_at: j.generated_at });
  }).catch(function(){ cb(null); });
}

function _fetchFromGas(onDone){
  // GAS直取得（コールドスタート考慮で1回自動リトライ）
  jsonp(API_URL+'?action=getHaitatsu','cb_get',function(res){
    if(res && res.success){
      onDone({ items: res.items||{}, lastUpdated: res.lastUpdated||'' });
    } else {
      onDone(null);
    }
  },function(){
    if(_haitatsuRetries===0){
      _haitatsuRetries++;
      setTimeout(function(){ _fetchFromGas(onDone); }, 2000);
    } else {
      onDone(null);
    }
  });
}

function loadInitial(){
  var cache = _readCache();
  // レガシーキーからのマイグレーション（旧`haitatsu_latest`しか持たない端末のため）
  if(!cache){
    try {
      var legacy = localStorage.getItem(LS_HAITATSU_LATEST);
      if(legacy){
        var items = JSON.parse(legacy) || {};
        cache = { items: items, lastUpdated: '', cachedAt: 0 };
      }
    } catch(e){}
  }

  // Step 1: キャッシュ即描画（0秒表示）
  var haveDisplay = false;
  if(cache){
    _applyHaitatsuData(cache.items, cache.lastUpdated);
    _updateStaleBanner('🔄 最新確認中…');
    state.dataStale = true;
    haveDisplay = true;
  }

  // Step 2: スナップショット試行（鮮度ガード付き）。
  //   generated_at はスナップショット自体の鮮度(6h以内か)判定にのみ使う（_fetchSnapshot内）。
  //   採用可否は lastUpdated 比較で決める（_applyIfNewer）ので、generated_atが新しくても
  //   lastUpdatedが古いスナップショットは新しい表示中/localStorageデータを上書きしない。
  _fetchSnapshot(function(snap, meta){
    if(snap){
      _applyIfNewer(snap.items, snap.lastUpdated);
      haveDisplay = true;
    }
    if(haveDisplay){
      // 即表示できている → 「確認中」は消す。GASは裏で静かに正として確認する
      //（配達員の体感速度を悪化させない）。
      _updateStaleBanner(null);
      state.dataStale = false;
    }
    // Step 3: GASを正として裏で必ず確認（SWR完成形）。
    //   スナップショット採否に関わらず実行。lastUpdatedがより新しければ差し替え＆キャッシュ更新。
    //   これで他端末の最新保存も次のスナップショット生成を待たず反映される。
    //   GASが遅い/失敗しても表示は既に出ているため体感速度は悪化しない。失敗時は静かに諦める
    //  （「最終更新 ◯月◯日 ◯時」の鮮度表示は last-upd 表示として維持される）。
    _fetchFromGas(function(gres){
      if(gres){
        _applyIfNewer(gres.items, gres.lastUpdated);
        _updateStaleBanner(null);
        state.dataStale = false;
        return;
      }
      // GAS失敗
      if(!haveDisplay){
        // キャッシュもスナップショットも無い→空描画（renderRoute内の「未入力」表示に任せる）
        _applyHaitatsuData({}, '');
        _updateStaleBanner('⚠️ サーバ接続失敗。しばらく待って再読み込みしてください。');
      }
      // haveDisplay時は静かに諦める（既に表示済み・鮮度表示は維持）
    });
  });
  // 【2026-08-12 変更】臨時品目の残在庫/販売数は閲覧モードでも表示するため、
  // 初期表示の裏で用意する（スナップショット優先。メイン表示はブロックしない）。
  if(_prepareZaiko()) _fetchZaiko(0);
}

// ============ 残在庫/販売数のSWRキャッシュ ============
// 値と「その値の参照日(actualDate)」をセットで保存する。参照日を必ず一緒に持つことで、
// キャッシュを表示している間も『いつ時点の値か』を正しく出せる（当日日付の誤表示を防ぐ）。
// 何日も前の値を出し続けないよう保存から7日で破棄する。日付ベースの足切りはしないので、
// 「当日データが現れるまで前日値を出し続ける」既存要件は壊さない。
var ZAIKO_CACHE_MAX_AGE_MS = 7 * 24 * 3600 * 1000;
function _readZaikoCache(){
  try {
    var raw = localStorage.getItem(LS_ZAIKO_CACHE);
    if(!raw) return null;
    var o = JSON.parse(raw);
    if(!o || typeof o !== 'object' || !o.items || !o.dataDate) return null;
    if(!_zaikoItemsHaveValues(o.items)) return null;          // 空キャッシュは使わない
    if(!o.cachedAt || (Date.now() - o.cachedAt) > ZAIKO_CACHE_MAX_AGE_MS) return null;
    return o;
  } catch(e){ return null; }
}
// 有効判定は従来どおり既存4価格(items)だけで行う。臨時(extras)は付随データとして
// 一緒に保存するだけで、キャッシュ/スナップショットの採否には関与させない
// （extras の有無で判定を変えると 2026-07-22 の「空スナップショット採用」型の
//   回帰を作りかねないため）。
function _writeZaikoCache(items, dataDate, extras){
  try {
    if(!dataDate || !_zaikoItemsHaveValues(items)) return;    // 空は保存しない
    localStorage.setItem(LS_ZAIKO_CACHE, JSON.stringify({
      items: items, extras: extras || {}, dataDate: dataDate, cachedAt: Date.now()
    }));
  } catch(e){ /* 容量超等は無視 */ }
}

// 取得成功時の共通適用。state更新＋キャッシュ書き込み＋再描画。
function _applyZaiko(items, dataDate, extras){
  state.zaiko = items || {};
  state.zaikoExtras = extras || {};
  state.zaikoDataDate = dataDate || todayStr;
  state.zaikoLoaded = true;
  state.zaikoLoading = false;
  state.zaikoFromCache = false;
  state.zaikoError = false;
  _writeZaikoCache(state.zaiko, state.zaikoDataDate, state.zaikoExtras);
  if(state.loaded) renderRoute();
}
// 取得失敗（スナップショットもGASもダメ）。キャッシュ表示中ならその値と参照日は
// そのまま維持して「更新失敗」を添える。何も出せていなければ失敗を明示する
// （黙って「-」＝値なし表示に戻さない）。
function _zaikoFailed(){
  state.zaikoLoading = false;
  state.zaikoError = true;
  if(state.loaded) renderRoute();
}

// 残在庫/販売数を取得。
// 優先順位:
//   0. localStorage キャッシュ（_prepareZaiko で描画前に適用。0秒表示）
//   1. GCS zaiko.json（generated_atが6時間以内で、date=todayStr、値が非空なら採用。~200ms）
//   2. GAS getYaokoZaiko（フォールバック。温まっていれば1.5〜2秒、コールドスタート時は10秒超）
// 残在庫は補助情報なのでメイン表示はブロックしない。
function _fetchZaiko(attempt){
  // Step 1: スナップショット試行（初回のみ。attempt>0 は GAS リトライ）
  if(attempt === 0){
    _fetchZaikoSnapshot(function(snap){
      if(snap){
        _applyZaiko(snap.items || {}, snap.actualDate || todayStr, snap.extras || {});
        return;
      }
      // スナップショット失敗（無し・古い・空・fetch失敗）→ GAS直取得
      _fetchZaikoGas(0);
    });
    return;
  }
  _fetchZaikoGas(attempt);
}

// zaiko スナップショットの items に「実データ」が1件でも入っているか。
// 重要: items は {} でも truthy なので、存在チェック(!j.items)では空を弾けない。
//   Cloud Run の早朝実行(4:30)は当日データが未収集のため items={} を書き出す。
//   これを有効なスナップショットとして採用すると、GAS の直近日フォールバックへ
//   落ちず「残:-／売:-」になる（2026-07-22 早朝の障害）。
// 判定はキーの存在ではなく「値が有効か」で行う。店舗×価格のいずれかに
//   hasSales=true または zan/tenpo/sales のいずれかが非0 があれば実データとみなす。
//   全店・全価格が 0 かつ hasSales=false（＝行はあるが値が空）も無効扱いにする。
function _zaikoItemsHaveValues(items){
  if(!items || typeof items !== 'object') return false;
  var stores = Object.keys(items);
  for(var i=0;i<stores.length;i++){
    var per = items[stores[i]];
    if(!per || typeof per !== 'object') continue;
    for(var pi=0;pi<YAOKO_PRICES.length;pi++){
      var e = per[YAOKO_PRICES[pi]];
      if(!e || typeof e !== 'object') continue;
      if(e.hasSales === true) return true;
      if((parseInt(e.zan,10)||0) !== 0) return true;
      if((parseInt(e.tenpo,10)||0) !== 0) return true;
      if((parseInt(e.sales,10)||0) !== 0) return true;
    }
  }
  return false;
}

// GCSからzaiko.jsonを取得。dateが今日・items が非空・generated_atが6h以内なら採用。
// 空判定は鮮度判定より前に行う（空スナップショットは「新しくても」常に無効）。
function _fetchZaikoSnapshot(cb){
  var url = ZAIKO_SNAPSHOT_URL + '?_=' + Date.now();
  fetch(url, { cache: 'no-store' }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(j){
    if(!j || !j.generated_at || !j.items){ cb(null); return; }
    // 値ベースの非空判定。空なら鮮度に関わらず GAS 直近日フォールバックへ。
    if(!_zaikoItemsHaveValues(j.items)){ cb(null); return; }
    // extras キーが無いスナップショットは「臨時品目に未対応の古い生成元」が
    // 書いたもの。採用すると臨時の残在庫/販売数が空のまま固定されてしまうので、
    // 鮮度に関わらず GAS 直取得へ倒す（生成元が更新されれば自動で解消する）。
    if(!j.extras || typeof j.extras !== 'object'){ cb(null); return; }
    // date が今日と一致することを厳密確認（日付が変わったら snapshotが古い）
    if(j.date && j.date !== todayStr){ cb(null); return; }
    var gen = Date.parse(j.generated_at);
    if(isNaN(gen) || Date.now() - gen > SNAPSHOT_MAX_AGE_MS){ cb(null); return; }
    // actualDate: 実際にどの日付の値か（当日に実データが無ければ前日等）。参照日表示に使う。
    cb({ items: j.items, extras: j.extras || {}, generated_at: j.generated_at,
         actualDate: j.actualDate || j.date || todayStr });
  }).catch(function(){ cb(null); });
}

// GAS直取得（従来の実装。SWR失敗時のフォールバック）。
function _fetchZaikoGas(attempt){
  jsonp(API_URL+'?action=getYaokoZaiko&date='+encodeURIComponent(todayStr),
    attempt>0 ? 'cb_zaiko_retry' : 'cb_zaiko',
    function(res){
      if(res && res.success && res.items && !res._pending){
        _applyZaiko(res.items, res.actualDate || res.date || todayStr, res.extras || {});
        return;
      }
      // _pending: サーバが getAllData フル計算中。1回だけ4秒後に再取得。
      if(attempt===0 && res && res._pending){
        setTimeout(function(){ _fetchZaikoGas(1); }, 4000);
        return;
      }
      _zaikoFailed();
    },
    function(){ _zaikoFailed(); }
  );
}

renderRouteTabs();
loadInitial();
// 端末に退避された未送信入力があれば再送導線を出す。
// ただし退避は「送信を始める前」に書くので、保存中にリロード・タブ復帰した場合は
// 実際には保存が成立していることがある。まずサーバへ確認し、一致していれば
// バナーを出さずに黙って解消する（誤った未送信表示で不安にさせない）。
_updatePendingBanner();
(function(){
  var p = _readPending();
  if(p && p.items) _scheduleRecheck(p.items, [300, 6000, 15000]);
})();
</script>
