<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>【TEST】配達日報 | 栄ガーデン</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
/* ==========================================================
   デザイン統一版：使用色は3色まで
   - 黒/グレー：文字・数値・枠線（基本すべて）
   - 緑 (--green)：主要操作ボタンのみ（送信・追加）
   - 赤 (--red)：値引き列のみ
   カード：白背景・薄いグレー枠1px・角丸12px・共通padding
   ========================================================== */
:root {
  --bg:#f5f3ee; --card:#fff;
  --ink:#1c1c1e; --sub:#6c6c70;
  --border:#e5e1d8; --shadow:0 2px 12px rgba(0,0,0,0.06);
  --green:#2d7a4f;     /* 主要操作 */
  --red:#c0392b;       /* 値引き（表・確認画面では未使用。マニュアル説明のみ） */
  --accent-amber:#c9770a; /* 値引きタイミング表示 2日目のみ */
  --divider:#c9c1b0;   /* 表内の縦区切り線 */
  --r:12px;            /* カード角丸統一 */
  --r-btn:8px;         /* ボタン角丸統一 */
  --pad-card:14px;     /* カード内側余白統一 */
  /* 送信完了確認画面（サマリー風パレット） */
  --sum-light:#f0ebe0; --sum-rule:#d4c9b0; --sum-dot:#e0d9cc;
  --sum-yellow-lbl:#f57f17; --sum-purple:#7b1fa2; --sum-cyan:#0097a7;
  --sum-yellow-bg:#fffde7; --sum-yellow-bd:#f9a825;
  --sum-extra-bg:#fff8e1; --sum-extra-ink:#e65100;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);max-width:480px;margin:0 auto;padding-bottom:60px}

/* ============ ヘッダー ============ */
.hdr{background:var(--ink);color:#fff;padding:14px 18px 0;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:.04em}
.hdr-date{font-size:11px;color:#aaa;margin-top:-6px;padding-bottom:10px;padding-left:2px}
.back-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:var(--r-btn);padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.route-tabs{display:flex;gap:6px;padding:0 0 12px}
.rtab{flex:1;padding:8px 4px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border-radius:var(--r-btn)}
.rtab.active{background:#fff;color:var(--ink)}

/* ============ 画面共通 ============ */
.screen{padding:16px}
.sec-lbl{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:16px 0 8px 2px}
.sec-lbl:first-child{margin-top:4px}

/* ============ ホーム: 店舗リスト（色付き左border廃止） ============ */
.store-list{display:flex;flex-direction:column;gap:8px}
.store-btn{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 16px;cursor:pointer;width:100%;text-align:left;font-family:inherit;box-shadow:var(--shadow);transition:transform .1s}
.store-btn:active{transform:scale(.98)}
.store-btn.yaoko,.store-btn.choku,.store-btn.others{border-left:1px solid var(--border)}
.si{font-size:22px;margin-right:12px}.sinfo{flex:1}
.sname{font-size:15px;font-weight:600;color:var(--ink)}.ssub{font-size:11px;color:var(--sub);margin-top:1px}
.sarr{font-size:18px;color:#ccc}

/* ============ ホーム: アクションボタン ============ */
.action-row{display:flex;gap:10px;margin-bottom:10px}
.action-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-btn);padding:12px 10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);box-shadow:var(--shadow);transition:transform .1s}
.action-btn:active{transform:scale(.97)}.a-icon{font-size:20px}
.summary-link-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border-radius:var(--r-btn);padding:13px 16px;text-decoration:none;font-size:15px;font-weight:700;letter-spacing:.04em;margin-bottom:10px;box-shadow:var(--shadow);transition:opacity .15s}
.summary-link-btn:active{opacity:.8}

/* ============ 副次操作ボタン（保存データを読み込む） ============ */
.load-btn{width:100%;padding:11px;background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:var(--r-btn);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;letter-spacing:.02em;transition:opacity .15s;box-shadow:var(--shadow)}
.load-btn:active{opacity:.7}
.load-btn:disabled{opacity:.4;cursor:not-allowed}

/* ============ カード（統一）: fsec/staff-sec/extra-mgr/dg-wrap/itbl-wrap 全部同じ ============ */
.fsec,.staff-sec,.extra-mgr,.dg-wrap,.itbl-wrap{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  margin-bottom:10px;
  box-shadow:var(--shadow);
}
.fsec,.extra-mgr,.dg-wrap,.itbl-wrap{overflow:hidden}

/* カードヘッダー（色分け廃止・全てグレー系文字） */
.fsec-hdr{padding:10px var(--pad-card);font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;background:transparent;color:var(--ink);border-bottom:1px solid var(--border)}
.fsec-hdr.green,.fsec-hdr.blue,.fsec-hdr.brown,.fsec-hdr.yellow,.fsec-hdr.purple{background:transparent;color:var(--ink)}
.fsec-hdr .note{font-size:11px;font-weight:400;color:var(--sub)}

/* 主要操作ボタン（apply-btn = 陳列反映 / add = ＋追加）: 緑 */
.apply-btn{background:var(--green);color:#fff;border:none;border-radius:var(--r-btn);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity .15s}
.apply-btn:active{opacity:.7}
@keyframes flash{0%{background:#e6f5ec}100%{background:transparent}}
.flashed .fsec-hdr{animation:flash .7s ease-out}

/* ============ frow（レガシー1項目セクション）用 ============ */
.frow{display:flex;align-items:center;padding:10px var(--pad-card);border-bottom:1px solid var(--border)}
.frow:last-child{border-bottom:none}
.frow-lbl{flex:1;font-size:14px;color:var(--ink)}
.frow-inp{display:flex;align-items:center;gap:5px}
.frow input[inputmode="numeric"]{width:80px;height:40px;border:1px solid var(--border);border-radius:var(--r-btn);text-align:center;font-size:18px;font-weight:600;font-family:inherit;color:var(--ink);background:#fff;-moz-appearance:textfield}
.frow input::-webkit-inner-spin-button,.frow input::-webkit-outer-spin-button{-webkit-appearance:none}
.frow input:focus{outline:none;border-color:var(--ink)}
.frow textarea{width:100%;border:1px solid var(--border);border-radius:var(--r-btn);padding:10px 12px;font-size:14px;font-family:inherit;color:var(--ink);background:#fff;resize:vertical;min-height:70px}
.frow textarea:focus{outline:none;border-color:var(--ink)}
.frow-unit{font-size:11px;color:var(--sub)}
.frow.extra{background:transparent}
.frow.extra .frow-lbl{color:var(--ink);font-weight:600}

/* ============ 商品追加（extra-mgr）: 黄色点線廃止・白カードに統一 ============ */
.extra-mgr-hdr{padding:10px var(--pad-card);background:transparent;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.extra-mgr-add{background:var(--green);color:#fff;border:none;border-radius:var(--r-btn);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity .15s}
.extra-mgr-add:active{opacity:.7}
.extra-mgr-body{padding:10px var(--pad-card)}
.extra-mgr-empty{font-size:12px;color:var(--sub);font-style:italic}
/* 商品追加の金額入力モーダル（数字テンキー対応） */
.price-modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.price-modal{background:#fff;border-radius:var(--r);padding:20px;width:100%;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.price-modal-ttl{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px}
.price-modal-inp{width:100%;height:48px;border:1.5px solid var(--border);border-radius:var(--r-btn);text-align:center;font-size:22px;font-weight:700;font-family:inherit;color:var(--ink);box-sizing:border-box}
.price-modal-inp:focus{outline:none;border-color:var(--green)}
.price-modal-btns{display:flex;gap:10px;margin-top:16px}
.price-modal-btns button{flex:1;height:44px;border:none;border-radius:var(--r-btn);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.price-modal-cancel{background:#eee;color:var(--sub)}
.price-modal-ok{background:var(--green);color:#fff}
.price-modal-ok:active,.price-modal-cancel:active{opacity:.7}
.extra-chips{display:flex;flex-wrap:wrap;gap:6px}
.extra-chip{display:inline-flex;align-items:center;gap:4px;background:#f5f5f5;border:1px solid var(--border);border-radius:20px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.extra-chip-del{background:none;border:none;color:#999;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;font-family:inherit}
.extra-chip-del:hover{color:var(--ink)}

/* ============ chin-sec（旧陳列自動計算・現行未使用の可能性・念のため中立化） ============ */
.chin-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.chin-hdr{padding:10px var(--pad-card);background:transparent;color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.02em;border-bottom:1px solid var(--border)}
.chin-row{display:flex;align-items:center;padding:9px var(--pad-card);border-bottom:1px solid var(--border)}
.chin-row:last-child{border-bottom:none}
.chin-row.extra{background:transparent}
.chin-row.extra .chin-lbl{color:var(--ink);font-weight:600}
.chin-lbl{flex:1;font-size:14px;color:var(--ink)}
.chin-val{font-size:20px;font-weight:700;color:var(--ink);min-width:48px;text-align:right}
.chin-unit{font-size:11px;color:var(--sub);margin-left:4px}

/* ============ 担当者選択 ============ */
.staff-sec{padding:13px var(--pad-card)}
.staff-lbl{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px;letter-spacing:.04em}
.staff-btns{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{padding:8px 16px;border-radius:20px;border:1px solid var(--border);background:#fff;font-family:inherit;font-size:14px;cursor:pointer;transition:all .15s;color:var(--ink)}
.sbtn.sel{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ============ 主要操作: 送信ボタン（緑） ============ */
.submit-btn{width:100%;padding:15px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;letter-spacing:.04em;transition:opacity .15s;box-shadow:var(--shadow)}
.submit-btn:active{opacity:.8}.submit-btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ 送信完了画面 ============ */
.done-screen{text-align:center;padding:60px 20px}
.done-icon{font-size:64px;margin-bottom:16px}
.done-title{font-size:22px;font-weight:700;margin-bottom:8px}
.done-sub{font-size:14px;color:var(--sub);margin-bottom:32px;line-height:1.7}
.home-btn{background:var(--ink);color:#fff;border:none;border-radius:var(--r-btn);padding:14px 32px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}

/* ============ 送信完了 確認テーブル: サマリー風デザイン（値引きは黒に統一） ============ */
.done-confirm-wrap{margin:8px 0 28px;text-align:left;padding:0 4px}
.done-confirm-title{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin-bottom:8px;text-align:center}
.dc-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--sum-rule);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.dc-table th{padding:5px 6px;background:var(--sum-light);font-size:10px;font-weight:700;color:#666;letter-spacing:.06em;text-align:center;border-bottom:2px solid var(--sum-rule)}
.dc-table th:first-child{text-align:left;padding-left:12px}
.dc-table td{padding:6px 6px;border-bottom:1px dotted var(--sum-dot);text-align:center;vertical-align:middle}
.dc-table td:first-child{text-align:left;padding-left:12px;font-size:12px;color:#555;white-space:nowrap}
.dc-table tr:last-child td{border-bottom:none}
/* 値の色: 陳列=山吹、蘇生=紫、店頭=シアン。値引きと納品は黒（値引き赤字廃止） */
.dc-nouhin,.dc-chin,.dc-sosei,.dc-tenpo,.dc-nebiki{font-size:15px;font-weight:700}
.dc-nouhin{color:var(--ink)}
.dc-chin{color:var(--sum-yellow-lbl)}
.dc-sosei{color:var(--sum-purple)}
.dc-tenpo{color:var(--sum-cyan)}
.dc-nebiki{color:var(--ink)}
.dc-extra{background:var(--sum-extra-bg)}
.dc-extra td:first-child{color:var(--sum-extra-ink);font-weight:700}
.dc-total{background:var(--sum-yellow-bg);font-weight:700;border-top:2px solid var(--sum-yellow-bd)!important}
.dc-total td:first-child{font-weight:700;color:var(--ink)}

/* ============ マニュアル・設定 ============ */
.manual{padding:16px}
.manual h2{font-size:16px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.manual h3{font-size:14px;font-weight:700;margin:16px 0 6px;color:var(--ink)}
.manual p{font-size:13px;color:#444;line-height:1.8;margin-bottom:6px}
.manual-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;margin-bottom:4px;background:#f0f0f0;color:var(--ink)}
.mb-green,.mb-blue,.mb-brown,.mb-yellow,.mb-purple,.mb-orange{background:#f0f0f0;color:var(--ink)}
.manual-tip{background:#f8f7f2;border-left:3px solid var(--border);border-radius:0 var(--r-btn) var(--r-btn) 0;padding:10px 12px;font-size:13px;color:#333;margin:10px 0;line-height:1.7}
.settings{padding:16px}
.settings h2{font-size:16px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.settings-sec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.settings-sec-hdr{padding:10px var(--pad-card);background:#f8f7f2;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em}
.settings-item{display:flex;align-items:center;padding:10px var(--pad-card);border-bottom:1px solid var(--border);gap:10px}
.settings-item:last-child{border-bottom:none}
.settings-item label{flex:1;font-size:13px}
.settings-item input[type=text]{flex:2;border:1px solid var(--border);border-radius:var(--r-btn);padding:6px 10px;font-size:13px;font-family:inherit}
.settings-item input:focus{outline:none;border-color:var(--ink)}
.staff-list-edit{padding:12px var(--pad-card)}
.staff-tag-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.staff-tag{display:flex;align-items:center;gap:4px;background:#f5f5f5;border-radius:20px;padding:4px 10px 4px 12px;font-size:13px}
.staff-tag-del{background:none;border:none;color:#999;cursor:pointer;font-size:16px;line-height:1;padding:0}
.staff-add-row{display:flex;gap:8px}
.staff-add-row input{flex:1;border:1px solid var(--border);border-radius:var(--r-btn);padding:8px 10px;font-size:14px;font-family:inherit}
.staff-add-row input:focus{outline:none;border-color:var(--ink)}
.add-btn{background:var(--green);color:#fff;border:none;border-radius:var(--r-btn);padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.save-btn{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.settings-msg{text-align:center;font-size:13px;padding:8px;color:var(--green);font-weight:600;display:none}

/* ============ ローディング ============ */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200}
.loading-box{background:#fff;border-radius:var(--r);padding:24px 32px;text-align:center;font-size:14px;font-weight:600}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #eee;border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 入力テーブル（メイン） ============ */
.itbl-wrap{overflow-x:auto}
.itbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.itbl th,.itbl td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--border)}
.itbl th{font-size:12px;font-weight:700;letter-spacing:.02em;position:sticky;top:0;z-index:1;background:#f8f7f2;color:var(--sub)}
.itbl .itbl-price{width:56px;font-size:13px;font-weight:700;color:var(--ink);background:#f8f7f2}
.itbl thead .itbl-price{color:var(--sub)}
/* 列ヘッダー：全てグレー統一（旧: 緑/青/紫/橙は廃止・値引き赤字も廃止） */
.itbl .itbl-col{color:var(--sub);background:#f8f7f2}
.itbl .itbl-col.ctl-red{color:var(--sub)}
/* 値引き列の左に縦区切り線（通常入力 | イレギュラー入力 の視覚分割） */
.itbl th.itbl-col.ctl-red,
.itbl td.itbl-cell.ctl-red{border-left:2px solid var(--divider)}
.itbl .itbl-cell{padding:4px 3px;background:#fff}
.itbl input[inputmode="numeric"]{
  width:100%;max-width:64px;height:42px;
  border:1px solid var(--border);border-radius:var(--r-btn);
  text-align:center;font-size:18px;font-weight:600;
  font-family:inherit;color:var(--ink);background:#fff;
  -moz-appearance:textfield;padding:0
}
.itbl input::-webkit-inner-spin-button,.itbl input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.itbl input:focus{outline:none;border-color:var(--ink)}
.itbl tr:last-child td{border-bottom:none}
.itbl .itbl-extra{background:transparent}
.itbl .itbl-extra .itbl-price{background:#f8f7f2;color:var(--ink)}
/* 値引き列の入力文字色も黒に統一（赤字廃止） */
.itbl td.itbl-cell.ctl-red input{color:var(--ink)}
/* 旧色分けクラス（ctl-green/blue/purple/orange/brown）は全て無色化 */
.ctl-green th.itbl-col.ctl-green,
.ctl-blue th.itbl-col.ctl-blue,
.ctl-purple th.itbl-col.ctl-purple,
.ctl-orange th.itbl-col.ctl-orange,
.ctl-brown th.itbl-col.ctl-brown{background:#f8f7f2;color:var(--sub)}
td.itbl-cell.ctl-green,
td.itbl-cell.ctl-blue,
td.itbl-cell.ctl-purple,
td.itbl-cell.ctl-orange,
td.itbl-cell.ctl-red,
td.itbl-cell.ctl-brown{background:#fff}

/* apply-mini（納品数を陳列数に一括反映）: 副次操作 = グレー */
.itbl-actions{display:flex;justify-content:flex-end;margin:8px 0 12px}
.apply-mini{background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:var(--r-btn);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
.apply-mini:active{opacity:.7}

/* ============ 値引きタイミング説明: 統一カード＋2日目黄・3日目赤アクセントのみ残す ============ */
.dg-wrap{padding:12px var(--pad-card)}
.dg-title{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.02em;margin-bottom:10px}
.dg-labels{display:flex;justify-content:center;gap:24px;margin-bottom:10px}
.dg-lbl-item{display:flex;flex-direction:column;align-items:center;gap:2px}
.dg-lbl-badge{font:800 22px/1 'Inter',system-ui,sans-serif;color:var(--ink);padding:3px 8px;letter-spacing:.02em}
.dg-lbl-badge.dg-boxed{border:2px solid var(--ink);border-radius:3px;padding:2px 7px}
.dg-lbl-caption{font-size:11px;color:var(--sub);font-weight:600}
.dg-lbl-caption.dg-warn{color:var(--accent-amber);font-weight:700}
.dg-timeline{display:flex;justify-content:space-between;gap:4px;padding-top:10px;border-top:1px solid var(--border)}
.dg-tl-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.dg-dot{width:12px;height:12px;border-radius:50%;margin-top:4px}
.dg-gray{background:#b0b0b0}
.dg-yellow{background:var(--accent-amber)}
.dg-red{background:var(--red)}
.dg-tl-day{font-size:10px;font-weight:700;color:var(--sub)}
.dg-tl-txt{font-size:10px;color:var(--ink);text-align:center;line-height:1.3}

/* ============ ラベル在庫アラート（②産地シール / ③値段シール） ============ */
.lbl-alert{background:#fff8e6;border:1px solid #f0c14b;border-left:4px solid #e6a817;
  border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.lbl-alert-ttl{font-size:13px;font-weight:700;color:#8a5a00;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.lbl-alert-msg{font-size:12px;color:#6b5300;line-height:1.6;margin-top:5px}
.lbl-alert-msg b{color:#c0392b;font-weight:700}
.lbl-issue-wrap{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.lbl-issue-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl-issue-row .lbl-issue-lbl{font-size:12px;font-weight:600;color:var(--ink);min-width:96px}
.lbl-issue-row .lbl-issue-sub{font-size:11px;color:var(--sub)}
.lbl-issue-row input[inputmode="numeric"]{width:72px;height:40px;border:1px solid var(--border);
  border-radius:var(--r-btn);text-align:center;font-size:17px;font-weight:600;font-family:inherit;color:var(--ink);background:#fff}
.lbl-issue-row input:focus{outline:none;border-color:var(--green)}
.lbl-issue-btn{background:var(--green);color:#fff;border:none;border-radius:var(--r-btn);
  padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:opacity .15s}
.lbl-issue-btn:active{opacity:.7}
.lbl-issue-btn:disabled{opacity:.45;cursor:default}
.lbl-issue-done{font-size:11px;color:var(--green);font-weight:700}
.lbl-alert-note{font-size:10px;color:#a08000;margin-top:8px;font-style:italic}
/* 任意発行（産地シール）: 常時表示・既定は閉じた状態 */
.lbl-manual{background:var(--card);border:1px solid var(--border);border-radius:var(--r-btn);
  box-shadow:var(--shadow);padding:10px 12px;margin-bottom:10px}
.lbl-manual-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lbl-manual-btn{background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.lbl-manual-btn:active{opacity:.6}
.lbl-manual-caret{display:inline-block;width:20px;text-align:center;font-weight:700;color:var(--green)}
.lbl-manual-stock{font-size:12px;color:var(--sub);white-space:nowrap}
.lbl-manual-stock b{font-size:14px;color:var(--ink);font-weight:700}
.lbl-manual-body{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.lbl-manual-note{font-size:10px;color:var(--sub);margin-top:8px;font-style:italic}

/* ============ レスポンシブ ============ */
@media (max-width: 360px){
  .itbl input[inputmode="numeric"]{max-width:56px;height:38px;font-size:16px}
  .itbl .itbl-price{width:48px;font-size:12px}
}
</style>

<!-- ▼▼▼ 【テスト環境】バナー（本番と誤認防止）▼▼▼ -->
<style>
  html { border-top: 6px solid #d93025 !important; }
  #__test_env_banner__ {
    position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
    background: #d93025; color: #fff; text-align: center;
    font: bold 13px/1.4 system-ui, -apple-system, sans-serif;
    padding: 4px 8px; letter-spacing: 0.05em;
    box-shadow: 0 2px 4px rgba(0,0,0,.3);
    pointer-events: none;
  }
  body { margin-top: 26px !important; }
</style>
<div id="__test_env_banner__">⚠️ テスト環境 - 本番ではありません（TEST）⚠️</div>
<!-- ▲▲▲ 【テスト環境】バナー ▲▲▲ -->


<div class="hdr">
  <div class="hdr-top">
    <h1 id="hTitle">🍄 配達日報</h1>
    <button class="back-btn" id="backBtn" style="display:none" onclick="goBack()">← 戻る</button>
  </div>
  <div class="hdr-date" id="hDate"></div>
  <!-- 経路タブは shared-stores.js の ROUTES から描画する（renderRouteTabs）。
       ラベルをここにベタ書きすると ROUTE_VERSION 切替で不整合になるので禁止。 -->
  <div class="route-tabs" id="routeTabs">
  </div>
</div>
<div id="app"></div>
<script src="shared-stores.js"></script>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbwe8_3Dp1U7an5wPVt8T2c2AXT6ltwM-T-bquI5IdGk4-uNCHtvd1Ifhn4MRv1-Oegp/exec';
// ラベル在庫アラート スナップショット（夜の再計算結果。日中は固定表示）。
// テスト環境では _propagate_test_env.py が /test/ 版に差し替える。
var LABEL_SNAPSHOT_URL = 'https://storage.googleapis.com/sakae-garden-snapshots/test/label_alert.json';
// STORE_DEFS / ROUTES は shared-stores.js でグローバル定義（window.STORE_DEFS / window.ROUTES）

// ===== 環境別 localStorage キー =====
// /nippo/test/ は本番と同一オリジンなので localStorage を共有してしまう。
// 環境固有の状態（テストGAS/テストシート由来のデータ）を持つキーは全て分離する。
// 判定は _propagate_test_env.py が LABEL_SNAPSHOT_URL を /test/ 版へ差し替えるのを利用。
// 本番のキー名は従来のまま（サフィックス無し）なので、既存ユーザーの値は失われない。
var IS_TEST_ENV = String(LABEL_SNAPSHOT_URL).indexOf('/test/') > -1;
function lsKey(base){ return base + (IS_TEST_ENV ? '_test' : ''); }
var LS_CONFIG           = lsKey('nippo_config');
var LS_HAITATSU_LATEST  = lsKey('haitatsu_latest');
var LS_SANCHI_ISSUED    = lsKey('sanchi_issued_today_v1');

var state = { screen:'home', route:0, store:null, formData:{}, staff:'', config:null, extraPrices:[], labelAlert:null, labelIssued:{}, labelIssuedTotal:null, manualIssueOpen:false, sanchiIssuedToday:0 };
var today = new Date();
var DAYS = ['日','月','火','水','木','金','土'];
var todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
document.getElementById('hDate').textContent = today.getFullYear()+'年'+(today.getMonth()+1)+'月'+today.getDate()+'日（'+DAYS[today.getDay()]+'）';

function loadConfig(cb) {
  var cached = localStorage.getItem(LS_CONFIG);
  state.config = cached ? (function(){ try{return JSON.parse(cached);}catch(e){return getDefaultConfig();} })() : getDefaultConfig();
  if (cb) cb();
  jsonp(API_URL+'?action=getConfig','cb_cfg',function(res){ if(res.success&&res.config){ state.config=res.config; localStorage.setItem(LS_CONFIG,JSON.stringify(res.config)); } },function(){});
}

function getDefaultConfig() {
  var c = {};
  Object.keys(STORE_DEFS).forEach(function(k){ c[STORE_DEFS[k].name]=''; });
  c['ヤオコー寄居店']='河野さん・竹山さん'; c['ヤオコーみどりが丘店']='杉田さん・川野さん';
  return { staff:['八島','青柳','杉','その他'], storeContacts:c };
}

// JSONP。GASの /exec は HTTP 200 で HTML 中間ページ（ログイン/リダイレクト）を返すことがあり、
// その場合スクリプトは「読み込み成功」扱いになり onerror も発火しないため、コールバックが
// 呼ばれたかを onload 後に確認して失敗判定する（無検知だとタイムアウトまで無言でぶら下がる）。
// called ラッチで onOk/onErr の二重呼び出しを防ぐ。timeoutMs は呼び出し側で指定可（既定30秒）。
var cbIdx=0;
function jsonp(url,base,onOk,onErr,timeoutMs) {
  var n=base+'_'+(cbIdx++), s=document.createElement('script');
  var called=false;
  var t=setTimeout(function(){cleanup();if(!called){called=true;if(onErr)onErr();}},timeoutMs||30000);
  function cleanup(){clearTimeout(t);delete window[n];if(s.parentNode)s.parentNode.removeChild(s);}
  window[n]=function(d){if(called)return;called=true;cleanup();onOk(d);};
  s.onload=function(){
    // script は実行完了したが window[n] が呼ばれていなければ失敗扱い（HTML中間ページ等）
    if(called) return;
    setTimeout(function(){
      if(called) return;
      called=true; cleanup(); if(onErr)onErr();
    },200);
  };
  s.onerror=function(){if(called)return;called=true;cleanup();if(onErr)onErr();};
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+n;
  document.body.appendChild(s);
}
// 冪等キー用UUID（crypto.randomUUID 非対応端末のフォールバック付き）
function _uuid(){
  try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0, v=(c==='x')?r:((r&0x3)|0x8); return v.toString(16);
  });
}
function showLoading(msg){var el=document.getElementById('lo');if(!el){el=document.createElement('div');el.id='lo';el.className='loading-overlay';el.innerHTML='<div class="loading-box"><div class="spinner"></div><br>'+(msg||'送信中...')+'</div>';document.body.appendChild(el);}}
function hideLoading(){var el=document.getElementById('lo');if(el)el.parentNode.removeChild(el);}

function setHeader(title,showBack,showTabs) {
  document.getElementById('hTitle').textContent=title;
  document.getElementById('backBtn').style.display=showBack?'':'none';
  document.getElementById('routeTabs').style.display=showTabs?'':'none';
}
// 経路タブを ROUTES から描画（本数・ラベルとも ROUTE_VERSION に追随する）
function renderRouteTabs(){
  var el=document.getElementById('routeTabs');
  if(!el || typeof ROUTES==='undefined') return;
  var h='';
  for(var i=0;i<ROUTES.length;i++){
    h+='<button class="rtab'+(i===state.route?' active':'')+'" id="tab'+i+'" onclick="switchRoute('+i+')">'+eH(ROUTES[i].label)+'</button>';
  }
  el.innerHTML=h;
}
function switchRoute(idx) {
  state.route=idx;
  for(var i=0;i<ROUTES.length;i++){ var t=document.getElementById('tab'+i); if(t) t.classList.toggle('active',i===idx); }
  renderHome();
}
// 未送信の入力があるか判定：state.formData に空でない値が1つでもあれば true。
// 「入力フォーム画面」時のみ有効（他画面では常に false = 確認不要）。
function hasUnsavedInput(){
  if(state.screen !== 'form') return false;
  if(!state.formData) return false;
  return Object.keys(state.formData).some(function(k){
    var v = state.formData[k];
    return v !== '' && v !== null && v !== undefined && String(v).trim() !== '';
  });
}
// ホームに戻る前の確認：未入力なら即許可、入力ありなら confirm ダイアログ
function confirmLeaveIfDirty(){
  if(!hasUnsavedInput()) return true;
  return confirm('送信していない入力があります。\n送信せずに戻りますか？');
}
function goBack(){ if(confirmLeaveIfDirty()) renderHome(); }

function renderHome() {
  state.screen='home';
  setHeader('🍄 配達日報',false,true);
  var cfg=state.config||getDefaultConfig(), route=ROUTES[state.route];
  var html='<div class="screen">'
    + '<a href="summary.html" class="summary-link-btn">📊 サマリーを見る</a>'
    + '<div class="action-row"><button class="action-btn" onclick="renderManual()"><span class="a-icon">📖</span>マニュアル</button><button class="action-btn" onclick="renderSettings()"><span class="a-icon">⚙️</span>設定</button></div>'
    // 並び順: ②産地シールのアラート（通知＋全社一括の発行指示枚数）→ 任意発行パネル。
    // 産地シールは全社共通1在庫なので、経路タブに関係なく常に同じ位置に出す。
    + renderSanchiAlert()
    + renderManualIssue();
  route.groups.forEach(function(g) {
    html+='<div class="sec-lbl">'+g.label+'</div><div class="store-list">';
    g.stores.forEach(function(id) {
      // ③値段シール：男衾・川本の店舗名の上に、アラート時のみ表示（値段ごとの発行入力欄付き）
      if(id==='obusuma'||id==='kawamoto'){ html+=renderNedanAlertForStore(id); }
      var s=STORE_DEFS[id], sub=(cfg.storeContacts&&cfg.storeContacts[s.name])||'';
      html+='<button class="store-btn '+s.cls+'" onclick="openStore(\''+id+'\')"><span class="si">'+s.icon+'</span><span class="sinfo"><span class="sname">'+s.name+'</span>'+(sub?'<br><span class="ssub">'+sub+'</span>':'')+'</span><span class="sarr">›</span></button>';
    });
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('app').innerHTML=html;
}

// ============ ラベル在庫アラート（②産地シール / ③値段シール） ============
// 夜生成のスナップショット(label_alert.json)を読み、店舗選択画面に表示する。
// 日中の発行入力は label_stock に追記されるが、スナップショットは夜まで再生成
// されないため、日中はアラートが固定表示される（その場では消えない）。
var _labelAlertFetched=false;
function fetchLabelAlert(){
  fetch(LABEL_SNAPSHOT_URL+'?_='+Date.now(),{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(j){
      if(j && (j.sanchi||j.nedan)){
        state.labelAlert=j; _labelAlertFetched=true;
        if(state.screen==='home') renderHome();
      }
    }).catch(function(){ /* スナップショット無し/取得失敗時はアラート非表示（機能は非破壊） */ });
}
// ===== 産地シール：当日の任意発行累計（localStorage 永続） =====
// 即時非表示の判定に使う。ページを開き直しても当日中は維持し、リロードで
// アラートが復活する事故を防ぐ。日付が変われば自動的に 0 から数え直す
// （翌朝の真値は夜間再計算＝スナップショット側で決まる）。
// キーは環境別（LS_SANCHI_ISSUED）。テストでの発行が本番のアラートを消す事故を防ぐ。
function _loadSanchiIssuedToday(){
  try{
    var r=JSON.parse(localStorage.getItem(LS_SANCHI_ISSUED)||'null');
    if(r && r.date===todayStr) return parseInt(r.count,10)||0;
  }catch(e){}
  return 0;
}
function _saveSanchiIssuedToday(n){
  try{ localStorage.setItem(LS_SANCHI_ISSUED, JSON.stringify({date:todayStr, count:n})); }catch(e){}
}

// ============ 産地シールの任意発行（アラート非表示時も常時使える） ============
// 現時点在庫 ＝ ライブの累計発行数（GAS getLabelIssuedTotal）− 前夜計算の累計消費
//              （スナップショット sanchi.delivered）。
// ＝「発行は最新・消費は前夜時点」。消費(−側)は朝4:45の再計算まで反映されない目安値。
// 取得失敗時は前夜計算の stock をそのまま表示（非破壊）。
function fetchLabelIssuedTotal(){
  jsonp(API_URL+'?action=getLabelIssuedTotal','cb_issued_total',function(res){
    if(res&&res.success&&typeof res.sanchi==='number'){
      state.labelIssuedTotal=res.sanchi;
      if(state.screen==='home') renderHome();
    }
  },function(){ /* 失敗時は前夜計算の在庫にフォールバック */ });
}
// 表示用の「現時点在庫」。スナップショット未取得なら null（'—' 表示）。
function currentSanchiStock(){
  var la=state.labelAlert;
  if(!la||!la.sanchi) return null;
  var s=la.sanchi;
  if(state.labelIssuedTotal!=null && typeof s.delivered==='number') return state.labelIssuedTotal-s.delivered;
  return (typeof s.stock==='number')?s.stock:null;
}
function renderManualIssue(){
  var stock=currentSanchiStock();
  var open=!!state.manualIssueOpen;
  var h='<div class="lbl-manual"><div class="lbl-manual-hdr">';
  h+='<button class="lbl-manual-btn" onclick="toggleManualIssue()">'
    +'<span class="lbl-manual-caret" id="lblManualCaret">'+(open?'−':'＋')+'</span>ラベルを発行する</button>';
  h+='<span class="lbl-manual-stock">現時点在庫：<b>'+(stock==null?'—':stock)+'</b>枚</span>';
  h+='</div>';
  h+='<div class="lbl-manual-body" id="lblManualBody"'+(open?'':' style="display:none"')+'>';
  h+='<div class="lbl-issue-wrap"><div class="lbl-issue-row">';
  h+='<span class="lbl-issue-lbl">発行枚数</span>';
  h+='<input type="text" inputmode="numeric" pattern="[0-9]*" id="manualInpSanchi" placeholder="発行数">';
  h+='<button class="lbl-issue-btn" onclick="issueSanchiManual()">発行</button>';
  if(state.sanchiIssuedToday>0) h+='<span class="lbl-issue-done">本日'+state.sanchiIssuedToday+'枚発行</span>';
  h+='</div></div>';
  h+='<div class="lbl-manual-note">※ ヤオコー産地シールのみ。全社共通の1在庫に加算されます。'
    +'消費（納品分）の反映は夜の再計算です。</div>';
  h+='</div></div>';
  return h;
}
// 開閉は再描画せず DOM 直操作（アラート側の入力欄を消さないため）
function toggleManualIssue(){
  state.manualIssueOpen=!state.manualIssueOpen;
  var b=document.getElementById('lblManualBody'), c=document.getElementById('lblManualCaret');
  if(b) b.style.display=state.manualIssueOpen?'':'none';
  if(c) c.textContent=state.manualIssueOpen?'−':'＋';
}
// 発行記録・在庫加算は従来と同一の仕組み（issueLabel → label_stock 追記）を流用。
// 経路の区別は廃止し、route列には固定で '任意' を入れる（在庫は全sanchi合算＝経路非依存）。
var SANCHI_MANUAL_ROUTE = '任意';
function issueSanchiManual(){
  var inp=document.getElementById('manualInpSanchi');
  var n=parseInt(((inp&&inp.value)||'').trim(),10);
  if(!n||n<=0){alert('発行数を入力してください');return;}
  state.manualIssueOpen=true;  // 発行後の再描画でも開いたまま
  _postIssue(_sanchiIssueUrl(n),'sanchi_manual',n);
}
function _sanchiIssueUrl(n){
  return API_URL+'?action=issueLabel&type='+encodeURIComponent('産地シール')
    +'&route='+encodeURIComponent(SANCHI_MANUAL_ROUTE)+'&count='+n+'&date='+todayStr
    +'&staff='+encodeURIComponent(state.staff||'');
}
// 全社一括の発行指示枚数。GAS が need を返さない古いスナップショットでもフロントで再現する
// （不足分 = 1000 − 在庫 → 上限200 → 10の位四捨五入）。
function _sanchiNeed(s){
  if(s.need!=null) return s.need;
  var target=(s.target!=null)?s.target:1000, cap=(s.cap!=null)?s.cap:200;
  var shortfall=(s.shortfall!=null)?s.shortfall:Math.max(target-(s.stock||0),0);
  return Math.round(Math.min(Math.max(shortfall,0),cap)/10)*10;
}
// ②産地シール アラート（通知＋全社一括の発行指示枚数のみ。発行操作は任意発行パネルに一本化）
function renderSanchiAlert(){
  var la=state.labelAlert;
  if(!la||!la.sanchi||!la.sanchi.alert) return '';
  var s=la.sanchi;
  var need=_sanchiNeed(s);
  // 即時非表示: 当日の任意発行累計が発行指示枚数に達したら当日中は消す。
  // 分割発行でも累計で判定。localStorage 永続なのでリロードしても復活しない。
  // しきい値(解除1000枚)超えは条件にしない＝指示枚数到達のみで消す。
  // 本判定は夜間再計算（persist は朝4:00-5:59）とは独立。
  if(need>0 && state.sanchiIssuedToday>=need) return '';
  var h='<div class="lbl-alert"><div class="lbl-alert-ttl">⚠️ 産地シール 残りわずか</div>';
  h+='<div class="lbl-alert-msg">前日在庫 <b>'+s.stock+'枚</b>。<b>'+need+'枚以上</b> 発行してください。</div>';
  if(state.sanchiIssuedToday>0){
    h+='<div class="lbl-alert-msg">本日の発行 <b>'+state.sanchiIssuedToday+'枚</b>（あと'+Math.max(need-state.sanchiIssuedToday,0)+'枚）</div>';
  }

}

    rows+='<button class="lbl-issue-btn" onclick="issueNedan(\''+eA(storeId)+'\',\''+eA(p)+'\')">発行</button>';
    if(issued>0) rows+='<span class="lbl-issue-done">これまで'+issued+'枚（規定'+need+'枚）</span>';

function issueNedan(storeId,price){
  var def=STORE_DEFS[storeId]; if(!def) return;
  var inp=document.getElementById('nedanInp_'+storeId+'_'+esc(price));

    +'&count='+n+'&date='+todayStr+'&staff='+encodeURIComponent(state.staff||'');
  _postIssue(url,'nedan_'+storeId+'_'+price,n);
}
// 発行の送信。二重記録防止:
//   F) 送信中は全発行ボタンを disabled（連打・再タップ封じ）
//   B) 操作ごとに reqId(UUID) を発番し、再試行は同じ reqId で再送 → GAS側で重複検知
//      （duplicate:true も success 扱い。ローカル加算は1回だけ）
//   C) 全試行が失敗しても、最後に reqId で「記録が入ったか」をサーバに確認する。
//      入っていれば成功扱い（誤ってもう一度発行させない＝別reqIdでの真の二重行を防ぐ）。
// タイムアウトは30秒（GAS実測で15〜25秒かかることがある。HTML中間ページは onload 検知で
// 即失敗するので、長めのタイムアウトでも体感は悪化しない）。
var ISSUE_MAX_ATTEMPTS = 3;
var ISSUE_RETRY_WAIT   = 2000;
var ISSUE_TIMEOUT      = 30000;
var _issueBusy = false;
function _setIssueBtnsDisabled(d){
  var b=document.querySelectorAll('.lbl-issue-btn');
  for(var i=0;i<b.length;i++) b[i].disabled=!!d;
}
// 発行成功時のローカル計上（1回の発行につき1度だけ呼ぶ）
function _countIssued(key,n){
  // 当日画面上の累積（複数回に分けて入力しても合算）。規定到達で即時非表示（renderHome内で判定）。
  state.labelIssued[key]=(state.labelIssued[key]||0)+n;
  if(key==='sanchi_manual'){
    // 産地シールの即時非表示は「当日の任意発行累計」で判定。localStorage に永続化。
    state.sanchiIssuedToday+=n;
    _saveSanchiIssuedToday(state.sanchiIssuedToday);
  }
}
function _postIssue(baseUrl,key,n){
  if(_issueBusy) return;                    // 送信中の再タップを無視
  _issueBusy=true; _setIssueBtnsDisabled(true);
  var reqId=_uuid();
  var url=baseUrl+'&reqId='+encodeURIComponent(reqId);
  function done(){ _issueBusy=false; _setIssueBtnsDisabled(false); hideLoading(); }
  function succeed(){
    done();
    _countIssued(key,n);
    // 産地シールはライブ累計発行数にも加算 →「現時点在庫」がその場で増える
    if(key.indexOf('sanchi_')===0 && state.labelIssuedTotal!=null) state.labelIssuedTotal+=n;
    renderHome();
  }
  // 全試行が通信エラーで終わった時、reqId で記録の有無をサーバに確認する
  function confirmOrFail(){
    hideLoading(); showLoading('記録を確認中...');
    jsonp(API_URL+'?action=getLabelIssuedTotal&reqId='+encodeURIComponent(reqId)+'&_cb='+Date.now(),
      'cb_issue_confirm',function(res){
        if(res&&res.success&&res.found){
          if(typeof res.sanchi==='number') state.labelIssuedTotal=res.sanchi;
          done();
          _countIssued(key,n);
          renderHome();
          return;
        }
        done(); alert('通信エラーで発行を記録できませんでした。');
      },function(){ done(); alert('通信エラーで発行を記録できませんでした。\n記録されたか不明です。時間をおいて在庫表示をご確認ください。'); },
      ISSUE_TIMEOUT);
  }
  function attempt(i){
    hideLoading();
    showLoading(i===0?'発行を記録中...':'発行を記録中...（再試行 '+i+'/'+(ISSUE_MAX_ATTEMPTS-1)+'）');
    // _cb はGoogle側リダイレクト状態のリフレッシュ用（冪等キーではない）
    jsonp(url+'&_cb='+Date.now()+'_'+i,'cb_issue',function(res){
      // duplicate:true（同じreqIdの再送）も success として1回だけ計上する
      if(res&&res.success){ succeed(); return; }
      // ロック競合など retryable なサーバエラーは同じ reqId で再送
      if(res&&res.retryable&&i+1<ISSUE_MAX_ATTEMPTS){ setTimeout(function(){attempt(i+1);},ISSUE_RETRY_WAIT); return; }
      done(); alert('発行の記録に失敗しました。\n'+((res&&res.error)||''));
    },function(){
      if(i+1<ISSUE_MAX_ATTEMPTS){ setTimeout(function(){attempt(i+1);},ISSUE_RETRY_WAIT); return; }
      confirmOrFail();
    },ISSUE_TIMEOUT);
  }
  attempt(0);
}

function openStore(id) {
  state.store=STORE_DEFS[id]; state.formData={}; state.staff=''; state.extraPrices=[]; state.screen='form';
  // 配達商品情報（haitatsu）の当日分があれば納品数のデフォルト値として反映（localStorage 即読み・0ms）
  applyHaitatsuDefault(id);
  // 同一日・同一経路で先に送信した担当者があれば自動選択（誤タップ抑止のため送信成功時のみ記憶）
  applyStaffMemory(id);
  setHeader(state.store.name,true,false); renderForm();
  // バックグラウンドで getHaitatsu を fetch して localStorage を更新（既存表示は待たない・次回反映）
  fetchHaitatsuBackground();
}

// ===== 担当者の経路内自動引継 =====
// 保存: 送信成功時のみ (誤タップ波及防止)
// キー: LS_STAFF_MEMORY = { date:'YYYY-MM-DD', byRoute:{routeId: staffName} }
// 日次リセット: date が todayStr と異なれば全破棄
// 経路判定: ROUTES[i].groups[j].stores に storeId が含まれる経路
var LS_STAFF_MEMORY = lsKey('staff_by_route_v1');

function _routeIdOfStore(storeId){
  if(typeof ROUTES==='undefined') return null;
  for(var i=0;i<ROUTES.length;i++){
    var r = ROUTES[i];
    for(var j=0;j<r.groups.length;j++){
      if(r.groups[j].stores.indexOf(storeId) >= 0) return r.id;
    }
  }
  return null;
}

function _storeIdOfName(name){
  // state.store は STORE_DEFS の値なので、name→id 逆引き
  if(typeof STORE_DEFS==='undefined') return null;
  var ids = Object.keys(STORE_DEFS);
  for(var i=0;i<ids.length;i++){
    if(STORE_DEFS[ids[i]].name === name) return ids[i];
  }
  return null;
}

function rememberStaff(store, staff){
  if(!store || !staff) return;
  var storeId = _storeIdOfName(store.name);
  if(!storeId) return;
  var routeId = _routeIdOfStore(storeId);
  if(!routeId) return;  // どの経路にも属さない店舗は対象外
  try {
    var raw = localStorage.getItem(LS_STAFF_MEMORY);
    var mem = raw ? JSON.parse(raw) : null;
    if(!mem || mem.date !== todayStr) mem = { date: todayStr, byRoute: {} };
    if(!mem.byRoute) mem.byRoute = {};
    mem.byRoute[routeId] = staff;
    localStorage.setItem(LS_STAFF_MEMORY, JSON.stringify(mem));
  } catch(e){ /* 容量超は無視 */ }
}

function applyStaffMemory(id){
  // 呼出時点で state.staff は '' に初期化されているが、防御的にチェック
  if(state.staff) return;
  try {
    var raw = localStorage.getItem(LS_STAFF_MEMORY);
    if(!raw) return;
    var mem = JSON.parse(raw);
    if(!mem || mem.date !== todayStr) return;  // 日次リセット
    var routeId = _routeIdOfStore(id);
    if(!routeId) return;
    var s = mem.byRoute && mem.byRoute[routeId];
    if(s) state.staff = s;
  } catch(e){}
}

// localStorage から当日の配達商品情報を読んで state.formData['納品_'+price] にセット
// 同期処理。失敗は黙殺（起動を絶対に止めない）。
function applyHaitatsuDefault(id) {
  try {
    var def = STORE_DEFS[id];
    if(!def) return;
    var raw = localStorage.getItem(LS_HAITATSU_LATEST);
    if(!raw) return;
    var all = JSON.parse(raw);
    var entry = all && all[def.name];
    if(!entry || !entry.prices) return;
    Object.keys(entry.prices).forEach(function(price){
      var v = entry.prices[price];
      if(v!==''&&v!==null&&v!==undefined) state.formData['納品_'+price] = String(v);
    });
  } catch(e) {}
}

var _haitatsuBgInflight = false;
function fetchHaitatsuBackground() {
  if(_haitatsuBgInflight) return;
  _haitatsuBgInflight = true;
  // 日付キー廃止：常に最新1セットを取得
  jsonp(API_URL+'?action=getHaitatsu','cb_hai',function(res){
    _haitatsuBgInflight = false;
    if(res && res.success && res.items){
      try { localStorage.setItem(LS_HAITATSU_LATEST, JSON.stringify(res.items)); } catch(e){}
    }
  },function(){ _haitatsuBgInflight = false; });
}

function bTable(prices, isYaokoLike, hasSosei) {

    ? (hasSosei ? ['納品','陳列数','蘇生庫','値引き','持ち帰り']
                : ['納品','陳列数','値引き','持ち帰り'])
    : (isTamaya ? ['納品','前日在庫','値引き','持ち帰り']
                : ['納品','前日在庫','持ち帰り']);
  var colCls = {
    '納品':'ctl-green','陳列数':'ctl-blue','蘇生庫':'ctl-purple',
    '持ち帰り':'ctl-orange','値引き':'ctl-red','前日在庫':'ctl-brown'

  var h='<div class="itbl-wrap"><table class="itbl"><thead><tr>';
  h+='<th class="itbl-price">価格</th>';
  cols.forEach(function(c){ h+='<th class="itbl-col '+colCls[c]+'">'+c+'</th>'; });
  h+='</tr></thead><tbody>';
  prices.forEach(function(p){
    h+='<tr><td class="itbl-price">'+eH(p)+'</td>';
    cols.forEach(function(c){
      var key = c+'_'+p;
      var v = state.formData[key] || '';
      h+='<td class="itbl-cell '+colCls[c]+'"><input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="'+eA(v)+'" oninput="upd(\''+eA(key)+'\',this.value)"></td>';
    });
    h+='</tr>';
  });
  // 追加商品行（ヤオコー・直売所）
  if(state.store.type==='yaoko' || state.store.type==='choku'){
    state.extraPrices.forEach(function(p){
      var suffix='臨#'+p;
      h+='<tr class="itbl-extra"><td class="itbl-price">➕'+eH(p)+'</td>';
      cols.forEach(function(c){
        var key = c+'_'+suffix;
        var v = state.formData[key] || '';
        h+='<td class="itbl-cell '+colCls[c]+'"><input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="'+eA(v)+'" oninput="upd(\''+eA(key)+'\',this.value)"></td>';
      });

  h+='</tbody></table></div>';

    h+='<div class="itbl-actions"><button class="apply-mini" onclick="applyToChin()">→ 納品数を陳列数に一括反映</button></div>';
  }
  return h;

// bExtraSales: 廃止（追加商品の販売数手入力欄はエスマルシェ自動取得により不要）

// 残る可能性があるが、入力UIが無いため上書き機会がなく、送信時にそのまま送られる。
// 通常は esmarche が別途書き込むためデータ側は問題なし。
function frow(label,key,isExtra) {
  var v=state.formData[key]||'';
  var unit=(state.store.units&&state.store.units[label])?state.store.units[label]:'個';
  return '<div class="frow'+(isExtra?' extra':'')+'"><span class="frow-lbl">'+label+'</span><div class="frow-inp"><input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="'+eA(v)+'" oninput="upd(\''+eA(key)+'\',this.value)"><span class="frow-unit">'+unit+'</span></div></div>';

function addExtraPrice() {
  // prompt を廃止し、inputmode="numeric" のHTML入力モーダルで金額入力（数字テンキー対応）
  showPriceModal(function(v){
    if(v===null) return;
    v=String(v).trim().replace(/[¥￥]/g,'').replace(/[,，]/g,'');
    var n=parseInt(v,10);
    if(!n||n<=0||isNaN(n)){alert('正の整数を入力してください');return;}
    var label='¥'+n;
    if(state.extraPrices.indexOf(label)>-1){alert(label+'は既に追加されています');return;}
    if((state.store.prices||[]).indexOf(label)>-1){alert('既存価格('+label+')と同じです。追加できません。');return;}
    state.extraPrices.push(label);
    state.extraPrices.sort(function(a,b){return parseInt(a.replace('¥',''),10)-parseInt(b.replace('¥',''),10);});
    renderForm();
  });
}
// 金額入力モーダル（type=text inputmode=numeric pattern=[0-9]* で正の整数テンキー）
function showPriceModal(cb){
  var ov=document.createElement('div');
  ov.className='price-modal-ov';
  ov.innerHTML='<div class="price-modal"><div class="price-modal-ttl">追加する商品の価格（円）</div>'
    +'<input type="text" inputmode="numeric" pattern="[0-9]*" class="price-modal-inp" placeholder="例：158" maxlength="6">'
    +'<div class="price-modal-btns"><button type="button" class="price-modal-cancel">キャンセル</button><button type="button" class="price-modal-ok">追加</button></div></div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector('.price-modal-inp');
  var done=false;
  function close(val){ if(done)return; done=true; if(ov.parentNode)ov.parentNode.removeChild(ov); cb(val); }
  ov.querySelector('.price-modal-ok').onclick=function(){ close(inp.value); };
  ov.querySelector('.price-modal-cancel').onclick=function(){ close(null); };

function shiftDate(ds, days) {
  var d = new Date(ds+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function tryLoadDate(date, isFallback) {
  var btn = document.getElementById('loadBtn');
  var url = API_URL
    + '?action=getStoreData'
    + '&store=' + encodeURIComponent(state.store.name)
    + '&date=' + date;

  jsonp(url, 'cb_load', function(res) {
    if (!res.success) {
      if (!isFallback) {
        // 今日のデータが無ければ前日を試す（前日値引き継ぎ）
        tryLoadDate(shiftDate(todayStr, -1), true);
        return;
      }
      alert('本日・前日の保存データはありません。');
      if (btn) { btn.disabled = false; btn.textContent = '📥 保存済みデータを読み込む'; }
      return;
    }
    // 担当者は今日のデータからのみ反映（前日fallback時は触らない）
    if (res.staff && !isFallback) state.staff = res.staff;

    // formData / extraPrices をリセット
    state.formData = {};
    state.extraPrices = [];

    // GASのキー形式（例: "S品_¥99（個）"）→ アプリのキー形式（"S品_¥99"）に変換
    if (res.items) {
      Object.keys(res.items).forEach(function(key) {
        var cleanKey = key.replace('（個）', '').replace('（kg）', '');
        state.formData[cleanKey] = res.items[key];
        // 元のキーそのままも保持（互換性）
        state.formData[key] = res.items[key];
        // 追加商品（内部識別子: 臨#）をキーから抽出
        var m = cleanKey.match(/_臨#(¥\d+)/);
        if (m && state.extraPrices.indexOf(m[1])<0) state.extraPrices.push(m[1]);
      });
    }
    state.extraPrices.sort(function(a,b){return parseInt(a.replace('¥',''),10)-parseInt(b.replace('¥',''),10);});

    // 【後方互換】旧S品+A品+B品 → 陳列数、旧C品 → 値引き への統合
    // 過去データ (2026-07-02以前の S/A/B/C 形式) を新形式にマップ。
    // 新形式データ（陳列数_/値引き_）が既にあれば旧値を上書きしない。
    var suffixes = (state.store.prices||[]).slice();
    (state.extraPrices||[]).forEach(function(pp){ suffixes.push('臨#'+pp); });
    suffixes.forEach(function(sf){
      // 陳列数: 新形式なければ S+A+B 合計を採用
      if(state.formData['陳列数_'+sf] === undefined || state.formData['陳列数_'+sf] === ''){
        var sum=0, hasAny=false;
        ['S品','A品','B品'].forEach(function(cat){
          var v = state.formData[cat+'_'+sf];
          if(v!==undefined && v!==''){ sum += parseInt(v)||0; hasAny=true; }
        });
        if(hasAny) state.formData['陳列数_'+sf] = String(sum);
      }
      // 値引き: 新形式なければ C品 を採用
      if((state.formData['値引き_'+sf]===undefined || state.formData['値引き_'+sf]==='') &&
         state.formData['C品_'+sf]!==undefined && state.formData['C品_'+sf]!==''){
        state.formData['値引き_'+sf] = state.formData['C品_'+sf];
      }
      // 旧S/A/B/Cキーは削除（送信時に旧列を書かないため）
      ['S品','A品','B品','C品'].forEach(function(cat){
        delete state.formData[cat+'_'+sf];
        delete state.formData[cat+'_'+sf+'（個）'];
      });
    });

    // フォームを再描画
    renderForm();
    // 読み込み完了メッセージ
    var newBtn = document.getElementById('loadBtn');
    if (newBtn) {
      if (isFallback) {
        newBtn.textContent = '📥 '+date.slice(5).replace('-','/')+'(前日)を読込';
      } else {
        newBtn.textContent = '✅ 読み込み完了';
      }
      newBtn.disabled = true;
    }
  }, function() {
    alert('データの取得に失敗しました。');
    var newBtn = document.getElementById('loadBtn');
    if (newBtn) { newBtn.disabled = false; newBtn.textContent = '📥 保存済みデータを読み込む'; }
  });
}


// 日報送信。二重記録防止:
//   F) 送信中は送信ボタンを disabled ＋ _submitBusy で多重送信を無視
//   B) 送信操作ごとに reqId(UUID) を発番。自動リトライは同じ reqId で再送し、
//      GAS側が同一 date × reqId の行を検知して追記しない（duplicate:true）。
//      値を直しての「別の送信操作」は別 reqId → 従来どおり追記＋読み側マージで反映。
//   C) 全試行が通信エラーで終わったら getSubmitStatus で記録の有無を確認し、
//      入っていれば成功扱い（誤った再送信＝別reqIdでの真の二重行を防ぐ）。
var SUBMIT_MAX_ATTEMPTS = 3;
var SUBMIT_RETRY_WAIT   = 2000;
var SUBMIT_TIMEOUT      = 30000;
var _submitBusy = false;
function _setSubmitBtnDisabled(d){
  var b=document.getElementById('submitBtn');
  if(b) b.disabled=!!d;
}
function doSubmit() {
  if(_submitBusy) return;                    // 送信中の再タップを無視
  if(!state.staff){alert('担当者を選択してください');return;}
  var items=[];
  Object.keys(state.formData).forEach(function(k){var v=state.formData[k];if(v!==''&&v!==null&&v!==undefined)items.push({key:k,value:String(v)});});
  var store=state.store, staff=state.staff;
  var reqId=_uuid();
  var url=API_URL+'?action=submit&store='+encodeURIComponent(store.name)+'&date='+todayStr
    +'&staff='+encodeURIComponent(staff)+'&items='+encodeURIComponent(JSON.stringify(items))
    +'&reqId='+encodeURIComponent(reqId);
  _submitBusy=true; _setSubmitBtnDisabled(true);
  function fail(msg){ _submitBusy=false; hideLoading(); _setSubmitBtnDisabled(false); alert(msg); }
  function succeed(){ _submitBusy=false; hideLoading(); rememberStaff(store, staff); renderDone(); }
  // 全試行が通信エラー。記録されたかを reqId でサーバに確認する。
  function confirmOrFailSubmit(){
    hideLoading(); showLoading('送信を確認中...');
    jsonp(API_URL+'?action=getSubmitStatus&store='+encodeURIComponent(store.name)
      +'&date='+todayStr+'&reqId='+encodeURIComponent(reqId)+'&_cb='+Date.now(),
      'cb_sub_confirm',function(res){
        if(res&&res.success&&res.found){ succeed(); return; }
        fail('通信エラーが発生しました。\nインターネット接続を確認してください。');
      },function(){
        fail('通信エラーが発生しました。\n送信されたか不明です。時間をおいてサマリーをご確認ください。');
      },SUBMIT_TIMEOUT);
  }
  function attempt(i){
    hideLoading();
    showLoading(i===0?'送信中...':'再送信中...（'+i+'/'+(SUBMIT_MAX_ATTEMPTS-1)+'）');
    // _cb はGoogle側リダイレクト状態のリフレッシュ用（冪等キーではない）
    jsonp(url+'&_cb='+Date.now()+'_'+i,'cb_sub',function(res){
      // duplicate:true（同じreqIdの再送）も success として扱う
      if(res&&res.success){ succeed(); return; }
      // ロック競合など retryable なサーバエラーは同じ reqId で再送
      if(res&&res.retryable&&i+1<SUBMIT_MAX_ATTEMPTS){ setTimeout(function(){attempt(i+1);},SUBMIT_RETRY_WAIT); return; }
      fail('送信に失敗しました。\n'+((res&&res.error)||'')+'\nもう一度お試しください。');
    },function(){
      if(i+1<SUBMIT_MAX_ATTEMPTS){ setTimeout(function(){attempt(i+1);},SUBMIT_RETRY_WAIT); return; }
      confirmOrFailSubmit();
    },SUBMIT_TIMEOUT);
  }
  attempt(0);
}

// 設定保存。従来は onOk/onErr とも空関数で、応答前に無条件で「✅保存しました」を出していた
// （＝サーバに届かなくても成功に見えるサイレント失敗）。
//   ・success:true を必ず検証し、success:false／通信エラーは alert で明示する
//   ・保存直後に getConfig で読み戻し、保存内容と一致して初めて成功表示する
//   ・localStorage への反映も「サーバ保存＋読み戻し一致」を確認できてから行う
//     （失敗した設定を端末に残さない。次回起動時のサーバ値との食い違いを防ぐ）
// saveConfig は冪等な上書きなので reqId dedup は不要。
var SAVECFG_TIMEOUT = 30000;
function _cfgKey(c){
  // 比較用の正規化（キー順に依存しない）
  var sc={}; Object.keys((c&&c.storeContacts)||{}).sort().forEach(function(k){ sc[k]=String(c.storeContacts[k]||''); });
  return JSON.stringify({ staff:((c&&c.staff)||[]).map(String), storeContacts:sc });
}
var _saveCfgBusy=false;
function saveCfg(){
  if(_saveCfgBusy) return;
  var cfg=window._ec;
  var btn=document.querySelector('.save-btn');
  _saveCfgBusy=true; if(btn){btn.disabled=true;}
  showLoading('設定を保存中...');
  function done(){ _saveCfgBusy=false; hideLoading(); if(btn){btn.disabled=false;} }
  function failed(msg){ done(); alert('設定の保存に失敗しました。\n'+msg+'\nもう一度お試しください。'); }
  jsonp(API_URL+'?action=saveConfig&data='+encodeURIComponent(JSON.stringify(cfg))+'&_cb='+Date.now(),
    'cb_sc',function(res){
      if(!res||res.success!==true){ failed((res&&res.error)||'サーバエラー'); return; }
      // 読み戻し検証: サーバの保存結果が送った内容と一致するか
      hideLoading(); showLoading('保存内容を確認中...');
      jsonp(API_URL+'?action=getConfig&_cb='+Date.now(),'cb_sc_verify',function(v){
        if(!v||v.success!==true||!v.config){ failed('保存内容を確認できませんでした'); return; }
        if(_cfgKey(v.config)!==_cfgKey(cfg)){ failed('保存内容がサーバの値と一致しません'); return; }
        // ここで初めて端末側にも反映
        localStorage.setItem(LS_CONFIG,JSON.stringify(cfg));
        state.config=cfg;
        done();
        var m=document.getElementById('settingsMsg');
        if(m){ m.style.display='block'; setTimeout(function(){m.style.display='none';},2000); }
        else { alert('設定を保存しました。'); }
      },function(){ failed('保存内容の確認が通信エラーになりました'); },SAVECFG_TIMEOUT);
    },function(){ failed('通信エラーが発生しました'); },SAVECFG_TIMEOUT);
}

// 当日の任意発行累計を localStorage から復元（リロードでアラートが復活しないように）
state.sanchiIssuedToday = _loadSanchiIssuedToday();
renderRouteTabs();
loadConfig(function(){ renderHome(); fetchHaitatsuBackground(); fetchLabelAlert(); fetchLabelIssuedTotal(); });
</script>
